<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chicken Road Cross - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg-dark);
  font-family: 'Poppins', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

.gameContainer {
  max-width: 480px;
  margin: 0 auto;
  background: var(--card-bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 30px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #020307;
  border-bottom: 1px solid var(--border-color);
}
.back-btn {
  padding: 6px 12px;
  background: var(--border-color);
  color: var(--neon-blue);
  border: 1px solid var(--neon-blue);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 11px;
  text-decoration: none;
}
.balance-pill {
  background: linear-gradient(135deg, #1e1b4b, #0f172a);
  border: 1px solid var(--neon-gold);
  border-radius: 20px;
  padding: 4px 14px;
  font-weight: 800;
  font-size: 13px;
  color: var(--neon-gold);
}

/* ROAD TRACK ARENA */
.road-arena {
  background: radial-gradient(circle, #0f172a 0%, #04060d 100%);
  margin: 12px;
  border: 2px solid var(--border-color);
  border-radius: 24px;
  padding: 16px 10px;
  text-align: center;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}

.lanes-vertical {
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  margin-top: 10px;
}

.lane-row {
  background: #02040a;
  border: 2px solid #1e293b;
  border-radius: 12px;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: border-color 0.2s, background 0.2s;
}
.lane-row.active-lane {
  border-color: var(--neon-gold);
  background: rgba(245, 158, 11, 0.1);
  box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
}
.lane-row.passed-lane {
  border-color: var(--neon-green);
  background: rgba(16, 185, 129, 0.1);
}

.lane-step-btn {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  border: 1px solid #334155;
  color: #fff;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.lane-step-btn:active { transform: scale(0.95); }

/* STATS BAR */
.stats-bar {
  display: flex;
  justify-content: space-between;
  background: #02040a;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 11px;
  margin-bottom: 12px;
}

/* CONTROLS CARD */
.controls-card {
  background: #04060d;
  margin: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
}

.bet-adjuster {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.adjust-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: #1e293b;
  border: 1px solid #334155;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}
.bet-val {
  background: #0f172a;
  border: 1px solid var(--border-color);
  padding: 6px 16px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 15px;
  color: var(--neon-gold);
  min-width: 90px;
}

.btn-start {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--neon-blue), #0284c7);
  color: #000;
  font-weight: 900;
  font-size: 14px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
  text-transform: uppercase;
}

.btn-cashout {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--neon-gold), #d97706);
  color: #000;
  font-weight: 900;
  font-size: 14px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
  text-transform: uppercase;
  display: none;
}

/* MODAL POPUP */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--card-bg);
  border: 2px solid var(--neon-gold);
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  width: 85%;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
</style>
</head>

<body>
<div class="gameContainer">

  <!-- RESULT MODAL -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <div id="modalIcon" style="font-size:48px; margin-bottom:8px;">🐔</div>
      <h3 id="modalTitle" style="color:#fff; font-size:18px; margin:0 0 4px 0;">RESULT</h3>
      <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 16px 0;">Details</p>
      <button onclick="closeModal()" style="width:100%; padding:12px; background:var(--neon-gold); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">CONTINUE</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header-bar">
    <a href="../game.html" class="back-btn">⬅️ Arena Hub</a>
    <div class="balance-pill">
      <span>💰</span>
      <span id="balanceVal">₹10,000</span>
    </div>
  </header>

  <div style="text-align:center; padding:8px 0 2px 0;">
    <h2 style="margin:0; font-size:20px; color:var(--neon-gold);">🐔 CHICKEN ROAD CROSS 🛣️</h2>
    <span style="font-size:10px; color:#94a3b8;">STEP LIL CHICKEN • AVOID CAR BUST • CASHOUT MULTIPLIER</span>
  </div>

  <!-- ROAD ARENA -->
  <div class="road-arena">
    <div class="stats-bar">
      <span>Current Step: <b style="color:var(--neon-blue);" id="stepTxt">0 / 6</b></span>
      <span>Multiplier: <b style="color:var(--neon-gold);" id="multiTxt">1.00X</b></span>
    </div>

    <!-- LANES -->
    <div class="lanes-vertical" id="lanesContainer">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-card">
    <div style="font-size:10px; color:#94a3b8; margin-bottom:6px;">BET AMOUNT</div>
    <div class="bet-adjuster">
      <button class="adjust-btn" onclick="changeBet(-50)">-</button>
      <div class="bet-val" id="betDisplay">₹100</div>
      <button class="adjust-btn" onclick="changeBet(50)">+</button>
    </div>

    <button class="btn-start" id="btnStart" onclick="startRoad()">START RUN 🐔</button>
    <button class="btn-cashout" id="btnCashout" onclick="cashoutRun()">CASHOUT ₹<span id="cashoutAmt">0</span></button>

    <div style="margin-top:10px;">
      <button onclick="resetWallet()" style="padding:4px 12px; background:var(--border-color); color:var(--neon-blue); border:1px solid var(--neon-blue); border-radius:6px; font-size:10px; font-weight:700; cursor:pointer;">🔄 Reset Wallet</button>
    </div>
  </div>

</div>

<script>
// WEB AUDIO API SOUND GENERATOR
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;

    if (type === 'step') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(700 + Math.random() * 150, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'bust') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.35);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.08);
        g.gain.setValueAtTime(0.2, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.3);
      });
    }
  } catch(e) {}
}

// GAME STATE
let balance = parseInt(localStorage.getItem('rwin_balance') || '10000');
let betAmount = 100;
let currentStep = 0;
let isRunActive = false;

const stepMultipliers = [1.20, 1.60, 2.30, 3.80, 6.50, 12.00];

function saveBalance() {
  localStorage.setItem('rwin_balance', balance.toString());
  document.getElementById('balanceVal').innerText = "₹" + balance.toLocaleString();
}

function resetWallet() {
  playSound('step');
  balance = 10000;
  saveBalance();
  showModal("🔄 WALLET RESET", "Practice Balance restored to ₹10,000!", "💰", true);
}

function changeBet(diff) {
  if (isRunActive) return;
  playSound('step');
  betAmount = Math.max(50, Math.min(5000, betAmount + diff));
  document.getElementById('betDisplay').innerText = "₹" + betAmount;
}

function renderLanes() {
  const container = document.getElementById('lanesContainer');
  let html = "";
  for (let i = 0; i < 6; i++) {
    let multi = stepMultipliers[i];
    html += `<div class="lane-row" id="lane-${i}">
      <span style="font-size:12px; font-weight:800; color:#94a3b8;">LANE ${i + 1}</span>
      <span style="font-size:13px; font-weight:900; color:var(--neon-gold);">${multi.toFixed(2)}X</span>
      <button class="lane-step-btn" id="stepBtn-${i}" onclick="takeStep(${i})">STEP 🐔</button>
    </div>`;
  }
  container.innerHTML = html;
}

function startRun() {
  if (balance < betAmount) {
    showModal("⚠️ LOW BALANCE", "Not enough coins! Reset balance to play.", "💰", false);
    return;
  }

  balance -= betAmount;
  saveBalance();

  isRunActive = true;
  currentStep = 0;

  renderLanes();
  updateLaneUI();

  document.getElementById('btnStart').style.display = "none";
  document.getElementById('btnCashout').style.display = "block";
  document.getElementById('cashoutAmt').innerText = betAmount;
  document.getElementById('stepTxt').innerText = "0 / 6";
  document.getElementById('multiTxt').innerText = "1.00X";
}

function updateLaneUI() {
  for (let i = 0; i < 6; i++) {
    const laneEl = document.getElementById('lane-' + i);
    const btnEl = document.getElementById('stepBtn-' + i);

    laneEl.classList.remove('active-lane', 'passed-lane');

    if (i < currentStep) {
      laneEl.classList.add('passed-lane');
      btnEl.innerText = "PASSED ✅";
      btnEl.disabled = true;
    } else if (i === currentStep && isRunActive) {
      laneEl.classList.add('active-lane');
      btnEl.innerText = "CROSS 🐔";
      btnEl.disabled = false;
    } else {
      btnEl.innerText = "LOCKED 🔒";
      btnEl.disabled = true;
    }
  }
}

function takeStep(stepIdx) {
  if (!isRunActive || stepIdx !== currentStep) return;

  // 20% Car Bust Chance per lane
  let isBust = Math.random() < 0.20;

  if (isBust) {
    playSound('bust');
    isRunActive = false;
    document.getElementById('btnStart').style.display = "block";
    document.getElementById('btnCashout').style.display = "none";

    showModal("💥 CAR BUST!", "A car hit the chicken! Better luck next run.", "💔", false);
  } else {
    playSound('step');
    currentStep++;
    let multi = stepMultipliers[currentStep - 1];

    document.getElementById('stepTxt').innerText = currentStep + " / 6";
    document.getElementById('multiTxt').innerText = multi.toFixed(2) + "X";

    let cashoutVal = Math.floor(betAmount * multi);
    document.getElementById('cashoutAmt').innerText = cashoutVal.toLocaleString();

    updateLaneUI();

    if (currentStep === 6) {
      cashoutRun();
    }
  }
}

function cashoutRun() {
  if (!isRunActive || currentStep === 0) return;

  let multi = stepMultipliers[currentStep - 1];
  let wonAmount = Math.floor(betAmount * multi);

  balance += wonAmount;
  saveBalance();

  playSound('win');
  isRunActive = false;

  document.getElementById('btnStart').style.display = "block";
  document.getElementById('btnCashout').style.display = "none";

  showModal("🎉 CHICKEN CASHOUT!", `Crossed ${currentStep} Lanes @ ${multi.toFixed(2)}X Multiplier!\nYou Won ₹${wonAmount.toLocaleString()}!`, "🏆", true);
}

function showModal(title, msg, icon, isWin) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalMsg').innerText = msg;
  document.getElementById('modalIcon').innerText = icon;
  document.getElementById('modalBox').style.borderColor = isWin ? "var(--neon-gold)" : "var(--neon-red)";
  document.getElementById('resultModal').style.display = "flex";
}

function closeModal() {
  playSound('step');
  document.getElementById('resultModal').style.display = "none";
}

// INITIALIZE
saveBalance();
renderLanes();
</script>
</body>
</html>
