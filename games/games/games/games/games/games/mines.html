<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Minesweeper - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-gold: #f59e0b;
  --neon-red: #ef4444;
  --bg-dark: #050811;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; }
.gameContainer { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; position: relative; padding-bottom: 20px; }

/* HEADER */
.header-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #070a14; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px; text-decoration: none; }
.balance-pill { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid var(--neon-blue); border-radius: 20px; padding: 4px 14px; font-weight: 800; font-size: 13px; color: var(--neon-blue); }

/* CONTROL PANEL */
.control-box { background: #070a14; margin: 12px; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; }
.control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

.input-label { font-size: 10px; color: #94a3b8; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
.selector-row { display: flex; align-items: center; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 2px; }
.adjust-btn { width: 32px; height: 32px; background: #1e293b; border: none; color: #fff; font-weight: 800; font-size: 16px; border-radius: 6px; cursor: pointer; }
.val-display { flex: 1; text-align: center; font-weight: 800; font-size: 13px; color: var(--neon-gold); }

/* 5x5 MINES GRID */
.mines-board-card { background: #04060d; margin: 0 12px 12px 12px; border: 1px solid var(--border-color); border-radius: 20px; padding: 14px; text-align: center; }
.mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
.mine-tile { aspect-ratio: 1; background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #334155; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: transform 0.15s, background 0.2s, border-color 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.mine-tile:active { transform: scale(0.92); }
.mine-tile.revealed-gem { background: linear-gradient(135deg, #064e3b, #022c22); border-color: var(--neon-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
.mine-tile.revealed-bomb { background: linear-gradient(135deg, #7f1d1d, #450a0a); border-color: var(--neon-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }

/* DYNAMIC STATS */
.stats-bar { display: flex; justify-content: space-between; background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 12px; font-size: 11px; margin-bottom: 12px; }

/* DYNAMIC ACTION BUTTON */
.action-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.1s; }
.btn-start { background: linear-gradient(135deg, var(--neon-blue), #0284c7); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
.btn-cashout { background: linear-gradient(135deg, var(--neon-gold), #d97706); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }

/* MODAL POPUP */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
.modal-box { background: var(--card-bg); border: 2px solid var(--neon-green); border-radius: 20px; padding: 22px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
</style>
</head>

<body>
<div class="gameContainer">

  <!-- MODAL POPUP -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <div id="modalIcon" style="font-size:48px; margin-bottom:8px;">💎</div>
      <h3 id="modalTitle" style="color:#fff; font-size:18px; margin:0 0 4px 0;">RESULT</h3>
      <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 16px 0;">Details</p>
      <button onclick="closeModal()" style="width:100%; padding:12px; background:var(--neon-green); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">CONTINUE</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header-bar">
    <a href="../game.html" class="back-btn">⬅️ Arena Hub</a>
    <div class="balance-pill">
      <span>💰</span>
      <span id="balanceVal">₹10,000</span>
    </div>
  </header>

  <div style="text-align:center; padding:10px 0 2px 0;">
    <h2 style="margin:0; font-size:20px; color:var(--neon-blue);">💣 CYBER MINES 💎</h2>
    <span style="font-size:10px; color:#94a3b8;">PICK GEMS • AVOID BOMBS • CASHOUT ANYTIME</span>
  </div>

  <!-- CONTROLS -->
  <div class="control-box">
    <div class="control-grid">
      <div>
        <div class="input-label">Bet Amount</div>
        <div class="selector-row">
          <button class="adjust-btn" onclick="changeBet(-50)">-</button>
          <div class="val-display" id="betDisplay">₹100</div>
          <button class="adjust-btn" onclick="changeBet(50)">+</button>
        </div>
      </div>
      <div>
        <div class="input-label">Mines Count</div>
        <div class="selector-row">
          <button class="adjust-btn" onclick="changeMines(-1)">-</button>
          <div class="val-display" id="minesDisplay" style="color:var(--neon-red);">3 💣</div>
          <button class="adjust-btn" onclick="changeMines(1)">+</button>
        </div>
      </div>
    </div>
    <button class="action-btn btn-start" id="mainActionBtn" onclick="handleMainAction()">START GAME (BET ₹100)</button>
  </div>

  <!-- MINES BOARD -->
  <div class="mines-board-card">
    <div class="stats-bar">
      <span>Gems Picked: <b style="color:var(--neon-green);" id="gemsPickedTxt">0</b></span>
      <span>Next Multiplier: <b style="color:var(--neon-gold);" id="multiTxt">1.12X</b></span>
    </div>

    <div class="mines-grid" id="gridBoard">
      <!-- 25 Tiles rendered by JS -->
    </div>
  </div>

  <div style="text-align:center;">
    <button onclick="resetCoins()" style="padding:6px 14px; background:var(--border-color); color:var(--neon-blue); border:1px solid var(--neon-blue); border-radius:6px; font-size:10px; font-weight:700; cursor:pointer;">🔄 Reset Wallet Balance</button>
  </div>

</div>

<script>
// WEB AUDIO API SOUND GENERATOR
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;

    if (type === 'tile') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    } else if (type === 'gem') {
      [600, 800, 1050].forEach((f, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.05);
        g.gain.setValueAtTime(0.12, now + idx * 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.15);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.05); o.stop(now + idx * 0.05 + 0.15);
      });
    } else if (type === 'bomb') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now);
      osc.frequency.linearRampToValueAtTime(50, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'cashout') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.07);
        g.gain.setValueAtTime(0.2, now + idx * 0.07);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.07); o.stop(now + idx * 0.07 + 0.25);
      });
    }
  } catch(e) {}
}

// GAME STATE
let balance = parseInt(localStorage.getItem('rwin_balance') || '10000');
let betAmount = 100;
let mineCount = 3;
let isPlaying = false;
let bombLocations = [];
let gemsPicked = 0;
let currentMultiplier = 1.00;

function saveBalance() {
  localStorage.setItem('rwin_balance', balance.toString());
  document.getElementById('balanceVal').innerText = "₹" + balance.toLocaleString();
}

function resetCoins() {
  playSound('tile');
  balance = 10000;
  saveBalance();
  showModal("🔄 WALLET RESET", "Practice Balance restored to ₹10,000!", "💰", true);
}

function changeBet(diff) {
  if (isPlaying) return;
  playSound('tile');
  betAmount = Math.max(50, Math.min(5000, betAmount + diff));
  document.getElementById('betDisplay').innerText = "₹" + betAmount;
  updateActionButtonUI();
}

function changeMines(diff) {
  if (isPlaying) return;
  playSound('tile');
  mineCount = Math.max(1, Math.min(24, mineCount + diff));
  document.getElementById('minesDisplay').innerText = mineCount + " 💣";
  calculateNextMultiplier();
}

function updateActionButtonUI() {
  const btn = document.getElementById('mainActionBtn');
  if (!isPlaying) {
    btn.className = "action-btn btn-start";
    btn.innerText = "START GAME (BET ₹" + betAmount + ")";
  } else {
    btn.className = "action-btn btn-cashout";
    let cashoutVal = Math.floor(betAmount * currentMultiplier);
    btn.innerText = "CASHOUT ₹" + cashoutVal.toLocaleString() + " (" + currentMultiplier.toFixed(2) + "X)";
  }
}

function calculateNextMultiplier() {
  if (gemsPicked === 0) {
    // Base first tile multiplier
    currentMultiplier = 1 + (mineCount * 0.04);
  } else {
    let safeTiles = 25 - mineCount;
    let factor = 1;
    for (let i = 0; i < gemsPicked; i++) {
      factor *= (25 - i) / (safeTiles - i);
    }
    currentMultiplier = parseFloat((factor * 0.97).toFixed(2)); // 3% house edge
  }
  document.getElementById('multiTxt').innerText = currentMultiplier.toFixed(2) + "X";
}

function initGridBoard() {
  const grid = document.getElementById('gridBoard');
  grid.innerHTML = "";
  for (let i = 0; i < 25; i++) {
    grid.innerHTML += `<div class="mine-tile" id="tile-${i}" onclick="tileClicked(${i})">❓</div>`;
  }
}

function handleMainAction() {
  if (!isPlaying) {
    // START NEW GAME
    if (balance < betAmount) {
      showModal("⚠️ LOW BALANCE", "Not enough coins! Reset balance to play.", "💰", false);
      return;
    }

    balance -= betAmount;
    saveBalance();
    isPlaying = true;
    gemsPicked = 0;

    // Generate Mines
    bombLocations = [];
    while (bombLocations.length < mineCount) {
      let r = Math.floor(Math.random() * 25);
      if (bombLocations.indexOf(r) === -1) bombLocations.push(r);
    }

    initGridBoard();
    calculateNextMultiplier();
    document.getElementById('gemsPickedTxt').innerText = "0";
    updateActionButtonUI();
    playSound('tile');

  } else {
    // CASHOUT
    if (gemsPicked === 0) return;
    let winAmount = Math.floor(betAmount * currentMultiplier);
    balance += winAmount;
    saveBalance();
    isPlaying = false;

    revealAllBoard();
    playSound('cashout');
    showModal("🎉 CASHOUT WIN!", `Successfully Cashed Out @ ${currentMultiplier.toFixed(2)}X\nWon ₹${winAmount.toLocaleString()}!`, "💎", true);
    updateActionButtonUI();
  }
}

function tileClicked(idx) {
  if (!isPlaying) return;
  const tile = document.getElementById('tile-' + idx);
  if (tile.classList.contains('revealed-gem') || tile.classList.contains('revealed-bomb')) return;

  if (bombLocations.indexOf(idx) !== -1) {
    // HIT BOMB!
    isPlaying = false;
    tile.classList.add('revealed-bomb');
    tile.innerText = "💣";
    playSound('bomb');

    revealAllBoard();
    showModal("💥 BOOM! BOMB HIT", `You hit a mine! Better luck next round.`, "💔", false);
    updateActionButtonUI();

  } else {
    // HIT GEM!
    gemsPicked++;
    tile.classList.add('revealed-gem');
    tile.innerText = "💎";
    playSound('gem');

    document.getElementById('gemsPickedTxt').innerText = gemsPicked;
    calculateNextMultiplier();
    updateActionButtonUI();

    // Auto cashout if all safe gems cleared
    if (gemsPicked === (25 - mineCount)) {
      handleMainAction();
    }
  }
}

function revealAllBoard() {
  for (let i = 0; i < 25; i++) {
    const tile = document.getElementById('tile-' + i);
    if (bombLocations.indexOf(i) !== -1) {
      tile.classList.add('revealed-bomb');
      tile.innerText = "💣";
    } else if (!tile.classList.contains('revealed-gem')) {
      tile.innerText = "💎";
      tile.style.opacity = "0.5";
    }
  }
}

function showModal(title, msg, icon, isWin) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalMsg').innerText = msg;
  document.getElementById('modalIcon').innerText = icon;
  document.getElementById('modalBox').style.borderColor = isWin ? "var(--neon-green)" : "var(--neon-red)";
  document.getElementById('resultModal').style.display = "flex";
}

function closeModal() {
  playSound('tile');
  document.getElementById('resultModal').style.display = "none";
}

// INITIALIZE
saveBalance();
initGridBoard();
calculateNextMultiplier();
</script>
</body>
</html>
