<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BTC Crypto Candle 30s - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg-dark);
  font-family: 'Poppins', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

.gameContainer {
  max-width: 480px;
  margin: 0 auto;
  background: var(--card-bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 30px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #020307;
  border-bottom: 1px solid var(--border-color);
}
.back-btn {
  padding: 6px 12px;
  background: var(--border-color);
  color: var(--neon-blue);
  border: 1px solid var(--neon-blue);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 11px;
  text-decoration: none;
}
.balance-pill {
  background: linear-gradient(135deg, #1e1b4b, #0f172a);
  border: 1px solid var(--neon-gold);
  border-radius: 20px;
  padding: 4px 14px;
  font-weight: 800;
  font-size: 13px;
  color: var(--neon-gold);
}

/* HISTORY TAPE */
.history-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 12px;
  background: #04060d;
  border-bottom: 1px solid var(--border-color);
}
.hist-pill {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}
.hist-bull { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--neon-green); color: var(--neon-green); }
.hist-bear { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--neon-red); color: var(--neon-red); }

/* LIVE PRICE TICKER CARD */
.ticker-card {
  background: radial-gradient(circle, #0f172a 0%, #04060d 100%);
  margin: 12px;
  border: 2px solid var(--border-color);
  border-radius: 20px;
  padding: 14px;
  text-align: center;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.pair-title {
  font-size: 14px;
  font-weight: 900;
  color: #f7931a;
  display: flex;
  align-items: center;
  gap: 6px;
}

.live-price-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 900;
  color: var(--neon-green);
  transition: color 0.15s ease;
}

.timer-progress-bg {
  width: 100%;
  height: 6px;
  background: #1e293b;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}

.timer-progress-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
  transition: width 0.2s linear;
}

.timer-status-row {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 800;
  color: #94a3b8;
}

/* CHART CANVAS CONTAINER */
.chart-container {
  position: relative;
  width: 100%;
  height: 240px;
  background: #02040a;
  border: 1px solid var(--border-color);
  border-radius: 14px;
  overflow: hidden;
  margin-top: 10px;
}

#btcCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* ACTIVE BET OVERLAY CARD */
.active-trade-card {
  background: #070a14;
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 8px 12px;
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}

/* CONTROLS CARD */
.controls-card {
  background: #04060d;
  margin: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
}

.bet-adjuster {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.adjust-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: #1e293b;
  border: 1px solid #334155;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}
.bet-val {
  background: #0f172a;
  border: 1px solid var(--border-color);
  padding: 6px 16px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 15px;
  color: var(--neon-gold);
  min-width: 90px;
}

.trade-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn-trade {
  padding: 14px 8px;
  border-radius: 14px;
  border: 2px solid transparent;
  font-weight: 900;
  font-size: 14px;
  cursor: pointer;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s, opacity 0.2s;
}
.btn-trade:active { transform: scale(0.95); }
.btn-call {
  background: linear-gradient(135deg, #10b981, #047857);
  border-color: #6ee7b7;
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
}
.btn-put {
  background: linear-gradient(135deg, #ef4444, #991b1b);
  border-color: #fca5a5;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
}

/* MODAL POPUP */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--card-bg);
  border: 2px solid var(--neon-green);
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  width: 85%;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
</style>
</head>

<body>
<div class="gameContainer">

  <!-- RESULT MODAL -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <div id="modalIcon" style="font-size:48px; margin-bottom:8px;">📈</div>
      <h3 id="modalTitle" style="color:#fff; font-size:18px; margin:0 0 4px 0;">RESULT</h3>
      <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 16px 0;">Details</p>
      <button onclick="closeModal()" style="width:100%; padding:12px; background:var(--neon-green); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">CONTINUE</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header-bar">
    <a href="../game.html" class="back-btn">⬅️ Arena Hub</a>
    <div class="balance-pill">
      <span>💰</span>
      <span id="balanceVal">₹10,000</span>
    </div>
  </header>

  <!-- HISTORY STRIP -->
  <div class="history-strip" id="historyStrip">
    <div class="hist-pill hist-bull">🟢 88,450.20</div>
    <div class="hist-pill hist-bear">🔴 88,412.10</div>
    <div class="hist-pill hist-bull">🟢 88,480.00</div>
  </div>

  <div style="text-align:center; padding:8px 0 2px 0;">
    <h2 style="margin:0; font-size:20px; color:#f7931a;">⚡ BTC CANDLE 30s 📈</h2>
    <span style="font-size:10px; color:#94a3b8;">PREDICT PRICE MOVEMENT • BULLISH OR BEARISH 1.95X</span>
  </div>

  <!-- TICKER & CHART -->
  <div class="ticker-card">
    <div class="price-row">
      <div class="pair-title">
        <span>🪙</span> BTC/USDT 30s
      </div>
      <div class="live-price-val" id="priceDisplay">$88,450.00</div>
    </div>

    <!-- PROGRESS BAR & TIMER -->
    <div class="timer-progress-bg">
      <div class="timer-progress-fill" id="timerBar"></div>
    </div>
    <div class="timer-status-row">
      <span id="phaseStatusTxt">BETTING PHASE (10s)</span>
      <span id="timerTxt" style="color:var(--neon-gold); font-family:'JetBrains Mono';">10s</span>
    </div>

    <!-- CANVAS CHART -->
    <div class="chart-container">
      <canvas id="btcCanvas" width="400" height="240"></canvas>
    </div>

    <!-- ACTIVE TRADE OVERLAY -->
    <div class="active-trade-card" id="tradeOverlay" style="display:none;">
      <span>Trade: <b id="tradeDirTxt" style="color:var(--neon-green);">CALL 🟢</b></span>
      <span>Entry: <b id="tradeEntryTxt" style="font-family:'JetBrains Mono';">$88,450.00</b></span>
      <span>Payout: <b id="tradePayoutTxt" style="color:var(--neon-gold);">₹195</b></span>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-card">
    <div style="font-size:10px; color:#94a3b8; margin-bottom:6px;">INVESTMENT AMOUNT</div>
    <div class="bet-adjuster">
      <button class="adjust-btn" onclick="changeBet(-50)">-</button>
      <div class="bet-val" id="betDisplay">₹100</div>
      <button class="adjust-btn" onclick="changeBet(50)">+</button>
    </div>

    <div class="trade-btn-grid">
      <button class="btn-trade btn-call" id="btnCall" onclick="placeTrade('CALL')">
        <span>CALL 📈 (HIGHER)</span>
        <span style="font-size:10px; opacity:0.85; margin-top:2px;">PAYOUT 1.95X</span>
      </button>

      <button class="btn-trade btn-put" id="btnPut" onclick="placeTrade('PUT')">
        <span>PUT 📉 (LOWER)</span>
        <span style="font-size:10px; opacity:0.85; margin-top:2px;">PAYOUT 1.95X</span>
      </button>
    </div>

    <div style="margin-top:10px;">
      <button onclick="resetWallet()" style="padding:4px 12px; background:var(--border-color); color:var(--neon-blue); border:1px solid var(--neon-blue); border-radius:6px; font-size:10px; font-weight:700; cursor:pointer;">🔄 Reset Wallet</button>
    </div>
  </div>

</div>

<script>
// WEB AUDIO API SOUND GENERATOR
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;

    if (type === 'tick') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(700, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      osc.start(now); osc.stop(now + 0.03);
    } else if (type === 'trade') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.linearRampToValueAtTime(800, now + 0.12);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.08);
        g.gain.setValueAtTime(0.2, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.3);
      });
    } else if (type === 'lose') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.35);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    }
  } catch(e) {}
}

// GAME STATE
let balance = parseInt(localStorage.getItem('rwin_balance') || '10000');
let betAmount = 100;
let currentPrice = 88450.00;
let priceHistory = [];
let candles = [];

let phase = 'BETTING'; // 'BETTING' or 'TRADING'
let timerSec = 10;
let activeTrade = null;
let entryPrice = null;
let historyLog = [{ type: 'bull', price: '88,450.20' }, { type: 'bear', price: '88,412.10' }, { type: 'bull', price: '88,480.00' }];

const canvas = document.getElementById('btcCanvas');
const ctx = canvas.getContext('2d');

function saveBalance() {
  localStorage.setItem('rwin_balance', balance.toString());
  document.getElementById('balanceVal').innerText = "₹" + balance.toLocaleString();
}

function resetWallet() {
  playSound('trade');
  balance = 10000;
  saveBalance();
  showModal("🔄 WALLET RESET", "Practice Balance restored to ₹10,000!", "💰", true);
}

function changeBet(diff) {
  if (activeTrade) return;
  playSound('tick');
  betAmount = Math.max(50, Math.min(5000, betAmount + diff));
  document.getElementById('betDisplay').innerText = "₹" + betAmount;
}

// GENERATE INITIAL CANDLES
function initChartData() {
  priceHistory = [];
  candles = [];
  let basePrice = currentPrice - 60;

  for (let i = 0; i < 20; i++) {
    let open = basePrice + (Math.random() - 0.48) * 12;
    let close = open + (Math.random() - 0.48) * 16;
    let high = Math.max(open, close) + Math.random() * 8;
    let low = Math.min(open, close) - Math.random() * 8;

    candles.push({ open, high, low, close });
    basePrice = close;
  }
  currentPrice = basePrice;
  document.getElementById('priceDisplay').innerText = "$" + currentPrice.toFixed(2);
}

// RENDER CANDLESTICK CHART ON CANVAS
function drawChart() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid Lines
  ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
  ctx.lineWidth = 1;
  for (let y = 30; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
  for (let x = 40; x < canvas.width; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }

  if (candles.length === 0) return;

  // Min and Max price bounds
  let allLows = candles.map(c => c.low);
  let allHighs = candles.map(c => c.high);
  if (entryPrice) { allLows.push(entryPrice); allHighs.push(entryPrice); }

  let minP = Math.min(...allLows) - 5;
  let maxP = Math.max(...allHighs) + 5;
  let rangeP = maxP - minP;

  function getY(p) {
    return canvas.height - ((p - minP) / rangeP) * (canvas.height - 40) - 20;
  }

  // Draw Candlesticks
  let candleWidth = 12;
  let gap = 6;
  let startX = canvas.width - (candles.length * (candleWidth + gap)) - 20;

  candles.forEach((c, idx) => {
    let x = startX + idx * (candleWidth + gap);
    let isBull = c.close >= c.open;
    let color = isBull ? "#10b981" : "#ef4444";

    // Wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + candleWidth / 2, getY(c.high));
    ctx.lineTo(x + candleWidth / 2, getY(c.low));
    ctx.stroke();

    // Body
    let yOpen = getY(c.open);
    let yClose = getY(c.close);
    let bodyY = Math.min(yOpen, yClose);
    let bodyH = Math.max(3, Math.abs(yOpen - yClose));

    ctx.fillStyle = color;
    ctx.fillRect(x, bodyY, candleWidth, bodyH);
  });

  // Entry Price Target Line
  if (entryPrice && activeTrade) {
    let entryY = getY(entryPrice);
    ctx.strokeStyle = "#f59e0b";
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, entryY);
    ctx.lineTo(canvas.width, entryY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Entry Price Tag
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(0, entryY - 10, 75, 18);
    ctx.fillStyle = "#000";
    ctx.font = "bold 9px 'JetBrains Mono'";
    ctx.fillText("ENTRY $" + entryPrice.toFixed(0), 4, entryY + 2);
  }

  // Current Price Live Line
  let currentY = getY(currentPrice);
  let liveColor = (candles[candles.length - 1].close >= candles[candles.length - 1].open) ? "#10b981" : "#ef4444";

  ctx.strokeStyle = liveColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, currentY);
  ctx.lineTo(canvas.width, currentY);
  ctx.stroke();

  // Price Badge Right
  ctx.fillStyle = liveColor;
  ctx.fillRect(canvas.width - 70, currentY - 10, 68, 20);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 10px 'JetBrains Mono'";
  ctx.fillText("$" + currentPrice.toFixed(1), canvas.width - 66, currentY + 3);
}

// TICK ENGINE (Fires every second)
function engineTick() {
  // Micro fluctuation
  let delta = (Math.random() - 0.49) * 4.5;
  currentPrice += delta;

  // Update current live candle
  let currCandle = candles[candles.length - 1];
  currCandle.close = currentPrice;
  currCandle.high = Math.max(currCandle.high, currentPrice);
  currCandle.low = Math.min(currCandle.low, currentPrice);

  const priceEl = document.getElementById('priceDisplay');
  priceEl.innerText = "$" + currentPrice.toFixed(2);
  priceEl.style.color = delta >= 0 ? "#10b981" : "#ef4444";

  playSound('tick');
  drawChart();

  // Timer countdown logic
  timerSec--;

  if (phase === 'BETTING') {
    let fillPct = (timerSec / 10) * 100;
    document.getElementById('timerBar').style.width = fillPct + "%";
    document.getElementById('timerTxt').innerText = timerSec + "s";

    if (timerSec <= 0) {
      // Transition to TRADING PHASE
      phase = 'TRADING';
      timerSec = 30;
      document.getElementById('phaseStatusTxt').innerText = "LIVE TRADING (30s)";
      document.getElementById('phaseStatusTxt').style.color = "var(--neon-green)";

      // Lock entry price if trade was placed
      if (activeTrade) {
        entryPrice = currentPrice;
        document.getElementById('tradeEntryTxt').innerText = "$" + entryPrice.toFixed(2);
      }

      // Add a fresh candle for the 30s trade period
      candles.push({ open: currentPrice, high: currentPrice, low: currentPrice, close: currentPrice });
      if (candles.length > 22) candles.shift();
    }

  } else if (phase === 'TRADING') {
    let fillPct = (timerSec / 30) * 100;
    document.getElementById('timerBar').style.width = fillPct + "%";
    document.getElementById('timerTxt').innerText = timerSec + "s";

    if (timerSec <= 0) {
      // SETTLEMENT
      evaluateRoundResult();

      // Reset to BETTING phase
      phase = 'BETTING';
      timerSec = 10;
      document.getElementById('phaseStatusTxt').innerText = "BETTING PHASE (10s)";
      document.getElementById('phaseStatusTxt').style.color = "#94a3b8";
    }
  }
}

function placeTrade(dir) {
  if (phase !== 'BETTING') {
    showModal("⚠️ TRADING LOCKED", "Trades can only be placed during Betting Phase!", "⏱️", false);
    return;
  }

  if (activeTrade) {
    showModal("⚠️ ALREADY PLACED", "Trade already active for this round!", "📈", false);
    return;
  }

  if (balance < betAmount) {
    showModal("⚠️ LOW BALANCE", "Not enough coins! Reset balance to trade.", "💰", false);
    return;
  }

  balance -= betAmount;
  saveBalance();

  activeTrade = { dir, amount: betAmount };
  playSound('trade');

  let payoutAmt = Math.floor(betAmount * 1.95);

  document.getElementById('tradeDirTxt').innerText = dir === 'CALL' ? "CALL 📈 (HIGHER)" : "PUT 📉 (LOWER)";
  document.getElementById('tradeDirTxt').style.color = dir === 'CALL' ? "var(--neon-green)" : "var(--neon-red)";
  document.getElementById('tradePayoutTxt').innerText = "₹" + payoutAmt.toLocaleString();
  document.getElementById('tradeOverlay').style.display = "flex";

  document.getElementById('btnCall').style.opacity = dir === 'CALL' ? "1" : "0.4";
  document.getElementById('btnPut').style.opacity = dir === 'PUT' ? "1" : "0.4";
}

function evaluateRoundResult() {
  let finalPrice = currentPrice;

  if (activeTrade && entryPrice) {
    let isBullWin = (activeTrade.dir === 'CALL' && finalPrice > entryPrice);
    let isBearWin = (activeTrade.dir === 'PUT' && finalPrice < entryPrice);

    if (isBullWin || isBearWin) {
      let payout = Math.floor(activeTrade.amount * 1.95);
      balance += payout;
      saveBalance();
      playSound('win');
      showModal("🎉 TRADE WINNER!", `Entry: $${entryPrice.toFixed(2)} ➔ Close: $${finalPrice.toFixed(2)}\nYou Won ₹${payout.toLocaleString()}!`, "🏆", true);
    } else {
      playSound('lose');
      showModal("💥 TRADE LOST", `Entry: $${entryPrice.toFixed(2)} ➔ Clos
