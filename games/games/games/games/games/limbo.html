<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Limbo Rocket Multiplier - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg-dark);
  font-family: 'Poppins', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

.gameContainer {
  max-width: 480px;
  margin: 0 auto;
  background: var(--card-bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 30px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #020307;
  border-bottom: 1px solid var(--border-color);
}
.back-btn {
  padding: 6px 12px;
  background: var(--border-color);
  color: var(--neon-blue);
  border: 1px solid var(--neon-blue);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 11px;
  text-decoration: none;
}
.balance-pill {
  background: linear-gradient(135deg, #1e1b4b, #0f172a);
  border: 1px solid var(--neon-gold);
  border-radius: 20px;
  padding: 4px 14px;
  font-weight: 800;
  font-size: 13px;
  color: var(--neon-gold);
}

/* HISTORY STRIP */
.history-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 12px;
  background: #04060d;
  border-bottom: 1px solid var(--border-color);
}
.hist-pill {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}
.hist-win { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--neon-green); color: var(--neon-green); }
.hist-lose { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--neon-red); color: var(--neon-red); }

/* LIMBO MULTIPLIER DISPLAY */
.limbo-card {
  background: radial-gradient(circle, #0f172a 0%, #04060d 100%);
  margin: 12px;
  border: 2px solid var(--border-color);
  border-radius: 24px;
  padding: 24px 14px;
  text-align: center;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}

.limbo-display-box {
  background: #02040a;
  border: 2px solid var(--neon-purple);
  border-radius: 20px;
  padding: 24px 12px;
  box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
}

.limbo-number {
  font-size: 54px;
  font-weight: 900;
  color: var(--neon-green);
  font-family: monospace;
  letter-spacing: 1px;
  text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
}
.limbo-number.busted {
  color: var(--neon-red);
  text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
}

/* CONTROLS CARD */
.controls-card {
  background: #04060d;
  margin: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
}

.input-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.input-box {
  background: #0f172a;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 8px;
}

.input-label {
  font-size: 9px;
  color: #94a3b8;
  font-weight: 700;
  margin-bottom: 4px;
  text-transform: uppercase;
}

.input-field {
  width: 100%;
  background: transparent;
  border: none;
  text-align: center;
  font-weight: 900;
  font-size: 16px;
  color: #fff;
  outline: none;
}

.btn-launch {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--neon-purple), #7e22ce);
  color: #fff;
  font-weight: 900;
  font-size: 15px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* MODAL POPUP */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--card-bg);
  border: 2px solid var(--neon-purple);
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  width: 85%;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
</style>
</head>

<body>
<div class="gameContainer">

  <!-- RESULT MODAL -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <div id="modalIcon" style="font-size:48px; margin-bottom:8px;">🚀</div>
      <h3 id="modalTitle" style="color:#fff; font-size:18px; margin:0 0 4px 0;">RESULT</h3>
      <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 16px 0;">Details</p>
      <button onclick="closeModal()" style="width:100%; padding:12px; background:var(--neon-purple); color:#fff; font-weight:800; border-radius:10px; border:none; cursor:pointer;">CONTINUE</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header-bar">
    <a href="../game.html" class="back-btn">⬅️ Arena Hub</a>
    <div class="balance-pill">
      <span>💰</span>
      <span id="balanceVal">₹10,000</span>
    </div>
  </header>

  <!-- HISTORY STRIP -->
  <div class="history-strip" id="historyStrip">
    <div class="hist-pill hist-win">2.45X</div>
    <div class="hist-pill hist-lose">1.12X</div>
    <div class="hist-pill hist-win">14.80X</div>
  </div>

  <div style="text-align:center; padding:8px 0 2px 0;">
    <h2 style="margin:0; font-size:20px; color:var(--neon-purple);">🚀 LIMBO ROCKET MULTIPLIER</h2>
    <span style="font-size:10px; color:#94a3b8;">SET TARGET MULTIPLIER • INSTANT WIN IF ROCKET SURPASSES</span>
  </div>

  <!-- DISPLAY -->
  <div class="limbo-card">
    <div class="limbo-display-box">
      <div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:6px;">RESULT MULTIPLIER</div>
      <div class="limbo-number" id="resultDisplay">1.00X</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-card">
    <div class="input-grid">
      <div class="input-box">
        <div class="input-label">Bet Amount (₹)</div>
        <input type="number" class="input-field" id="betInput" value="100" min="50" max="5000" step="50" onchange="updateCalc()">
      </div>

      <div class="input-box">
        <div class="input-label">Target Multiplier</div>
        <input type="number" class="input-field" id="targetInput" value="2.00" min="1.01" max="1000" step="0.1" onchange="updateCalc()">
      </div>
    </div>

    <div style="font-size:11px; font-weight:800; color:var(--neon-gold); margin-bottom:12px;">
      Win Chance: <span id="chanceTxt" style="color:#fff;">49.50%</span> | Profit On Win: <span id="profitTxt" style="color:var(--neon-green);">₹200</span>
    </div>

    <button class="btn-launch" id="launchBtn" onclick="launchLimbo()">LAUNCH ROCKET 🚀</button>

    <div style="margin-top:10px;">
      <button onclick="resetWallet()" style="padding:4px 12px; background:var(--border-color); color:var(--neon-blue); border:1px solid var(--neon-blue); border-radius:6px; font-size:10px; font-weight:700; cursor:pointer;">🔄 Reset Wallet</button>
    </div>
  </div>

</div>

<script>
// WEB AUDIO API SOUND GENERATOR
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;

    if (type === 'launch') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.08);
        g.gain.setValueAtTime(0.2, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.3);
      });
    } else if (type === 'lose') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.35);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    }
  } catch(e) {}
}

// GAME STATE
let balance = parseInt(localStorage.getItem('rwin_balance') || '10000');
let isLaunching = false;
let historyList = [2.45, 1.12, 14.80];

function saveBalance() {
  localStorage.setItem('rwin_balance', balance.toString());
  document.getElementById('balanceVal').innerText = "₹" + balance.toLocaleString();
}

function resetWallet() {
  playSound('launch');
  balance = 10000;
  saveBalance();
  showModal("🔄 WALLET RESET", "Practice Balance restored to ₹10,000!", "💰", true);
}

function updateCalc() {
  let bet = parseFloat(document.getElementById('betInput').value) || 100;
  let target = parseFloat(document.getElementById('targetInput').value) || 2.0;

  target = Math.max(1.01, Math.min(1000, target));
  bet = Math.max(50, Math.min(5000, bet));

  let chance = (99 / target).toFixed(2);
  let profit = Math.floor(bet * target);

  document.getElementById('chanceTxt').innerText = chance + "%";
  document.getElementById('profitTxt').innerText = "₹" + profit.toLocaleString();
}

function generateLimboResult() {
  let r = Math.random();
  // 1% Instant crash
  if (r < 0.01) return 1.00;
  return parseFloat((0.99 / (1 - r)).toFixed(2));
}

function launchLimbo() {
  if (isLaunching) return;

  let bet = parseFloat(document.getElementById('betInput').value) || 100;
  let target = parseFloat(document.getElementById('targetInput').value) || 2.0;

  if (balance < bet) {
    showModal("⚠️ LOW BALANCE", "Not enough coins! Reset balance to launch.", "💰", false);
    return;
  }

  balance -= bet;
  saveBalance();
  isLaunching = true;
  document.getElementById('launchBtn').style.opacity = "0.5";

  playSound('launch');

  const displayEl = document.getElementById('resultDisplay');
  displayEl.classList.remove('busted');

  let resultMulti = generateLimboResult();

  let count = 0;
  let animInterval = setInterval(() => {
    displayEl.innerText = (1.00 + Math.random() * resultMulti).toFixed(2) + "X";
    count++;
    if (count > 12) {
      clearInterval(animInterval);
      displayEl.innerText = resultMulti.toFixed(2) + "X";
      evaluateLimbo(resultMulti, target, bet);
    }
  }, 30);
}

function evaluateLimbo(resultMulti, target, bet) {
  let won = resultMulti >= target;

  historyList.unshift(resultMulti);
  if (historyList.length > 8) historyList.pop();
  renderHistory();

  const displayEl = document.getElementById('resultDisplay');

  if (won) {
    let payout = Math.floor(bet * target);
    balance += payout;
    saveBalance();
    playSound('win');
    showModal("🎉 ROCKET PASSED!", `Landed on ${resultMulti.toFixed(2)}X (Target ${target.toFixed(2)}X)\nYou Won ₹${payout.toLocaleString()}!`, "🏆", true);
  } else {
    displayEl.classList.add('busted');
    playSound('lose');
    showModal("💥 BUSTED BELOW TARGET", `Landed on ${resultMulti.toFixed(2)}X (Target ${target.toFixed(2)}X)`, "💔", false);
  }

  isLaunching = false;
  document.getElementById('launchBtn').style.opacity = "1";
}

function renderHistory() {
  const container = document.getElementById('historyStrip');
  let target = parseFloat(document.getElementById('targetInput').value) || 2.0;
  container.innerHTML = historyList.map(val => {
    let win = val >= target;
    return `<div class="hist-pill ${win ? 'hist-win' : 'hist-lose'}">${val.toFixed(2)}X</div>`;
  }).join('');
}

function showModal(title, msg, icon, isWin) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalMsg').innerText = msg;
  document.getElementById('modalIcon').innerText = icon;
  document.getElementById('modalBox').style.borderColor = isWin ? "var(--neon-purple)" : "var(--neon-red)";
  document.getElementById('resultModal').style.display = "flex";
}

function closeModal() {
  playSound('launch');
  document.getElementById('resultModal').style.display = "none";
}

// INITIALIZE
saveBalance();
updateCalc();
renderHistory();
</script>
</body>
</html>
