<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Dice Over/Under - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg-dark);
  font-family: 'Poppins', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

.gameContainer {
  max-width: 480px;
  margin: 0 auto;
  background: var(--card-bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 30px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #020307;
  border-bottom: 1px solid var(--border-color);
}
.back-btn {
  padding: 6px 12px;
  background: var(--border-color);
  color: var(--neon-blue);
  border: 1px solid var(--neon-blue);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 11px;
  text-decoration: none;
}
.balance-pill {
  background: linear-gradient(135deg, #1e1b4b, #0f172a);
  border: 1px solid var(--neon-gold);
  border-radius: 20px;
  padding: 4px 14px;
  font-weight: 800;
  font-size: 13px;
  color: var(--neon-gold);
}

/* HISTORY STRIP */
.history-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 12px;
  background: #04060d;
  border-bottom: 1px solid var(--border-color);
}
.hist-pill {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}
.hist-win { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--neon-green); color: var(--neon-green); }
.hist-lose { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--neon-red); color: var(--neon-red); }

/* DICE BOARD CARD */
.dice-board {
  background: radial-gradient(circle, #0f172a 0%, #04060d 100%);
  margin: 12px;
  border: 2px solid var(--border-color);
  border-radius: 24px;
  padding: 20px 14px;
  text-align: center;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}

.roll-display-box {
  background: #02040a;
  border: 2px solid var(--neon-blue);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
}
.roll-number {
  font-size: 48px;
  font-weight: 900;
  color: var(--neon-blue);
  font-family: monospace;
  letter-spacing: 2px;
}

/* SLIDER RANGE */
.slider-container {
  margin: 20px 0;
  position: relative;
}

.range-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--neon-green) 50%, var(--neon-red) 50%);
  outline: none;
}
.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--neon-blue);
  cursor: pointer;
  box-shadow: 0 0 15px var(--neon-blue);
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 800;
  color: #94a3b8;
  margin-top: 6px;
}

/* STATS GRID */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}
.stat-box {
  background: #070a14;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 8px 4px;
}
.stat-label { font-size: 9px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
.stat-val { font-size: 14px; font-weight: 900; color: #fff; margin-top: 2px; }

/* CONTROLS CARD */
.controls-card {
  background: #04060d;
  margin: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
}

.mode-toggle-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.mode-btn {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: #1e293b;
  color: #94a3b8;
  font-weight: 800;
  font-size: 11px;
  cursor: pointer;
}
.mode-btn.active {
  background: var(--neon-blue);
  color: #000;
  border-color: var(--neon-blue);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
}

.bet-adjuster {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.adjust-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: #1e293b;
  border: 1px solid #334155;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}
.bet-val {
  background: #0f172a;
  border: 1px solid var(--border-color);
  padding: 6px 16px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 15px;
  color: var(--neon-gold);
  min-width: 90px;
}

.btn-roll {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--neon-green), #047857);
  color: #fff;
  font-weight: 900;
  font-size: 15px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* MODAL POPUP */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--card-bg);
  border: 2px solid var(--neon-green);
  border-radius: 20px;
  padding: 22px;
  text-align: center;
  width: 85%;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
</style>
</head>

<body>
<div class="gameContainer">

  <!-- RESULT MODAL -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <div id="modalIcon" style="font-size:48px; margin-bottom:8px;">🎲</div>
      <h3 id="modalTitle" style="color:#fff; font-size:18px; margin:0 0 4px 0;">RESULT</h3>
      <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 16px 0;">Details</p>
      <button onclick="closeModal()" style="width:100%; padding:12px; background:var(--neon-green); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">CONTINUE</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header-bar">
    <a href="../game.html" class="back-btn">⬅️ Arena Hub</a>
    <div class="balance-pill">
      <span>💰</span>
      <span id="balanceVal">₹10,000</span>
    </div>
  </header>

  <!-- HISTORY STRIP -->
  <div class="history-strip" id="historyStrip">
    <div class="hist-pill hist-win">65.20</div>
    <div class="hist-pill hist-lose">12.10</div>
    <div class="hist-pill hist-win">88.40</div>
  </div>

  <div style="text-align:center; padding:8px 0 2px 0;">
    <h2 style="margin:0; font-size:20px; color:var(--neon-blue);">🎲 CYBER DICE ⚡</h2>
    <span style="font-size:10px; color:#94a3b8;">SLIDE TARGET • CUSTOM PROBABILITY & MULTIPLIER</span>
  </div>

  <!-- BOARD -->
  <div class="dice-board">
    <div class="roll-display-box">
      <div style="font-size:10px; font-weight:800; color:#94a3b8; margin-bottom:4px;">ROLL RESULT</div>
      <div class="roll-number" id="rollVal">50.00</div>
    </div>

    <!-- RANGE SLIDER -->
    <div class="slider-container">
      <input type="range" class="range-slider" id="diceSlider" min="2" max="98" value="50" oninput="updateSliderCalc()">
      <div class="slider-labels">
        <span>0</span>
        <span>25</span>
        <span>50</span>
        <span>75</span>
        <span>100</span>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Multiplier</div>
        <div class="stat-val" style="color:var(--neon-gold);" id="multiTxt">1.98X</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Target</div>
        <div class="stat-val" style="color:var(--neon-blue);" id="targetTxt">> 50.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Win Chance</div>
        <div class="stat-val" style="color:var(--neon-green);" id="chanceTxt">50.00%</div>
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-card">
    <div class="mode-toggle-row">
      <button class="mode-btn active" id="btnRollOver" onclick="setMode(true)">ROLL OVER ></button>
      <button class="mode-btn" id="btnRollUnder" onclick="setMode(false)">ROLL UNDER <</button>
    </div>

    <div style="font-size:10px; color:#94a3b8; margin-bottom:6px;">BET AMOUNT</div>
    <div class="bet-adjuster">
      <button class="adjust-btn" onclick="changeBet(-50)">-</button>
      <div class="bet-val" id="betDisplay">₹100</div>
      <button class="adjust-btn" onclick="changeBet(50)">+</button>
    </div>

    <button class="btn-roll" id="rollBtn" onclick="rollCyberDice()">ROLL DICE (BET ₹<span id="betTxt">100</span>)</button>

    <div style="margin-top:10px;">
      <button onclick="resetWallet()" style="padding:4px 12px; background:var(--border-color); color:var(--neon-blue); border:1px solid var(--neon-blue); border-radius:6px; font-size:10px; font-weight:700; cursor:pointer;">🔄 Reset Wallet</button>
    </div>
  </div>

</div>

<script>
// WEB AUDIO API SOUND GENERATOR
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
      osc.start(now); osc.stop(now + 0.04);
    } else if (type === 'roll') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(800, now + 0.25);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.08);
        g.gain.setValueAtTime(0.2, now + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.3);
      });
    } else if (type === 'lose') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(90, now + 0.35);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    }
  } catch(e) {}
}

// GAME STATE
let balance = parseInt(localStorage.getItem('rwin_balance') || '10000');
let betAmount = 100;
let isRollOver = true;
let isRolling = false;
let historyList = [65.20, 12.10, 88.40];

function saveBalance() {
  localStorage.setItem('rwin_balance', balance.toString());
  document.getElementById('balanceVal').innerText = "₹" + balance.toLocaleString();
}

function resetWallet() {
  playSound('click');
  balance = 10000;
  saveBalance();
  showModal("🔄 WALLET RESET", "Practice Balance restored to ₹10,000!", "💰", true);
}

function changeBet(diff) {
  if (isRolling) return;
  playSound('click');
  betAmount = Math.max(50, Math.min(5000, betAmount + diff));
  document.getElementById('betDisplay').innerText = "₹" + betAmount;
  document.getElementById('betTxt').innerText = betAmount;
}

function setMode(over) {
  if (isRolling) return;
  playSound('click');
  isRollOver = over;
  document.getElementById('btnRollOver').className = "mode-btn " + (over ? "active" : "");
  document.getElementById('btnRollUnder').className = "mode-btn " + (!over ? "active" : "");
  updateSliderCalc();
}

function updateSliderCalc() {
  const slider = document.getElementById('diceSlider');
  let targetVal = parseFloat(slider.value);

  let winChance = isRollOver ? (100 - targetVal) : targetVal;
  let multiplier = parseFloat((99 / winChance).toFixed(2)); // 1% house edge

  // Update slider gradient background
  if (isRollOver) {
    slider.style.background = `linear-gradient(90deg, #ef4444 ${targetVal}%, #10b981 ${targetVal}%)`;
    document.getElementById('targetTxt').innerText = "> " + targetVal.toFixed(2);
  } else {
    slider.style.background = `linear-gradient(90deg, #10b981 ${targetVal}%, #ef4444 ${targetVal}%)`;
    document.getElementById('targetTxt').innerText = "< " + targetVal.toFixed(2);
  }

  document.getElementById('multiTxt').innerText = multiplier.toFixed(2) + "X";
  document.getElementById('chanceTxt').innerText = winChance.toFixed(2) + "%";
}

function rollCyberDice() {
  if (isRolling) return;

  if (balance < betAmount) {
    showModal("⚠️ LOW BALANCE", "Not enough coins! Reset balance to play.", "💰", false);
    return;
  }

  balance -= betAmount;
  saveBalance();
  isRolling = true;
  document.getElementById('rollBtn').style.opacity = "0.5";

  playSound('roll');

  const slider = document.getElementById('diceSlider');
  let targetVal = parseFloat(slider.value);
  let winChance = isRollOver ? (100 - targetVal) : targetVal;
  let multiplier = parseFloat((99 / winChance).toFixed(2));

  // Rapid Number Counter
  let rollEl = document.getElementById('rollVal');
  let counter = 0;
  let rollInterval = setInterval(() => {
    rollEl.innerText = (Math.random() * 100).toFixed(2);
    counter++;
    if (counter > 15) {
      clearInterval(rollInterval);
      let finalRoll = parseFloat((Math.random() * 99.99).toFixed(2));
      rollEl.innerText = finalRoll.toFixed(2);

      evaluateDiceResult(finalRoll, targetVal, multiplier);
    }
  }, 30);
}

function evaluateDiceResult(finalRoll, targetVal, multiplier) {
  let won = false;
  if (isRollOver && finalRoll > targetVal) won = true;
  if (!isRollOver && finalRoll < targetVal) won = true;

  historyList.unshift(finalRoll);
  if (historyList.length > 8) historyList.pop();
  renderHistory();

  if (won) {
    let payout = Math.floor(betAmount * multiplier);
    balance += payout;
    saveBalance();
    playSound('win');
    showModal("🎉 DICE WIN!", `Rolled: ${finalRoll.toFixed(2)}\nTarget: ${isRollOver ? '>' : '<'} ${targetVal.toFixed(2)}\nYou Won ₹${payout.toLocaleString()}!`, "🏆", true);
  } else {
    playSound('lose');
    showModal("💥 DICE LOST", `Rolled: ${finalRoll.toFixed(2)}\nTarget: ${isRollOver ? '>' : '<'} ${targetVal.toFixed(2)}`, "💔", false);
  }

  isRolling = false;
  document.getElementById('rollBtn').style.opacity = "1";
}

function renderHistory() {
  const container = document.getElementById('historyStrip');
  const targetVal = parseFloat(document.getElementById('diceSlider').value);
  container.innerHTML = historyList.map(val => {
    let win = isRollOver ? (val > targetVal) : (val < targetVal);
    return `<div class="hist-pill ${win ? 'hist-win' : 'hist-lose'}">${val.toFixed(2)}</div>`;
  }).join('');
}

function showModal(title, msg, icon, isWin) {
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalMsg').innerText = msg;
  document.getElementById('modalIcon').innerText = icon;
  document.getElementById('modalBox').style.borderColor = isWin ? "var(--neon-green)" : "var(--neon-red)";
  document.getElementById('resultModal').style.display = "flex";
}

function closeModal() {
  playSound('click');
  document.getElementById('resultModal').style.display = "none";
}

// INITIALIZE
saveBalance();
updateSliderCalc();
</script>
</body>
  </html>
