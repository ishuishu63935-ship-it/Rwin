
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWIN Payment</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="home">

  <h2>💳 Complete Payment</h2>

  <div class="membershipCard" style="text-align: center;">

    <h3 id="planName">Starter Plan</h3>
    <h2 id="planPrice" style="color: #00E5FF; margin: 10px 0;">₹49</h2>

    <!-- Dynamic Fix QR Code Display -->
    <div style="margin: 15px 0;">
      <img id="upiQrCode" src="" alt="Scan QR to Pay" style="width: 220px; height: 220px; border-radius: 12px; border: 2px solid #00E5FF; padding: 5px; background: white;">
      <p style="font-size: 13px; color: #00E5FF; margin-top: 8px; font-weight: bold;">
        UPI ID: <span id="upiIdText">7415325460-2@ibl</span>
      </p>
    </div>

    <!-- UTR Enter karne ka box -->
    <div style="margin: 20px 0 10px 0;">
      <p style="font-size: 12px; color: #bbb; margin-bottom: 8px;">
        QR स्कैन करके पेमेंट करें और 12-Digit UTR / Ref No. यहाँ डालें:
      </p>
      <input 
        type="text" 
        id="utrInput" 
        placeholder="Enter 12-Digit UTR Number" 
        maxlength="12"
        style="width: 85%; padding: 12px; font-size: 15px; text-align: center; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; outline: none;"
      >
    </div>

    <button id="payNowBtn" style="width: 90%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; background: #00E5FF; color: #000; border: none; border-radius: 8px; margin-top: 10px;">
      Verify & Activate
    </button>

  </div>

</div>

<script type="module" src="payment.js"></script>

</body>
</html>
