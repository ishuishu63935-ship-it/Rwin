
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWIN VIP - Login / Register</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { margin: 0; background: #04060d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 14px; }
.card { background: #0b101d; border: 1.5px solid #1e293b; border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; text-align: center; }
.title { font-size: 22px; font-weight: 800; color: #00e5ff; margin-bottom: 6px; }
.input-field { width: 100%; padding: 12px; margin: 8px 0; background: #04060d; border: 1px solid #1e293b; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }
.submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #00e5ff, #0284c7); border: none; border-radius: 10px; color: #000; font-weight: 800; font-size: 14px; margin-top: 10px; cursor: pointer; }
.switch-text { font-size: 11px; color: #94a3b8; margin-top: 14px; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
  <div class="title">RWIN VIP</div>
  <div style="font-size:11px; color:#94a3b8; margin-bottom:16px;">Sign in or create account to play 20+ Cyber Games</div>

  <input type="email" id="emailInput" class="input-field" placeholder="Enter Email Address" required>
  <input type="password" id="passInput" class="input-field" placeholder="Enter Password (min 6 chars)" required>

  <button class="submit-btn" onclick="handleAuth()">CONTINUE TO ARENA 🚀</button>

  <div class="switch-text" onclick="window.location.href='game.html'">⬅ Back to Free Games Arena</div>
</div>

<script>
function handleAuth() {
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value.trim();

  if (!email || pass.length < 6) {
    alert("Please enter a valid email and minimum 6 character password!");
    return;
  }

  // Save session to LocalStorage (Kills the Login Loop)
  localStorage.setItem('rwin_user_email', email);
  if (!localStorage.getItem('rwin_plan')) {
    localStorage.setItem('rwin_plan', 'FREE');
  }

  alert("Welcome to RWIN VIP Arena! 🎯");
  window.location.href = "game.html"; // Immediate Sync Redirection
}
</script>
</body>
</html>
