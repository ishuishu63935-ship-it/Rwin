<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWIN - Login</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase App & Auth SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase.js"></script>
</head>

<body>
<div class="auth-container">
  <div class="auth-card">
    <h1 style="color:var(--neon-blue); font-size:28px; font-weight:800; margin-bottom:6px;">RWIN VIP</h1>
    <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">Sign in to access 70+ Cyber Arena Games</p>

    <input type="email" id="loginEmail" class="input-field" placeholder="Enter Email Address">
    <input type="password" id="loginPass" class="input-field" placeholder="Enter Password">

    <button onclick="processLogin()" class="btn-primary">LOGIN TO PLAY</button>

    <p style="margin-top:18px; font-size:12px; color:#94a3b8;">
      Don't have an account? <a href="register.html" style="color:var(--neon-blue); text-decoration:none; font-weight:700;">Create Account</a>
    </p>
  </div>
</div>

<script>
function processLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPass").value.trim();

    if (!email || !password) return alert("Please enter email and password!");

    // Firebase Auth Login
    firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            localStorage.setItem("rwin_user_email", email);
            window.location.href = "game.html";
        })
        .catch((error) => {
            alert("Login Error: " + error.message);
        });
}
</script>
</body>
</html>
