<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWIN - Login</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<div class="auth-container">
  <div class="auth-card">
    <h1 style="color:var(--neon-blue); font-size:28px; font-weight:800; margin-bottom:6px;">RWIN VIP</h1>
    <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">Sign in to access 70+ Cyber Arena Games</p>

    <input type="email" id="loginEmail" class="input-field" placeholder="Enter Email Address" value="mahanlog387@gmail.com">
    <input type="password" id="loginPass" class="input-field" placeholder="Enter Password" value="••••••••">

    <button onclick="processLogin()" class="btn-primary">LOGIN TO PLAY</button>

    <p style="margin-top:18px; font-size:12px; color:#94a3b8;">
      Don't have an account? <a href="register.html" style="color:var(--neon-blue); text-decoration:none; font-weight:700;">Create Account</a>
    </p>
  </div>
</div>

<script>
function processLogin() {
    const email = document.getElementById("loginEmail").value;
    if (!email) return alert("Please enter email!");
    localStorage.setItem("rwin_user_email", email);
    window.location.href = "game.html";
}
</script>
</body>
</html>
