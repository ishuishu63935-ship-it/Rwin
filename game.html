
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RWIN - VIP Arcade Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-gold: #f59e0b;
  --neon-pink: #ec4899;
  --bg-dark: #050811;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

input, select, button { -webkit-user-select: auto; user-select: auto; }

body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; }
.gameContainer { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; position: relative; padding-bottom: 80px; }

.topBar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #070a14; border-bottom: 1px solid var(--border-color); }
.tier-badge { background: linear-gradient(135deg, var(--neon-pink), #be185d); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; }

.xp-container { background: #070a14; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 11px; }
.xp-bar-outer { width: 120px; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.xp-bar-inner { width: 0%; height: 100%; background: var(--neon-blue); transition: width 0.3s; }

.balanceCard { background: var(--bg-dark); margin: 10px 14px; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; text-align: center; }
.balanceCard h1 { font-size: 28px; margin: 2px 0; color: var(--neon-blue); font-weight: 800; }

.back-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 10px; margin: 8px 12px; border: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; }

.arena-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px; margin-bottom: 20px; }
.game-card-btn { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; width: 100%; color: #fff; font-family: inherit; }
.game-card-btn:active { transform: scale(0.95); background: #0f172a; }
.game-card-btn h3 { font-size: 12px; color: #fff; margin: 4px 0 0 0; font-weight: 700; }

.bottomNav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #070a14; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 999; }
.navItem { color: #94a3b8; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
.navItem.active { color: var(--neon-blue); font-weight: 700; }

.aviator-canvas { background: #000; border: 1px solid var(--border-color); border-radius: 12px; width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
.modal-box { background: var(--card-bg); border: 2px solid var(--neon-blue); border-radius: 18px; padding: 20px; text-align: center; width: 85%; max-width: 320px; }
</style>
</head>

<script>
var gameBalance = 10000;
var userXP = parseInt(localStorage.getItem('rwin_xp') || '0');

function getLevel() { return Math.floor(userXP / 200) + 1; }

function addXP(amount) {
    userXP += amount;
    localStorage.setItem('rwin_xp', userXP.toString());
    updateUIState();
}

function updateUIState() {
    var tier = localStorage.getItem('rwin_tier') || 'free';
    var badge = document.getElementById("userTierBadge");
    if (badge) {
        if (tier === 'vip_200') badge.innerText = "SUPER VIP (6M)";
        else if (tier === 'platinum_99') badge.innerText = "PLATINUM (4M)";
        else if (tier === 'gold_49') badge.innerText = "GOLD (2M)";
        else if (tier === 'starter_9') badge.innerText = "STARTER (16D)";
        else badge.innerText = "FREE TIER";
    }

    var lvl = getLevel();
    var currentLvlXP = userXP % 200;
    var lEl = document.getElementById("levelText"); if (lEl) lEl.innerText = "LVL " + lvl;
    var xEl = document.getElementById("xpText"); if (xEl) xEl.innerText = currentLvlXP + "/200 XP";
    var bar = document.getElementById("xpBarInner"); if (bar) bar.style.width = ((currentLvlXP / 200) * 100) + "%";

    var balEl = document.getElementById("balanceText");
    if (balEl) balEl.innerText = "₹" + gameBalance.toLocaleString();
}

function resetCoins() {
    gameBalance = 10000;
    updateUIState();
    showModal("🔄 BALANCE RESET", "VIP practice coins restored to ₹10,000!", "💰", true);
}

function showModal(title, msg, icon, isWin) {
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMsg").innerText = msg;
    document.getElementById("modalIcon").innerText = icon || (isWin ? "🎉" : "💥");
    document.getElementById("customModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("customModal").style.display = "none";
}

function launchGame(gameId, title) {
    document.getElementById('arenaHub').style.display = 'none';
    document.getElementById('backBar').style.display = 'flex';
    document.getElementById('activeGameTitle').innerText = title;
    
    var container = document.getElementById('activeGameArea');
    container.style.display = 'block';
    
    if (gameId === 'color') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:14px; padding:12px; text-align:center;">
                <div style="display:flex; justify-content:space-between; background:#050811; padding:6px; border-radius:8px; margin-bottom:10px; font-size:10px; font-weight:700;">
                    <span style="color:var(--neon-pink); border-bottom:2px solid var(--neon-pink);">WinGo 30s</span>
                    <span style="color:#94a3b8;">WinGo 1Min</span>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;">
                    <button onclick="playWinGo('GREEN', 2)" style="padding:12px; background:#10b981; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Green (2X)</button>
                    <button onclick="playWinGo('VIOLET', 4.5)" style="padding:12px; background:#8b5cf6; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Violet (4.5X)</button>
                    <button onclick="playWinGo('RED', 2)" style="padding:12px; background:#ef4444; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Red (2X)</button>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                    <button onclick="playWinGo('BIG', 2)" style="padding:12px; background:#f59e0b; color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Big (2X)</button>
                    <button onclick="playWinGo('SMALL', 2)" style="padding:12px; background:#3b82f6; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Small (2X)</button>
                </div>
            </div>
        `;
    } else if (gameId === 'aviator') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:14px; padding:12px; text-align:center;">
                <div class="aviator-canvas">
                    <div id="jetMulti" style="font-size:38px; font-weight:800; color:#fff;">1.00x</div>
                </div>
                <button id="jetBtn" onclick="launchJet()" style="width:100%; margin-top:10px; padding:12px; background:#10b981; color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">BET 100 & LAUNCH</button>
            </div>
        `;
    } else {
        var nameUpper = gameId.replace(/_/g, ' ').toUpperCase();
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:14px; padding:16px; text-align:center;">
                <div style="font-size:40px; margin-bottom:6px;">🎰</div>
                <div style="font-size:16px; font-weight:800; color:var(--neon-blue);">${nameUpper}</div>
                <div style="font-size:11px; color:#94a3b8; margin:6px 0 14px 0;">Multiplier: <b style="color:var(--neon-green);">2.20X</b></div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                    <button onclick="playGeneric('${nameUpper}', 'OPTION A')" style="padding:12px; background:var(--neon-blue); color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">OPTION A</button>
                    <button onclick="playGeneric('${nameUpper}', 'OPTION B')" style="padding:12px; background:var(--neon-gold); color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">OPTION B</button>
                </div>
            </div>
        `;
    }
}

function exitToArena() {
    document.getElementById('arenaHub').style.display = 'block';
    document.getElementById('activeGameArea').style.display = 'none';
    document.getElementById('activeGameArea').innerHTML = '';
    document.getElementById('backBar').style.display = 'none';
}

function playWinGo(sel, multi) {
    if (gameBalance < 100) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);
    gameBalance -= 100;
    addXP(50);
    if (Math.random() < 0.5) {
        var won = 200; gameBalance += won; showModal("WIN!", "Selected " + sel + "! Won ₹" + won + " (+50 XP)", "🎨", true);
    } else {
        showModal("LOST", "Selected " + sel + "! Try again (+50 XP)", "💥", false);
    }
    updateUIState();
}

var flying = false, m = 1.00, timer;
function launchJet() {
    var btn = document.getElementById("jetBtn");
    if (!flying) {
        if (gameBalance < 100) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);
        gameBalance -= 100; addXP(50);
        flying = true; m = 1.00;
        btn.innerText = "CASHOUT"; btn.style.background = "#f59e0b";
        var crashAt = (Math.random() *
