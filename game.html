
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RWIN - VIP Arcade Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-gold: #f59e0b;
  --neon-pink: #ec4899;
  --bg-dark: #050811;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

input, select, button { -webkit-user-select: auto; user-select: auto; }

body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; }
.gameContainer { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; position: relative; padding-bottom: 80px; }

.topBar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #070a14; border-bottom: 1px solid var(--border-color); }
.tier-badge { background: linear-gradient(135deg, var(--neon-pink), #be185d); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; }

.xp-container { background: #070a14; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 11px; }
.xp-bar-outer { width: 120px; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.xp-bar-inner { width: 0%; height: 100%; background: var(--neon-blue); transition: width 0.3s; }

.balanceCard { background: var(--bg-dark); margin: 10px 14px; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; text-align: center; }
.balanceCard h1 { font-size: 28px; margin: 2px 0; color: var(--neon-blue); font-weight: 800; }

.back-bar { display: none; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 10px; margin: 8px 12px; border: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; }

.arena-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px; margin-bottom: 20px; }
.game-card { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; width: 100%; color: #fff; font-family: inherit; }
.game-card:active { transform: scale(0.95); background: #0f172a; }
.game-card h3 { font-size: 12px; color: #fff; margin: 4px 0 0 0; font-weight: 700; }

.bottomNav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #070a14; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 999; }
.navItem { color: #94a3b8; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
.navItem.active { color: var(--neon-blue); font-weight: 700; }

.game-view { display: none; padding: 12px; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
.modal-box { background: var(--card-bg); border: 2px solid var(--neon-blue); border-radius: 18px; padding: 20px; text-align: center; width: 85%; max-width: 320px; }
</style>
</head>

<body>

      <button onclick="playGeneric('OPTION B')" style="padding:12px; background:var(--neon-gold); color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">OPTION B (2.2X)</button>

<script>
var balance = 10000;
var flying = false, m = 1.00, timer = null;

function openGame(viewId, title) {
  document.getElementById('arenaHub').style.display = 'none';
  document.getElementById('backBar').style.display = 'flex';
  document.getElementById('activeGameTitle').innerText = title;
  
  var views = document.querySelectorAll('.game-view');
  for (var i = 0; i < views.length; i++) { views[i].style.display = 'none'; }
  
  if (viewId === 'generic') {
    document.getElementById('genericGameTitle').innerText = title;
  }
  
  var target = document.getElementById('view-' + viewId);
  if (target) { target.style.display = 'block'; }
}

function goBack() {
  document.getElementById('arenaHub').style.display = 'block';
  document.getElementById('backBar').style.display = 'none';
  
  var views = document.querySelectorAll('.game-view');
  for (var i = 0; i < views.length; i++) { views[i].style.display = 'none'; }
  
  if (timer) clearInterval(timer);
  flying = false;
}

function closeModal() {
  document.getElementById('customModal').style.display = 'none';
}

function showModal(title, msg, icon, isWin) {
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalMsg").innerText = msg;
  document.getElementById("modalIcon").innerText = icon || (isWin ? "🎉" : "💥");
  document.getElementById("customModal").style.display = "flex";
}

function resetCoins() {
  balance = 10000;
  document.getElementById("balanceText").innerText = "₹10,000";
  showModal("🔄 BALANCE RESET", "VIP practice coins restored to ₹10,000!", "💰", true);
}

function playWinGo(sel, multi) {
  if (balance < 100) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);
  balance -= 100;
  if (Math.random() < 0.5) {
    var won = Math.floor(100 * multi); balance += won; showModal("WIN!", "Selected " + sel + "! Won ₹" + won, "🎨", true);
  } else {
    showModal("LOST", "Selected " + sel + "! Try again", "💥", false);
  }
  document.getElementById("balanceText").innerText = "₹" + balance.toLocaleString();
}

function launchJet() {
  var btn = document.getElementById("jetBtn");
  if (!flying) {
    if (balance < 100) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);
    balance -= 100;
    flying = true; m = 1.00;
    btn.innerText = "CASHOUT"; btn.style.background = "#f59e0b";
    var crashAt = (Math.random() * 3 + 1.1).toFixed(2);
    timer = setInterval(function () {
      m += 0.05;
      var el = document.getElementById("jetMulti"); if (el) el.innerText = m.toFixed(2) + "x";
      if (m >= crashAt) {
        clearInterval(timer); flying = false;
        if (el) el.innerText = "FLEW AWAY!";
        btn.innerText = "BET 100 & LAUNCH"; btn.style.background = "#10b981";
        showModal("FLEW AWAY", "Crashed @ " + m.toFixed(2) + "x", "✈️", false);
      }
    }, 100);
  } else {
    clearInterval(timer); flying = false;
    var won = Math.floor(100 * m); balance += won;
    document.getElementById("balanceText").innerText = "₹" + balance.toLocaleString();
    showModal("CASHED OUT!", "Cashed out @ " + m.toFixed(2) + "x\nWon ₹" + won, "✈️", true);
    btn.innerText = "BET 100 & LAUNCH"; btn.style.background = "#10b981";
  }
}

function playGeneric(opt) {
  if (balance < 500) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);
  balance -= 500;
  if (Math.random() < 0.48) {
    var won = 1100; balance += won; showModal("ROUND WIN!", opt + " Won! ₹" + won, "🎉", true);
  } else {
    showModal("ROUND LOST", opt + " Lost", "💥", false);
  }
  document.getElementById("balanceText").innerText = "₹" + balance.toLocaleString();
}
</script>
</body>
</html>
