<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rwin Central Game Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; }
.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 14px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 6px 14px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }
.auth-nav { display: flex; gap: 6px; align-items: center; }
.wallet-btn { padding: 6px 10px; background: linear-gradient(135deg, var(--neon-gold), #d97706); color: #000; border-radius: 10px; text-decoration: none; font-size: 10px; font-weight: 900; }
.login-btn { padding: 6px 10px; background: linear-gradient(135deg, var(--neon-blue), #0284c7); color: #000; border-radius: 10px; text-decoration: none; font-size: 10px; font-weight: 900; }
.logout-btn { padding: 6px 10px; background: #ef4444; color: #fff; border: none; border-radius: 10px; font-size: 10px; font-weight: 900; cursor: pointer; }

/* 30 Sec Engagement Hook Banner */
.engagement-banner { background: linear-gradient(135deg, #1e1b4b, #311b92); border: 1px solid var(--neon-blue); border-radius: 12px; padding: 10px; margin: 10px 0; text-align: center; font-size: 11px; }
.engagement-timer { font-size: 14px; font-weight: 900; color: var(--neon-gold); margin-top: 4px; }

.profile-strip { display: flex; justify-content: space-between; align-items: center; background: #04060d; border: 1px solid var(--border-color); border-radius: 14px; padding: 10px 14px; margin: 12px 0; }
.reset-btn { padding: 6px 12px; background: #1e293b; border: 1px solid var(--neon-blue); color: var(--neon-blue); border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; }

.game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
.game-card { background: #04060d; border: 1.5px solid var(--border-color); border-radius: 16px; padding: 12px; text-align: center; cursor: pointer; position: relative; transition: transform 0.1s; }
.game-card:active { transform: scale(0.96); }
.game-card.locked { opacity: 0.6; filter: grayscale(0.5); }
.lock-badge { position: absolute; top: 8px; right: 8px; font-size: 12px; }

.game-icon { font-size: 32px; margin-bottom: 4px; }
.game-title { font-size: 12px; font-weight: 800; color: #fff; }
.game-sub { font-size: 9px; color: #94a3b8; font-weight: 700; margin-top: 2px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
    <div class="auth-nav" id="headerAuthNav"></div>
  </div>

  <!-- PopAds Visitor 30 Sec Engagement Hook -->
  <div class="engagement-banner" id="bonusBanner">
    🎁 Stay on site for <b>30 seconds</b> to claim <b>+₹5,000 Free Bonus Coins!</b>
    <div class="engagement-timer" id="hookTimer">⏱️ Time Left: 30s</div>
  </div>

  <div class="profile-strip">
    <div>
      <div style="font-size:10px; color:#94a3b8;" id="userLabelTxt">GUEST SESSION</div>
      <div style="font-size:12px; font-weight:900; color:var(--neon-gold);" id="planTxt">FREE</div>
    </div>
    <button class="reset-btn" onclick="resetBalance()">RESET COINS 🔄</button>
  </div>

  <div class="game-grid" id="gameGrid"></div>
</div>

<script>
let userEmail = localStorage.getItem('rwin_user_email') || null;
let plan = localStorage.getItem('rwin_plan') || 'FREE';
let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');

if (!localStorage.getItem('rwin_balance')) {
  localStorage.setItem('rwin_balance', '10000');
}

const gamesList = [
  { name: "Color Trading", icon: "🎨", file: "color.html", free: true },
  { name: "Aviator Rocket", icon: "🚀", file: "aviator.html", free: true },
  { name: "Vortex Wheel", icon: "🌀", file: "vortex.html", free: false },
  { name: "3 Patti Deluxe", icon: "🃏", file: "teenpatti.html", free: false },
  { name: "Dragon vs Tiger", icon: "🐉", file: "dragon.html", free: false },
  { name: "Cyber Mines", icon: "💣", file: "mines.html", free: false },
  { name: "Rummy Pro", icon: "🎴", file: "rummy.html", free: false },
  { name: "Roulette", icon: "🎡", file: "roulette.html", free: false },
  { name: "Blackjack 21", icon: "♠️", file: "blackjack.html", free: false },
  { name: "Mega Slots", icon: "🎰", file: "slots.html", free: false },
  { name: "Baccarat", icon: "👑", file: "baccarat.html", free: false },
  { name: "Andar Bahar", icon: "🅰️", file: "andarbahar.html", free: false },
  { name: "7 Up 7 Down", icon: "🎲", file: "sevenup.html", free: false },
  { name: "Hi-Lo Trader", icon: "📈", file: "hilow.html", free: false },
  { name: "Sic Bo", icon: "🎯", file: "sicbo.html", free: false },
  { name: "Coin Flip", icon: "🪙", file: "coinflip.html", free: false },
  { name: "Fortune Wheel", icon: "🔮", file: "fortune.html", free: false },
  { name: "Penalty Kick", icon: "⚽", file: "penalty.html", free: false },
  { name: "Chicken Road", icon: "🐔", file: "chicken.html", free: false },
  { name: "Crypto Trader", icon: "📊", file: "crypto.html", free: false }
];

function syncUI() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
  document.getElementById('planTxt').innerText = plan;

  const authNav = document.getElementById('headerAuthNav');
  const userLabel = document.getElementById('userLabelTxt');

  if (userEmail) {
    userLabel.innerText = userEmail.split('@')[0].toUpperCase();
    authNav.innerHTML = `
      <a href="wallet.html" class="wallet-btn">💳 VIP WALLET</a>
      <button class="logout-btn" onclick="logoutUser()">LOGOUT</button>
    `;
  } else {
    userLabel.innerText = "GUEST SESSION";
    authNav.innerHTML = `
      <a href="login.html" class="login-btn">🔑 LOGIN / SIGNUP</a>
      <a href="javascript:void(0)" onclick="handleWalletClick()" class="wallet-btn">💳 VIP WALLET</a>
    `;
  }

  renderGames();
}

function isGameUnlocked(g) {
  if (plan !== 'FREE') return true; // Any VIP plan unlocks all games
  return g.free;
}

function renderGames() {
  const container = document.getElementById('gameGrid');
  container.innerHTML = gamesList.map(g => {
    let unlocked = isGameUnlocked(g);
    return `
      <div class="game-card ${unlocked ? '' : 'locked'}" onclick="launchGame('${g.file}', ${unlocked})">
        <div class="lock-badge">${unlocked ? '🔓' : '🔒'}</div>
        <div class="game-icon">${g.icon}</div>
        <div class="game-title">${g.name}</div>
        <div class="game-sub">${unlocked ? 'PLAY NOW' : 'VIP ONLY'}</div>
      </div>
    `;
  }).join('');
}

function launchGame(file, isUnlocked) {
  if (!isUnlocked) {
    if (!userEmail) {
      alert("🔒 Ye game aur VIP features unlock karne ke liye pehle Account Banao ya Login Karo!");
      window.location.href = "login.html";
    } else {
      alert("🔒 Game Locked! VIP Membership Plan khareed kar saare games unlock karein.");
      window.location.href = "wallet.html";
    }
  } else {
    window.location.href = "./play/" + file;
  }
}

function handleWalletClick() {
  if (!userEmail) {
    alert("🔑 VIP Membership & Wallet ke liye pehle Account Create/Login Karein!");
    window.location.href = "login.html";
  } else {
    window.location.href = "wallet.html";
  }
}

function resetBalance() {
  if (plan === 'FREE') {
    alert("⚠️ Reset Coin Feature is Locked in FREE Plan.\nVIP Plan me upgrade karein unlimited resets ke liye!");
    handleWalletClick();
  } else {
    bal = 10000;
    syncUI();
    alert("🔄 Balance Successfully Reset to ₹10,000!");
  }
}

function logoutUser() {
  localStorage.removeItem('rwin_user_email');
  alert("Logged out successfully!");
  window.location.reload();
}

// PopAds 30-Sec Retention Timer
let timeLeft = 30;
let bonusClaimed = localStorage.getItem('rwin_hook_bonus');

if (bonusClaimed) {
  document.getElementById('bonusBanner').style.display = 'none';
} else {
  let timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('hookTimer').innerText = `⏱️ Time Left: ${timeLeft}s`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      bal += 5000;
      localStorage.setItem('rwin_hook_bonus', 'true');
      syncUI();
      document.getElementById('bonusBanner').innerHTML = "🎉 <b>+₹5,000 Bonus Coins Added to Your Balance!</b>";
    }
  }, 1000);
}

syncUI();
</script>
</body>
</html>
