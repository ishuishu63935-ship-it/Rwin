<script>

// EMBEDDED SELF-CONTAINED CASINO GAME ENGINE (ZERO 404 ERRORS)
// =========================================================
window.game = window.game || { balance: 10000, level: 1 };

window.updateBalance = function() {
    const el = document.getElementById("balanceText");
    if (el) el.innerText = "₹" + window.game.balance.toLocaleString();
};

window.loadMasterGameView = function(gameId) {
    const container = document.getElementById("game-" + gameId);
    if (!container) return;

    // 1. WINGO COLOR PREDICTION (0-9 NUMBERS + RED/GREEN/VIOLET + BIG/SMALL)
    if (gameId === 'color') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:14px; text-align:center;">
                <div style="display:flex; justify-content:space-between; align-items:center; background:#050811; padding:10px; border-radius:12px; margin-bottom:12px; border:1px solid #1e293b;">
                    <span style="font-size:11px; color:#94a3b8;">PERIOD: <b style="color:var(--neon-blue);">20260906001</b></span>
                    <span style="font-size:18px; font-weight:800; color:var(--neon-green);">00:30</span>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;">
                    <button onclick="playWinGo('GREEN', 2)" style="padding:10px; background:#10b981; color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Green (2X)</button>
                    <button onclick="playWinGo('VIOLET', 4.5)" style="padding:10px; background:#8b5cf6; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Violet (4.5X)</button>
                    <button onclick="playWinGo('RED', 2)" style="padding:10px; background:#ef4444; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Red (2X)</button>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px;">
                    <button onclick="playWinGo('BIG', 2)" style="padding:10px; background:#f59e0b; color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">BIG (5-9) 2X</button>
                    <button onclick="playWinGo('SMALL', 2)" style="padding:10px; background:#3b82f6; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">SMALL (0-4) 2X</button>
                </div>

                <div style="font-size:11px; color:#94a3b8; margin-bottom:6px; text-align:left; font-weight:700;">SELECT NUMBER (9X PAYOUT):</div>
                <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:12px;">
                    <button onclick="playWinGo(0, 9)" style="padding:8px; background:linear-gradient(135deg, #ef4444, #8b5cf6); color:#fff; font-weight:800; border-radius:6px; border:none; cursor:pointer;">0</button>
                    <button onclick="playWinGo(1, 9)" style="padding:8px; background:#10b981; color:#000; font-weight:800; border-radius:6px; border:none; cursor:pointer;">1</button>
                    <button onclick="playWinGo(2, 9)" style="padding:8px; background:#ef4444; color:#fff; font-weight:800; border-radius:6px; border:none; cursor:pointer;">2</button>
                    <button onclick="playWinGo(3, 9)" style="padding:8px; background:#10b981; color:#000; font-weight:800; border-radius:6px; border:none; cursor:pointer;">3</button>
                    <button onclick="playWinGo(4, 9)" style="padding:8px; background:#ef4444; color:#fff; font-weight:800; border-radius:6px; border:none; cursor:pointer;">4</button>
                    <button onclick="playWinGo(5, 9)" style="padding:8px; background:linear-gradient(135deg, #10b981, #8b5cf6); color:#fff; font-weight:800; border-radius:6px; border:none; cursor:pointer;">5</button>
                    <button onclick="playWinGo(6, 9)" style="padding:8px; background:#ef4444; color:#fff; font-weight:800; border-radius:6px; border:none; cursor:pointer;">6</button>
                    <button onclick="playWinGo(7, 9)" style="padding:8px; background:#10b981; color:#000; font-weight:800; border-radius:6px; border:none; cursor:pointer;">7</button>
                    <button onclick="playWinGo(8, 9)" style="padding:8px; background:#ef4444; color:#fff; font-weight:800; border-radius:6px; border:none; cursor:pointer;">8</button>
                    <button onclick="playWinGo(9, 9)" style="padding:8px; background:#10b981; color:#000; font-weight:800; border-radius:6px; border:none; cursor:pointer;">9</button>
                </div>

                <div style="display:flex; gap:6px;">
                    <input type="number" id="wingoBet" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                    <button onclick="document.getElementById('wingoBet').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px; cursor:pointer;">2X</button>
                </div>
            </div>
        `;
        window.playWinGo = function(sel, multi) {
            const bet = Number(document.getElementById("wingoBet").value) || 500;
            if (window.game.balance < bet) return alert("Low Balance!");
            window.game.balance -= bet;
            window.updateBalance();

            const num = Math.floor(Math.random() * 10);
            const col = (num === 0 || num === 5) ? "VIOLET" : (num % 2 === 0 ? "RED" : "GREEN");
            const sz = num >= 5 ? "BIG" : "SMALL";

            let win = false;
            if (typeof sel === 'number' && sel === num) win = true;
            if (sel === col || sel === sz) win = true;

            setTimeout(() => {
                if (win) {
                    const won = bet * multi;
                    window.game.balance += won;
                    alert(`🎉 WIN! Drawn: ${num} (${col}/${sz}). Won ₹${won}`);
                } else {
                    alert(`💥 Lost! Drawn: ${num} (${col}/${sz})`);
                }
                window.updateBalance();
            }, 200);
        };
        return;
    }

    // 2. AVIATOR CRASH
    if (gameId === 'aviator') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:16px; text-align:center;">
                <div style="background:#050811; border:2px solid #1e293b; border-radius:14px; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
                    <div id="jetMulti" style="font-size:42px; font-weight:800; color:var(--neon-green);">1.00x</div>
                </div>
                <div style="display:flex; gap:6px; margin-bottom:12px;">
                    <input type="number" id="aviatorBet" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                    <button onclick="document.getElementById('aviatorBet').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px;">2X</button>
                </div>
                <button id="jetBtn" onclick="launchJet()" style="width:100%; padding:14px; background:linear-gradient(135deg, var(--neon-green), #059669); color:#000; font-weight:800; border-radius:12px; border:none; font-size:16px; cursor:pointer;">🚀 LAUNCH JET</button>
            </div>
        `;
        let flying = false;
        let m = 1.00;
        let timer;
        window.launchJet = function() {
            const btn = document.getElementById("jetBtn");
            const bet = Number(document.getElementById("aviatorBet").value) || 500;
            if (!flying) {
                if (window.game.balance < bet) return alert("Low Balance!");
                window.game.balance -= bet;
                window.updateBalance();
                flying = true;
                m = 1.00;
                btn.innerText = "💰 CASHOUT NOW";
                btn.style.background = "linear-gradient(135deg, var(--neon-gold), #d97706)";
                const crashAt = (Math.random() * 3 + 1.1).toFixed(2);
                timer = setInterval(() => {
                    m += 0.05;
                    document.getElementById("jetMulti").innerText = m.toFixed(2) + "x";
                    if (m >= crashAt) {
                        clearInterval(timer);
                        flying = false;
                        document.getElementById("jetMulti").innerText = "💥 FLEW AWAY!";
                        btn.innerText = "🚀 LAUNCH JET";
                        btn.style.background = "linear-gradient(135deg, var(--neon-green), #059669)";
                    }
                }, 100);
            } else {
                clearInterval(timer);
                flying = false;
                const won = Math.floor(bet * m);
                window.game.balance += won;
                window.updateBalance();
                alert(`✈️ Cashed Out @ ${m.toFixed(2)}x! Won ₹${won}`);
                btn.innerText = "🚀 LAUNCH JET";
                btn.style.background = "linear-gradient(135deg, var(--neon-green), #059669)";
            }
        };
        return;
    }

    // 3. CYBER MINES 5X5 GRID
    if (gameId === 'mines') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:14px; text-align:center;">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span style="font-size:12px; color:#94a3b8;">BOMBS: <b style="color:#ef4444;">3</b></span>
                    <span style="font-size:14px; font-weight:800; color:var(--neon-green);" id="minesMulti">1.00x</span>
                </div>
                <div id="minesGrid" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:12px;"></div>
                <div style="display:flex; gap:6px; margin-bottom:10px;">
                    <input type="number" id="minesBet" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                    <button onclick="document.getElementById('minesBet').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px;">2X</button>
                </div>
                <button id="startMinesBtn" onclick="startMinesGame()" style="width:100%; padding:12px; background:linear-gradient(135deg, var(--neon-blue), #0284c7); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">START MINES ROUND</button>
            </div>
        `;
        let mines = [], active = false, mMulti = 1.0;
        function renderMines() {
            const g = document.getElementById("minesGrid");
            g.innerHTML = "";
            for(let i=0; i<25; i++) {
                const b = document.createElement("button");
                b.style.cssText = "height:44px; background:#1e293b; border:1px solid #334155; border-radius:6px; font-size:16px; cursor:pointer;";
                b.innerText = "❓";
                b.onclick = () => {
                    if(!active || b.disabled) return;
                    b.disabled = true;
                    if(mines.includes(i)) {
                        b.innerText = "💣"; b.style.background = "#ef4444"; active = false; alert("💥 BOMB EXPLODED!");
                    } else {
                        b.innerText = "💎"; b.style.background = "#10b981"; mMulti += 0.35;
                        document.getElementById("minesMulti").innerText = mMulti.toFixed(2) + "x";
                    }
                };
                g.appendChild(b);
            }
        }
        renderMines();
        window.startMinesGame = function() {
            const bet = Number(document.getElementById("minesBet").value) || 500;
            if(window.game.balance < bet) return alert("Low Balance!");
            window.game.balance -= bet; window.updateBalance();
            mines = []; while(mines.length < 3) { let r = Math.floor(Math.random()*25); if(!mines.includes(r)) mines.push(r); }
            active = true; mMulti = 1.0; renderMines();
        };
        return;
    }

    // 4. UNIVERSAL CASINO ENGINE FOR ALL OTHER 67 GAMES
    const titleFormatted = gameId.replace(/_/g, ' ').toUpperCase();
    container.innerHTML = `
        <div style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:16px; text-align:center;">
            <div style="background:#050811; border:2px solid #1e293b; border-radius:14px; padding:20px; margin-bottom:12px;">
                <div style="font-size:36px; margin-bottom:6px;">🎰</div>
                <div style="font-size:15px; font-weight:800; color:var(--neon-blue);">${titleFormatted} ARENA</div>
                <div style="font-size:11px; color:#94a3b8; margin-top:4px;">Payout: <b style="color:var(--neon-green);">2.20X Multiplier</b></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
                <button onclick="playUniversal('${gameId}', 'OPTION A')" style="padding:12px; background:linear-gradient(135deg, var(--neon-blue), #0284c7); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">OPTION A (2.2X)</button>
                <button onclick="playUniversal('${gameId}', 'OPTION B')" style="padding:12px; background:linear-gradient(135deg, var(--neon-gold), #d97706); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">OPTION B (2.2X)</button>
            </div>
            <div style="display:flex; gap:6px;">
                <input type="number" id="uniBet_${gameId}" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                <button onclick="document.getElementById('uniBet_${gameId}').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px;">2X</button>
            </div>
        </div>
    `;
    window.playUniversal = function(gId, opt) {
        const bet = Number(document.getElementById(`uniBet_${gId}`).value) || 500;
        if (window.game.balance < bet) return alert("Low Balance!");
        window.game.balance -= bet; window.updateBalance();
        setTimeout(() => {
            if (Math.random() < 0.48) {
                const won = Math.floor(bet * 2.2);
                window.game.balance += won; alert(`🎉 ${opt} WIN! Won ₹${won}`);
            } else { alert(`💥 ${opt} Lost`); }
            window.updateBalance();
        }, 200);
    };
};

window.openGame = function(gameId, title) {
    document.getElementById('arenaHub').style.display = 'none';
    document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
    
    let targetScreen = document.getElementById('game-' + gameId);
    if (!targetScreen) {
        targetScreen = document.createElement('div');
        targetScreen.id = 'game-' + gameId;
        targetScreen.className = 'game-screen';
        document.querySelector('.gameContainer').appendChild(targetScreen);
    }
    
    targetScreen.classList.add('active');
    document.getElementById('backBar').style.display = 'flex';
    document.getElementById('activeGameTitle').innerText = title;

    window.loadMasterGameView(gameId);
};

window.exitToArena = function() {
    document.getElementById('arenaHub').style.display = 'block';
    document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
    document.getElementById('backBar').style.display = 'none';
};

window.checkAndOpenGame = function(gameId, title, reqLvl, isVip) {
    const tier = window.CasinoSession ? window.CasinoSession.getTier() : 'free';

    if (isVip && tier !== 'vip') {
        alert("👑 ₹200 Super VIP Exclusive: Upgrade to ₹200 VIP Vault Pass to unlock all 70+ Casino Games!");
        return;
    }

    if (tier === 'free' && reqLvl > 4) {
        alert("🔒 Starter Pass Required: Games above Level 4 require Starter Pass (₹9 / 16 Days) to unlock!");
        return;
    }

    window.openGame(gameId, title);
};
