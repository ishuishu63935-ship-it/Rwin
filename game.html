
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWIN - VIP Cyber Arcade & Casino Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-gold: #f59e0b;
  --neon-pink: #ec4899;
}
body { margin: 0; padding: 0; background: #050811; font-family: 'Poppins', sans-serif; color: #fff; }
.gameContainer { max-width: 480px; margin: 0 auto; background: #0b101d; min-height: 100vh; position: relative; padding-bottom: 80px; box-sizing: border-box; }
.topBar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #070a14; border-bottom: 1px solid #1e293b; }
.balanceCard { background: #050811; margin: 10px 14px; border: 1px solid #1e293b; border-radius: 14px; padding: 12px; text-align: center; }
.balanceCard h1 { font-size: 26px; margin: 2px 0; color: var(--neon-blue); }

.game-screen { display: none; padding: 10px; color: #fff; width: 100%; box-sizing: border-box; }
.game-screen.active { display: block !important; }
.back-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 10px; margin: 8px 12px; border: 1px solid #1e293b; }
.back-btn { padding: 4px 10px; background: #1e293b; color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; }

.arena-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px; margin-bottom: 20px; }
.game-card { background: #050811; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; }
.game-card h3 { font-size: 12px; color: #fff; margin: 4px 0 0 0; }

.bottomNav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #070a14; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 8px 0; z-index: 999; box-sizing: border-box; }
.navItem { color: #94a3b8; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
.navItem.active { color: var(--neon-blue); font-weight: 700; }

/* 55 CLUB WINGO SPECIAL STYLES */
.wingo-ring { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; color: #fff; margin: 0 auto; }
.wingo-chip { padding: 4px 8px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; color: #94a3b8; }
.wingo-chip.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); }

/* AVIATOR SPRIBE SPECIAL STYLES */
.aviator-canvas { background: #000; border: 1px solid #1e293b; border-radius: 12px; width: 100%; height: 160px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.history-strip { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; margin-bottom: 8px; }
.history-pill { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; background: #1e293b; color: #94a3b8; white-space: nowrap; }

#customModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; }
.modal-box { background: #0b101d; border: 2px solid var(--neon-blue); border-radius: 16px; padding: 20px; text-align: center; width: 80%; max-width: 300px; }
</style>
</head>

<body>
<div class="gameContainer">

<div id="customModal">
  <div class="modal-box" id="modalBox">
    <div id="modalIcon" style="font-size:40px; margin-bottom:6px;">🎯</div>
    <h3 id="modalTitle" style="color:#fff; font-size:16px; margin:0 0 4px 0;">RESULT</h3>
    <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 14px 0;">Details</p>
    <button onclick="closeModal()" style="width:100%; padding:10px; background:var(--neon-blue); color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">CONTINUE</button>
  </div>
</div>

<header class="topBar">
  <div>
    <h1 style="font-size:15px; margin:0; color:#fff;">🎮 RWIN VIP Arena</h1>
    <span style="font-size:10px; color:#94a3b8;">LVL 1 (0/500 XP)</span>
  </div>
  <span style="font-size:10px; color:var(--neon-green);">● Connected</span>
</header>

<section class="balanceCard">
  <p style="font-size:10px; color:#94a3b8; margin:0;">Practice Balance</p>
  <h1 id="balanceText">₹10,000</h1>
  <button onclick="resetCoins()" style="margin-top:4px; padding:6px 12px; background:var(--neon-blue); color:#000; border:none; border-radius:6px; font-weight:800; font-size:11px; cursor:pointer;">🔄 Reset VIP Coins</button>
</section>

<div id="backBar" class="back-bar" style="display:none;">
  <button class="back-btn" onclick="exitToArena()">⬅️ Back to Hub</button>
  <b id="activeGameTitle" style="color:var(--neon-blue); font-size:13px;">Game</b>
</div>

<div id="arenaHub"></div>

<nav class="bottomNav">
  <a href="home.html" class="navItem">🏠 <span>Home</span></a>
  <a href="game.html" class="navItem active">🎮 <span>Arena</span></a>
  <a href="wallet.html" class="navItem">💰 <span>Wallet</span></a>
  <a href="profile.html" class="navItem">👤 <span>Profile</span></a>
</nav>

</div>

<script>
window.game = window.game || { balance: 10000, level: 1 };

function updateBalance() {
    const el = document.getElementById("balanceText");
    if (el) el.innerText = "₹" + window.game.balance.toLocaleString();
}

function resetCoins() {
    window.game.balance = 10000;
    updateBalance();
    showModal("🔄 Balance Reset", "Coins restored to ₹10,000!", "💰", true);
}

function showModal(title, msg, icon, isWin) {
    document.getElementById("modalTitle").innerText = title;
    document.getElementById("modalMsg").innerText = msg;
    document.getElementById("modalIcon").innerText = icon || (isWin ? "🎉" : "💥");
    document.getElementById("modalBox").style.borderColor = isWin ? "var(--neon-green)" : "#ef4444";
    document.getElementById("customModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("customModal").style.display = "none";
}

// 55 CLUB WINGO STATE
let wingoTimer = 30;
let wingoPeriod = 20260906001;
let wingoMulti = 1;
let wingoHistory = [
    { period: "20260906000", num: 7, col: "GREEN", sz: "BIG" },
    { period: "20260906999", num: 2, col: "RED", sz: "SMALL" }
];
let wingoTimerInt = null;

window.loadMasterGameView = function(gameId) {
    const container = document.getElementById("game-" + gameId);
    if (!container) return;

    // 1. EXACT 55 CLUB WINGO UI
    if (gameId === 'color') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:14px; padding:12px; text-align:center;">
                <!-- Mode Bar -->
                <div style="display:flex; justify-content:space-between; background:#050811; padding:6px; border-radius:8px; margin-bottom:10px; font-size:10px; font-weight:700;">
                    <span style="color:var(--neon-pink); border-bottom:2px solid var(--neon-pink);">WinGo 30s</span>
                    <span style="color:#94a3b8;">WinGo 1Min</span>
                    <span style="color:#94a3b8;">WinGo 3Min</span>
                    <span style="color:#94a3b8;">WinGo 5Min</span>
                </div>

                <!-- Clock Bar -->
                <div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:8px 12px; border-radius:10px; margin-bottom:10px;">
                    <div style="text-align:left;">
                        <div style="font-size:9px; color:#94a3b8;">Period</div>
                        <div style="font-size:12px; font-weight:800; color:var(--neon-blue);" id="wingoPeriodEl">${wingoPeriod}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:9px; color:#94a3b8;">Time Remaining</div>
                        <div style="font-size:18px; font-weight:800; color:#fff; background:#000; padding:2px 8px; border-radius:6px;" id="wingoClockEl">00:30</div>
                    </div>
                </div>

                <!-- Green / Violet / Red -->
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:10px;">
                    <button onclick="playWinGo('GREEN', 2)" style="padding:10px; background:#10b981; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Green</button>
                    <button onclick="playWinGo('VIOLET', 4.5)" style="padding:10px; background:#8b5cf6; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Violet</button>
                    <button onclick="playWinGo('RED', 2)" style="padding:10px; background:#ef4444; color:#fff; font-weight:800; border-radius:8px; border:none; cursor:pointer;">Red</button>
                </div>

                <!-- 0-9 Ring Circles -->
                <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin-bottom:10px;">
                    <div onclick="playWinGo(0, 9)" class="wingo-ring" style="background:linear-gradient(135deg, #ef4444, #8b5cf6);">0</div>
                    <div onclick="playWinGo(1, 9)" class="wingo-ring" style="background:#10b981;">1</div>
                    <div onclick="playWinGo(2, 9)" class="wingo-ring" style="background:#ef4444;">2</div>
                    <div onclick="playWinGo(3, 9)" class="wingo-ring" style="background:#10b981;">3</div>
                    <div onclick="playWinGo(4, 9)" class="wingo-ring" style="background:#ef4444;">4</div>
                    <div onclick="playWinGo(5, 9)" class="wingo-ring" style="background:linear-gradient(135deg, #10b981, #8b5cf6);">5</div>
                    <div onclick="playWinGo(6, 9)" class="wingo-ring" style="background:#ef4444;">6</div>
                    <div onclick="playWinGo(7, 9)" class="wingo-ring" style="background:#10b981;">7</div>
                    <div onclick="playWinGo(8, 9)" class="wingo-ring" style="background:#ef4444;">8</div>
                    <div onclick="playWinGo(9, 9)" class="wingo-ring" style="background:#10b981;">9</div>
                </div>

                <!-- Chips Bar -->
                <div style="display:flex; justify-content:center; gap:6px; margin-bottom:10px;">
                    <span onclick="setWingoChip(1)" class="wingo-chip active" id="chip-1">X1</span>
                    <span onclick="setWingoChip(5)" class="wingo-chip" id="chip-5">X5</span>
                    <span onclick="setWingoChip(10)" class="wingo-chip" id="chip-10">X10</span>
                    <span onclick="setWingoChip(20)" class="wingo-chip" id="chip-20">X20</span>
                    <span onclick="setWingoChip(50)" class="wingo-chip" id="chip-50">X50</span>
                </div>

                <!-- Big / Small Bar -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px;">
                    <button onclick="playWinGo('BIG', 2)" style="padding:10px; background:#f59e0b; color:#000; font-weight:800; border-radius:20px 0 0 20px; border:none; cursor:pointer;">Big</button>
                    <button onclick="playWinGo('SMALL', 2)" style="padding:10px; background:#3b82f6; color:#fff; font-weight:800; border-radius:0 20px 20px 0; border:none; cursor:pointer;">Small</button>
                </div>

                <!-- History Table -->
                <div style="background:#050811; border:1px solid #1e293b; border-radius:10px; padding:8px; text-align:left;">
                    <div style="font-size:10px; font-weight:800; color:var(--neon-gold); margin-bottom:4px;">📊 Game History</div>
                    <div id="wingoHistList" style="font-size:10px;"></div>
                </div>
            </div>
        `;

        window.setWingoChip = function(c) {
            wingoMulti = c;
            document.querySelectorAll('.wingo-chip').forEach(el => el.classList.remove('active'));
            document.getElementById('chip-' + c).classList.add('active');
        };

        function renderWingoHist() {
            const list = document.getElementById("wingoHistList");
            if (!list) return;
            list.innerHTML = wingoHistory.map(h => `
                <div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed #1e293b;">
                    <span>${h.period}</span>
                    <b style="color:${h.col === 'GREEN' ? '#10b981' : (h.col === 'RED' ? '#ef4444' : '#8b5cf6')}">${h.num} (${h.sz})</b>
                </div>
            `).join('');
        }
        renderWingoHist();

        if (wingoTimerInt) clearInterval(wingoTimerInt);
        wingoTimerInt = setInterval(() => {
            wingoTimer--;
            const clock = document.getElementById("wingoClockEl");
            if (clock) clock.innerText = `00:${wingoTimer.toString().padStart(2, '0')}`;

            if (wingoTimer <= 0) {
                wingoTimer = 30;
                wingoPeriod++;
                const pEl = document.getElementById("wingoPeriodEl");
                if (pEl) pEl.innerText = wingoPeriod;

                const resNum = Math.floor(Math.random() * 10);
                const resCol = (resNum === 0 || resNum === 5) ? "VIOLET" : (resNum % 2 === 0 ? "RED" : "GREEN");
                const resSz = resNum >= 5 ? "BIG" : "SMALL";
                wingoHistory.unshift({ period: wingoPeriod - 1, num: resNum, col: resCol, sz: resSz });
                if (wingoHistory.length > 5) wingoHistory.pop();
                renderWingoHist();
            }
        }, 1000);

        window.playWinGo = function(sel, multi) {
            const bet = 100 * wingoMulti;
            if (window.game.balance < bet) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);

            window.game.balance -= bet; updateBalance();

            const num = Math.floor(Math.random() * 10);
            const col = (num === 0 || num === 5) ? "VIOLET" : (num % 2 === 0 ? "RED" : "GREEN");
            const sz = num >= 5 ? "BIG" : "SMALL";

            let win = (typeof sel === 'number' && sel === num) || (sel === col || sel === sz);

            setTimeout(() => {
                if (win) {
                    const won = bet * multi;
                    window.game.balance += won;
                    showModal("WIN!", `Drawn: ${num} (${col}/${sz})\nWon ₹${won}`, "🎨", true);
                } else {
                    showModal("LOST", `Drawn: ${num} (${col}/${sz})`, "💥", false);
                }
                updateBalance();
            }, 200);
        };
        return;
    }

    // 2. OFFICIAL SPRIBE AVIATOR UI
    if (gameId === 'aviator') {
        container.innerHTML = `
            <div style="background:#0b101d; border:1px solid #1e293b; border-radius:14px; padding:12px; text-align:center;">
                <!-- History Strip -->
                <div class="history-strip">
                    <span class="history-pill" style="color:#8b5cf6;">1.17x</span>
                    <span class="history-pill" style="color:#10b981;">2.53x</span>
                    <span class="history-pill" style="color:#ef4444;">1.02x</span>
                    <span class="history-pill" style="color:#f59e0b;">10.51x</span>
                    <span class="history-pill" style="color:#10b981;">1.84x</span>
                </div>

                <!-- Flight Canvas Box -->
                <div class="aviator-canvas">
                    <div id="jetMulti" style="font-size:38px; font-weight:800; color:#fff; z-index:2;">1.00x</div>
                </div>

                <!-- Dual Bet Buttons -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
                    <div style="background:#050811; padding:8px; border-radius:10px; border:1px solid #1e293b;">
                        <input type="number" id="avBet1" value="100" style="width:90%; padding:4px; text-align:center; background:#1e293b; border:none; color:#fff; font-weight:700; border-radius:4px; margin-bottom:6px;">
                        <button id="jetBtn1" onclick="launchJet()" style="width:100%; padding:10px; background:#10b981; color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">BET 100</button>
                    </div>
                    <div style="background:#050811; padding:8px; border-radius:10px; border:1px solid #1e293b;">
                        <input type="number" id="avBet2" value="500" style="width:90%; padding:4px; text-align:center; background:#1e293b; border:none; color:#fff; font-weight:700; border-radius:4px; margin-bottom:6px;">
                        <button onclick="alert('Bet Placed')" style="width:100%; padding:10px; background:#10b981; color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">BET 500</button>
                    </div>
                </div>
            </div>
        `;
        let flying = false, m = 1.00, timer;
        window.launchJet = function() {
            const btn = document.getElementById("jetBtn1");
            const bet = Number(document.getElementById("avBet1").value) || 100;
            if (!flying) {
                if (window.game.balance < bet) return showModal("Low Balance", "Reset coins to play!", "⚠️", false);
                window.game.balance -= bet; updateBalance();
                flying = true; m = 1.00;
                btn.innerText = "CASHOUT";
                btn.style.background = "#f59e0b";
                const crashAt = (Math.random() * 3 + 1.1).toFixed(2);
                timer = setInterval(() => {
                    m += 0.05;
                    document.getElementById("jetMulti").innerText = m.toFixed(2) + "x";
                    if (m >= crashAt) {
                        clearInterval(timer); flying = false;
                        document.getElementById("jetMulti").innerText = "FLEW AWAY!";
                        btn.innerText = "BET 100";
                        btn.style.background = "#10b981";
                        showModal("FLEW AWAY", `Crashed @ ${m.toFixed(2)}x`, "✈️", false);
                    }
                }, 100);
            } else {
                clearInterval(timer); flying = false;
                const won = Math.floor(bet * m); window.game.balance += won; updateBalance();
                showModal("CASHED OUT!", `Fly High @ ${m.toFixed(2)}x\nWon ₹${won}`, "✈️", true);
                btn.innerText = "BET 100";
                btn.style.background = "#10b981";
            }
        };
        return;
    }

    // UNIVERSAL FALLBACK FOR OTHER GAMES
    const titleFormatted = gameId.replace(/_/g, ' ').toUpperCase();
    container.innerHTML = `
        <div style="background:#0b101d; border:1px solid #1e293b; border-radius:14px; padding:14px; text-align:center;">
            <div style="background:#050811; padding:16px; border-radius:10px; margin-bottom:10px;">
                <div style="font-size:32px;">🎰</div>
                <div style="font-size:13px; font-weight:800; color:var(--neon-blue);">${titleFormatted}</div>
            </div>
            <button onclick="playUniversal('${gameId}')" style="width:100%; padding:10px; background:var(--neon-blue); color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">PLAY ROUND (2.0X)</button>
        </div>
    `;
    window.playUniversal = function(gId) {
        if (window.game.balance < 500) return showModal("Low Balance", "Reset coins!", "⚠️", false);
        window.game.balance -= 500; updateBalance();
        setTimeout(
