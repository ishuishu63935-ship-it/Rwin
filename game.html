<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RWIN - VIP Arcade Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-gold: #f59e0b;
  --neon-pink: #ec4899;
  --bg-dark: #050811;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

input, select, button { -webkit-user-select: auto; user-select: auto; }

body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; }
.gameContainer { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; position: relative; padding-bottom: 80px; }

.topBar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #070a14; border-bottom: 1px solid var(--border-color); }
.tier-badge { background: linear-gradient(135deg, var(--neon-pink), #be185d); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; }

.xp-container { background: #070a14; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 11px; }
.xp-bar-outer { width: 120px; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.xp-bar-inner { width: 0%; height: 100%; background: var(--neon-blue); transition: width 0.3s; }

.balanceCard { background: var(--bg-dark); margin: 10px 14px; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; text-align: center; }
.balanceCard h1 { font-size: 28px; margin: 2px 0; color: var(--neon-blue); font-weight: 800; }

.back-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 10px; margin: 8px 12px; border: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; }

.arena-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px; margin-bottom: 20px; }
.game-card-btn { background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; width: 100%; color: #fff; font-family: inherit; }
.game-card-btn:active { transform: scale(0.95); background: #0f172a; }
.game-card-btn h3 { font-size: 12px; color: #fff; margin: 4px 0 0 0; font-weight: 700; }

.bottomNav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #070a14; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 999; }
.navItem { color: #94a3b8; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
.navItem.active { color: var(--neon-blue); font-weight: 700; }

.aviator-canvas { background: #000; border: 1px solid var(--border-color); border-radius: 12px; width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
.modal-box { background: var(--card-bg); border: 2px solid var(--neon-blue); border-radius: 18px; padding: 20px; text-align: center; width: 85%; max-width: 320px; }
</style>
</head>

<body>
<div class="gameContainer">

<div id="customModal" class="modal-overlay">
  <div class="modal-box">
    <div id="modalIcon" style="font-size:42px; margin-bottom:6px;">🎯</div>
    <h3 id="modalTitle" style="color:#fff; font-size:16px; margin:0 0 4px 0;">RESULT</h3>
    <p id="modalMsg" style="color:#94a3b8; font-size:12px; margin:0 0 14px 0;">Details</p>
    <button id="closeModalBtn" style="width:100%; padding:10px; background:var(--neon-blue); color:#000; font-weight:800; border-radius:8px; border:none; cursor:pointer;">CONTINUE</button>
  </div>
</div>

<header class="topBar">
  <div>
    <h1 style="font-size:15px; margin:0; color:#fff;">🎮 RWIN VIP Arena</h1>
    <span class="tier-badge" id="userTierBadge">FREE TIER</span>
  </div>
  <button onclick="window.location.href='wallet.html'" style="padding:5px 10px; background:var(--neon-gold); color:#000; border:none; border-radius:6px; font-weight:800; font-size:10px; cursor:pointer;">👑 Upgrade Pass</button>
</header>

<div class="xp-container">
  <span><b style="color:var(--neon-pink);" id="levelText">LVL 1</b></span>
  <div>
    <div class="xp-bar-outer"><div class="xp-bar-inner" id="xpBarInner"></div></div>
    <span style="font-size:9px; color:#94a3b8; margin-left:4px;" id="xpText">0/200 XP</span>
  </div>
</div>

<section class="balanceCard">
  <p style="font-size:10px; color:#94a3b8; margin:0;">Practice Balance</p>
  <h1 id="balanceText">₹10,000</h1>
  <button id="resetCoinsBtn" style="margin-top:4px; padding:6px 12px; background:var(--neon-blue); color:#000; border:none; border-radius:6px; font-weight:800; font-size:11px; cursor:pointer;">🔄 Reset VIP Coins</button>
</section>

<div id="backBar" class="back-bar" style="display:none;">
  <button class="back-btn" id="exitGameBtn">⬅️ Back to Hub</button>
  <b id="activeGameTitle" style="color:var(--neon-blue); font-size:13px;">Game</b>
</div>

<!-- ARENA HUB (CLEAN DATA ATTRIBUTES FOR GUARANTEED TAP ACTION) -->
<div id="arenaHub">
  <h3 style="color:#94a3b8; font-size:11px; margin:8px 12px 4px 12px; letter-spacing:1px;">⚡ FREE PLAY (GAMES 1 & 2)</h3>
  <div class="arena-grid">
    <button class="game-card-btn" data-game="color" data-title="WinGo Color Prediction">
      <div style="font-size:10px; font-weight:800; color:var(--neon-green);">GAME #1 (LVL 1)</div>
      <h3>Color Prediction</h3>
      <p style="color:var(--neon-green); margin:4px 0 0 0; font-size:10px;">⚡ FREE PLAY</p>
    </button>
    <button class="game-card-btn" data-game="aviator" data-title="Aviator Crash Rocket">
      <div style="font-size:10px; font-weight:800; color:var(--neon-green);">GAME #2 (LVL 1)</div>
      <h3>Aviator Crash</h3>
      <p style="color:var(--neon-green); margin:4px 0 0 0; font-size:10px;">⚡ FREE PLAY</p>
    </button>
  </div>

  <h3 style="color:var(--neon-gold); font-size:11px; margin:12px 12px 4px 12px; letter-spacing:1px;">🔒 VIP ARENA (GAMES 3-20 • MEMBERSHIP REQUIRED)</h3>
  <div class="arena-grid">
    <button class="game-card-btn" data-game="vortex" data-title="Vortex Fortune Wheel">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #3</div>
      <h3>Vortex Spin</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🎡 Fortune Wheel</p>
    </button>
    <button class="game-card-btn" data-game="teenpatti" data-title="3 Patti Deluxe">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #4</div>
      <h3>3 Patti Deluxe</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🃏 3-Card Poker</p>
    </button>
    <button class="game-card-btn" data-game="dragon" data-title="Dragon vs Tiger">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #5</div>
      <h3>Dragon vs Tiger</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🐉 Card Duel</p>
    </button>
    <button class="game-card-btn" data-game="mines" data-title="Cyber Minesweeper">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #6</div>
      <h3>Cyber Mines</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">💣 5x5 Mine Grid</p>
    </button>
    <button class="game-card-btn" data-game="rummy" data-title="Rummy Pro 13-Card">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #7</div>
      <h3>Rummy Pro</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🎴 13-Card Meld</p>
    </button>
    <button class="game-card-btn" data-game="roulette" data-title="European Roulette">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #8</div>
      <h3>European Roulette</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🎰 Spin Wheel</p>
    </button>
    <button class="game-card-btn" data-game="blackjack" data-title="Classic Blackjack 21">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #9</div>
      <h3>Blackjack 21</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">♠️ Hit or Stand</p>
    </button>
    <button class="game-card-btn" data-game="baccarat" data-title="Speed Baccarat">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #10</div>
      <h3>Speed Baccarat</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">💎 Player / Banker</p>
    </button>
    <button class="game-card-btn" data-game="andarbahar" data-title="Andar Bahar Royale">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #11</div>
      <h3>Andar Bahar</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">👑 Joker Match</p>
    </button>
    <button class="game-card-btn" data-game="sicbo" data-title="Sic Bo Dice">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #12</div>

    </button>
    <button class="game-card-btn" data-game="slots" data-title="Neon 777 Slots">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #13</div>
      <h3>Neon 777 Slots</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">7️⃣ 3-Reel Slots</p>
    </button>
    <button class="game-card-btn" data-game="dice" data-title="Cyber Dice Roll">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #14</div>
      <h3>Cyber Dice Roll</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🎯 Roll Under 50</p>
    </button>
    <button class="game-card-btn" data-game="hilo" data-title="Hi-Lo Poker Streak">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #15</div>
      <h3>Hi-Lo Poker Streak</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">📈 High or Low</p>
    </button>
    <button class="game-card-btn" data-game="chickenroad" data-title="Chicken Road Cross">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #16</div>
      <h3>Chicken Road</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🐔 Lane Cross</p>
    </button>
    <button class="game-card-btn" data-game="plinko" data-title="Plinko Drop Multiplier">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #17</div>
      <h3>Plinko Drop</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🟢 Peg Drop</p>
    </button>
    <button class="game-card-btn" data-game="limbo" data-title="Limbo Rocket">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #18</div>
      <h3>Limbo Rocket</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🚀 Multiplier Rocket</p>
    </button>
    <button class="game-card-btn" data-game="horserace" data-title="Derby Horse Racing">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #19</div>
      <h3>Derby Horse Racing</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">🐎 4-Horse Track</p>
    </button>
    <button class="game-card-btn" data-game="cryptocandle" data-title="BTC Crypto Candle 30s">
      <div style="font-size:10px; font-weight:800; color:var(--neon-blue);">GAME #20</div>
      <h3>BTC Crypto Candle</h3>
      <p style="color:var(--neon-gold); margin:4px 0 0 0; font-size:10px;">📊 Up / Down Trade</p>
    </button>
  </div>
</div>

<div id="activeGameArea" style="display:none; padding:10px;"></div>

<nav class="bottomNav">
  <a href="home.html" class="navItem">🏠 <span>Home</span></a>
  <a href="game.html" class="navItem active">🎮 <span>Arena</span></a>
  <a href="wallet.html" class="navItem">💰 <span>Wallet</span></a>
  <a href="profile.html" class="navItem">👤 <span>Profile</span></a>
</nav>

</div>

<script src="js/script.js?v=999"></script>
</body>
      </html>
