<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIP Arena Hub - 20 Casino & Arcade Games</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-pink: #ec4899;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg-dark);
  font-family: 'Poppins', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

.hubContainer {
  max-width: 520px;
  margin: 0 auto;
  background: var(--card-bg);
  min-height: 100vh;
  position: relative;
  padding-bottom: 40px;
}

/* HEADER BAR */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  background: #020307;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand-logo {
  font-size: 18px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--neon-gold), #d97706);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
}

.balance-pill {
  background: linear-gradient(135deg, #1e1b4b, #0f172a);
  border: 1px solid var(--neon-gold);
  border-radius: 20px;
  padding: 6px 16px;
  font-weight: 800;
  font-size: 14px;
  color: var(--neon-gold);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
}

/* BANNER */
.hero-banner {
  background: radial-gradient(circle, #2e1065 0%, #0f172a 80%);
  margin: 14px;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
  border: 1px solid var(--neon-purple);
  box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
}

.hero-title {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 4px 0;
  color: #fff;
}

.hero-subtitle {
  font-size: 11px;
  color: #94a3b8;
  margin: 0 0 14px 0;
}

/* SEARCH & CATEGORY FILTER */
.filter-bar {
  padding: 0 14px;
  margin-bottom: 14px;
}

.search-box {
  width: 100%;
  background: #070a14;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 10px 14px;
  color: #fff;
  font-size: 12px;
  font-family: inherit;
  outline: none;
  margin-bottom: 10px;
}

.cat-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.cat-chip {
  padding: 6px 14px;
  background: #0f172a;
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  cursor: pointer;
  white-space: nowrap;
}

.cat-chip.active {
  background: var(--neon-gold);
  color: #000;
  border-color: var(--neon-gold);
}

/* GAMES GRID */
.games-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 14px;
}

.game-card {
  background: linear-gradient(145deg, #0f172a, #070a14);
  border: 1px solid var(--border-color);
  border-radius: 18px;
  padding: 14px 10px;
  text-align: center;
  text-decoration: none;
  color: #fff;
  position: relative;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 140px;
}

.game-card:active {
  transform: scale(0.96);
}

.game-card:hover {
  border-color: var(--neon-blue);
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
}

.card-icon {
  font-size: 36px;
  margin-bottom: 6px;
}

.card-name {
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 4px;
}

.card-tag {
  font-size: 9px;
  font-weight: 700;
  color: var(--neon-gold);
  text-transform: uppercase;
}

.btn-play {
  margin-top: 10px;
  padding: 8px;
  background: linear-gradient(135deg, var(--neon-blue), #0284c7);
  color: #000;
  font-weight: 900;
  font-size: 11px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
}

/* RESET WALLET FOOTER */
.reset-footer {
  text-align: center;
  margin-top: 24px;
  padding: 0 14px;
}

.btn-reset-main {
  padding: 10px 20px;
  background: #1e293b;
  border: 1px solid var(--neon-blue);
  color: var(--neon-blue);
  border-radius: 12px;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="hubContainer">

  <!-- HEADER -->
  <header class="header-bar">
    <div class="brand-logo">⚡ VIP ARENA HUB</div>
    <div class="balance-pill">
      <span>💰</span>
      <span id="hubBalance">₹10,000</span>
    </div>
  </header>

  <!-- HERO BANNER -->
  <div class="hero-banner">
    <div class="hero-title">🎰 20 VIP ARENA GAMES</div>
    <div class="hero-subtitle">SELECT YOUR FAVORITE GAME & START WINNING</div>
    <button class="btn-reset-main" onclick="resetWallet()">🔄 RESET PRACTICE WALLET (₹10,000)</button>
  </div>

  <!-- SEARCH & CATEGORIES -->
  <div class="filter-bar">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search game name..." onkeyup="filterGames()">
    
    <div class="cat-scroll">
      <div class="cat-chip active" onclick="setCategory('ALL', this)">ALL (20)</div>
      <div class="cat-chip" onclick="setCategory('CARD', this)">🎴 CARDS</div>
      <div class="cat-chip" onclick="setCategory('CRASH', this)">🚀 CRASH & MULTI</div>
      <div class="cat-chip" onclick="setCategory('TABLE', this)">🎡 TABLE & DICE</div>
      <div class="cat-chip" onclick="setCategory('ARCADE', this)">🎰 SLOTS & ARCADE</div>
    </div>
  </div>

  <!-- GAMES GRID -->
  <div class="games-grid" id="gamesContainer">
    <!-- 20 GAMES LINKED BELOW -->
  </div>

</div>

<script>
// WEB AUDIO API CLICK SOUND
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(600, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
    osc.start(now); osc.stop(now + 0.04);
  } catch(e) {}
}

// COMPLETE 20 GAMES MASTER DATA
const gamesList = [
  { id: 1, name: "WinGo 30s Color", file: "color.html", cat: "TABLE", icon: "🎨", tag: "COLOR PREDICTION" },
  { id: 2, name: "Aviator Rocket", file: "aviator.html", cat: "CRASH", icon: "🚀", tag: "CRASH MULTIPLIER" },
  { id: 3, name: "Vortex Spin Wheel", file: "vortex.html", cat: "TABLE", icon: "🌀", tag: "WHEEL OF FORTUNE" },
  { id: 4, name: "3 Patti Deluxe", file: "teenpatti.html", cat: "CARD", icon: "🃏", tag: "TEEN PATTI" },
  { id: 5, name: "Dragon vs Tiger", file: "dragon.html", cat: "CARD", icon: "🐉", tag: "SINGLE CARD DUEL" },
  { id: 6, name: "Cyber Minesweeper", file: "mines.html", cat: "ARCADE", icon: "💣", tag: "MINE CASHOUT" },
  { id: 7, name: "Rummy Pro 13-Card", file: "rummy.html", cat: "CARD", icon: "🎴", tag: "13-CARD RUMMY" },
  { id: 8, name: "European Roulette", file: "roulette.html", cat: "TABLE", icon: "🎡", tag: "37-POCKET WHEEL" },
  { id: 9, name: "Blackjack 21", file: "blackjack.html", cat: "CARD", icon: "♠️", tag: "DEALER VS PLAYER" },
  { id: 10, name: "Speed Baccarat", file: "baccarat.html", cat: "CARD", icon: "💎", tag: "MODULO 10 BACCARAT" },
  { id: 11, name: "Andar Bahar Royale", file: "andarbahar.html", cat: "CARD", icon: "🔴", tag: "JOKER MATCH" },
  { id: 12, name: "Sic Bo Dice", file: "sicbo.html", cat: "TABLE", icon: "🎲", tag: "3-DICE ROLL" },
  { id: 13, name: "Neon 777 Slots", file: "slots.html", cat: "ARCADE", icon: "🎰", tag: "3-REEL JACKPOT" },
  { id: 14, name: "Cyber Dice Over/Under", file: "cyberdice.html", cat: "CRASH", icon: "⚡", tag: "CUSTOM PROBABILITY" },
  { id: 15, name: "Hi-Lo Poker Streak", file: "hilo.html", cat: "CARD", icon: "🃏", tag: "HIGH LOW STREAK" },
  { id: 16, name: "Plinko Neon Drop", file: "plinko.html", cat: "ARCADE", icon: "🔴", tag: "PEG BOUNCE MULTI" },
  { id: 17, name: "Chicken Road Cross", file: "chicken.html", cat: "ARCADE", icon: "🐔", tag: "ROAD MULTIPLIER" },
  { id: 18, name: "Limbo Rocket", file: "limbo.html", cat: "CRASH", icon: "🚀", tag: "INSTANT MULTIPLIER" },
  { id: 19, name: "Derby Horse Racing", file: "derby.html", cat: "TABLE", icon: "🏇", tag: "HORSE RACE BETS" },
  { id: 20, name: "BTC Crypto Candle 30s", file: "crypto.html", cat: "CRASH", icon: "📈", tag: "BINARY TRADING" }
];

let activeCategory = 'ALL';

function syncBalance() {
  let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
  document.getElementById('hubBalance').innerText = "₹" + bal.toLocaleString();
}

function resetWallet() {
  playSound();
  localStorage.setItem('rwin_balance', '10000');
  syncBalance();
  alert("💰 Practice Wallet balance restored to ₹10,000!");
}

function renderGames() {
  const container = document.getElementById('gamesContainer');
  const searchText = document.getElementById('searchInput').value.toLowerCase();

  let filtered = gamesList.filter(g => {
    let matchCat = (activeCategory === 'ALL' || g.cat === activeCategory);
    let matchSearch = g.name.toLowerCase().includes(searchText) || g.tag.toLowerCase().includes(searchText);
    return matchCat && matchSearch;
  });

  container.innerHTML = filtered.map(g => {
    return `<a href="games/${g.file}" class="game-card" onclick="playSound()">
      <div>
        <div class="card-icon">${g.icon}</div>
        <div class="card-name">${g.name}</div>
        <div class="card-tag">${g.tag}</div>
      </div>
      <button class="btn-play">PLAY NOW 🎮</button>
    </a>`;
  }).join('');
}

function setCategory(cat, el) {
  playSound();
  activeCategory = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderGames();
}

function filterGames() {
  renderGames();
}

// INITIALIZE
syncBalance();
renderGames();
</script>
</body>
</html>
