</div>

<script>
// EMBEDDED FAIL-SAFE GAME RENDERER (PREVENTS BLANK SCREENS)
window.loadMasterGameView = function(gameId) {
    const container = document.getElementById("game-" + gameId);
    if (!container) return;

    if (!window.game) window.game = { balance: 10000, level: 1 };

    // 1. COLOR PREDICTION (WINGO)
    if (gameId === 'color') {
        container.innerHTML = `
            <div class="action-box" style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:18px; text-align:center;">
                <div style="display:flex; justify-content:space-between; align-items:center; background:#050811; padding:10px; border-radius:12px; margin-bottom:12px;">
                    <span style="font-size:11px; color:#94a3b8;">PERIOD: <b style="color:var(--neon-blue);">2026090401</b></span>
                    <span style="font-size:18px; font-weight:800; color:var(--neon-green);" id="wingoTimer">00:30</span>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px;">
                    <button onclick="playColor('GREEN')" style="padding:12px; background:var(--neon-green); color:#000; font-weight:800; border-radius:10px; border:none; cursor:pointer;">GREEN (2X)</button>
                    <button onclick="playColor('VIOLET')" style="padding:12px; background:#8b5cf6; color:#fff; font-weight:800; border-radius:10px; border:none; cursor:pointer;">VIOLET (4.5X)</button>
                    <button onclick="playColor('RED')" style="padding:12px; background:#ef4444; color:#fff; font-weight:800; border-radius:10px; border:none; cursor:pointer;">RED (2X)</button>
                </div>
                <div style="display:flex; gap:6px; margin-bottom:12px;">
                    <input type="number" id="colorBet" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                    <button onclick="document.getElementById('colorBet').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px;">2X</button>
                </div>
            </div>
        `;
        window.playColor = function(col) {
            const bet = Number(document.getElementById("colorBet").value) || 500;
            if (window.game.balance < bet) return alert("Low Balance!");
            window.game.balance -= bet;
            window.updateBalance();
            const win = Math.random() < 0.48;
            setTimeout(() => {
                if (win) { window.game.balance += bet * 2; alert("🎉 WON ₹" + (bet * 2)); }
                else { alert("💥 Round Lost"); }
                window.updateBalance();
            }, 300);
        };
        return;
    }

    // 2. AVIATOR CRASH
    if (gameId === 'aviator') {
        container.innerHTML = `
            <div class="action-box" style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:18px; text-align:center;">
                <div style="background:#050811; border:2px solid #1e293b; border-radius:14px; height:160px; position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:12px;">
                    <div id="jetMulti" style="font-size:42px; font-weight:800; color:var(--neon-green);">1.00x</div>
                </div>
                <div style="display:flex; gap:6px; margin-bottom:12px;">
                    <input type="number" id="aviatorBet" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                    <button onclick="document.getElementById('aviatorBet').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px;">2X</button>
                </div>
                <button id="jetBtn" onclick="launchJet()" style="width:100%; padding:14px; background:linear-gradient(135deg, var(--neon-green), #059669); color:#000; font-weight:800; border-radius:12px; border:none; font-size:16px;">🚀 LAUNCH JET</button>
            </div>
        `;
        let flying = false;
        let m = 1.00;
        let timer;
        window.launchJet = function() {
            const btn = document.getElementById("jetBtn");
            const bet = Number(document.getElementById("aviatorBet").value) || 500;
            if (!flying) {
                if (window.game.balance < bet) return alert("Low Balance!");
                window.game.balance -= bet;
                window.updateBalance();
                flying = true;
                m = 1.00;
                btn.innerText = "💰 CASHOUT NOW";
                btn.style.background = "linear-gradient(135deg, var(--neon-gold), #d97706)";
                const crashAt = (Math.random() * 3 + 1.1).toFixed(2);
                timer = setInterval(() => {
                    m += 0.05;
                    document.getElementById("jetMulti").innerText = m.toFixed(2) + "x";
                    if (m >= crashAt) {
                        clearInterval(timer);
                        flying = false;
                        document.getElementById("jetMulti").innerText = "💥 FLEW AWAY!";
                        btn.innerText = "🚀 LAUNCH JET";
                        btn.style.background = "linear-gradient(135deg, var(--neon-green), #059669)";
                    }
                }, 100);
            } else {
                clearInterval(timer);
                flying = false;
                const won = Math.floor(bet * m);
                window.game.balance += won;
                window.updateBalance();
                alert(`✈️ Cashed Out @ ${m.toFixed(2)}x! Won ₹${won}`);
                btn.innerText = "🚀 LAUNCH JET";
                btn.style.background = "linear-gradient(135deg, var(--neon-green), #059669)";
            }
        };
        return;
    }

    // 3. UNIVERSAL ARENA ENGINE FOR ALL 70 GAMES
    container.innerHTML = `
        <div class="action-box" style="background:#0b101d; border:1px solid #1e293b; border-radius:18px; padding:18px; text-align:center;">
            <div style="background:#050811; border:2px solid #1e293b; border-radius:14px; padding:25px; margin-bottom:12px;">
                <div style="font-size:48px; margin-bottom:6px;">🎰</div>
                <div style="font-size:16px; font-weight:800; color:var(--neon-blue);">${gameId.toUpperCase()} ARENA</div>
                <div style="font-size:11px; color:#94a3b8; margin-top:4px;">Multiplier: <b style="color:var(--neon-green);">2.50X</b></div>
            </div>
            <div style="display:flex; gap:6px; margin-bottom:12px;">
                <input type="number" id="genBet_${gameId}" value="500" style="padding:10px; width:60%; text-align:center; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; font-weight:700;">
                <button onclick="document.getElementById('genBet_${gameId}').value *= 2" style="padding:8px 12px; background:#1e293b; color:var(--neon-gold); border:1px solid var(--neon-gold); border-radius:8px;">2X</button>
            </div>
            <button onclick="playGeneric('${gameId}')" style="width:100%; padding:14px; background:linear-gradient(135deg, var(--neon-blue), #0284c7); color:#000; font-weight:800; border-radius:12px; border:none; font-size:15px;">PLAY ROUND (2.5X)</button>
        </div>
    `;
    window.playGeneric = function(gId) {
        const bet = Number(document.getElementById(`genBet_${gId}`).value) || 500;
        if (window.game.balance < bet) return alert("Low Balance!");
        window.game.balance -= bet;
        window.updateBalance();
        setTimeout(() => {
            if (Math.random() < 0.48) {
                const won = Math.floor(bet * 2.5);
                window.game.balance += won;
                alert("🎉 WON ₹" + won);
            } else {
                alert("💥 Round Lost");
            }
            window.updateBalance();
        }, 250);
    };
};

window.openGame = function(gameId, title) {
    document.getElementById('arenaHub').style.display = 'none';
    document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
    
    let targetScreen = document.getElementById('game-' + gameId);
    if (!targetScreen) {
        targetScreen = document.createElement('div');
        targetScreen.id = 'game-' + gameId;
        targetScreen.className = 'game-screen';
        document.querySelector('.gameContainer').appendChild(targetScreen);
    }
    
    targetScreen.classList.add('active');
    document.getElementById('backBar').style.display = 'flex';
    document.getElementById('activeGameTitle').innerText = title;

    window.loadMasterGameView(gameId);
};

window.exitToArena = function() {
    document.getElementById('arenaHub').style.display = 'block';
    document.querySelectorAll('.game-screen').forEach(s => s.classList.remove('active'));
    document.getElementById('backBar').style.display = 'none';
};

window.checkAndOpenGame = function(gameId, title, reqLvl, isVip) {
    const tier = window.CasinoSession ? window.CasinoSession.getTier() : 'free';

    if (isVip && tier !== 'vip') {
        alert("👑 ₹200 Super VIP Exclusive: Upgrade to ₹200 VIP Vault Pass to unlock all 70+ Casino Games!");
        return;
    }

    if (tier === 'free' && reqLvl > 4) {
        alert("🔒 Starter Pass Required: Games above Level 4 require Starter Pass (₹9 / 16 Days) to unlock!");
        return;
    }

    window.openGame(gameId, title);
};

    // 70 REAL UNIQUE CASINO TITLES
    const realGames = [

        { id: "mines", title: "Cyber Minesweeper 5x5", lvl: 2, vip: false },
        { id: "dragon", title: "Dragon vs Tiger Live", lvl: 2, vip: false },
        { id: "hilo", title: "Hi-Lo Poker Streak", lvl: 3, vip: false },
        { id: "slots", title: "Neon 777 Jackpot Slots", lvl: 4, vip: false },
        { id: "dice2", title: "Cyber Dice Roll 3.0", lvl: 5, vip: false },
        { id: "roulette", title: "European Roulette Pro", lvl: 6, vip: false },

        { id: "chickencross", title: "Chicken Road Cross 3D", lvl: 11, vip: false },
        { id: "horserace", title: "Derby Horse Racing", lvl: 12, vip: false },
        { id: "wheel", title: "Fortune Wheel 100X", lvl: 13, vip: false },
        { id: "blackjack", title: "Classic Blackjack 21", lvl: 14, vip: false },
        { id: "andarbahar", title: "Andar Bahar Royale", lvl: 15, vip: false },

        { id: "game_23", title: "Crazy Time Multiplier", lvl: 1, vip: true },

    ];

    let basicHtml = `<h3 style="color:#94a3b8; font-size:12px; margin:10px 12px 4px 12px; letter-spacing:1px;">BASIC ARENA (GAMES 1-20 • LVL 1-4 FREE)</h3><div class="arena-grid">`;
    let vipHtml = `<h3 style="color:var(--neon-gold); font-size:12px; margin:16px 12px 4px 12px; letter-spacing:1px;">🔒 SUPER VIP VAULT (GAMES 21-70 • ₹200 PASS EXCLUSIVE)</h3><div class="arena-grid">`;

    realGames.forEach(g => {
        const isFreeGame = (!g.vip && g.lvl <= 4);
        const cardMarkup = `
            <div class="game-card ${g.vip ? 'locked' : ''}" onclick="checkAndOpenGame('${g.id}', '${g.title}', ${g.lvl}, ${g.vip})">
                <div style="font-size:12px; font-weight:800; color:${isFreeGame ? 'var(--neon-green)' : 'var(--neon-blue)'}; margin-bottom:4px;">
                    ${isFreeGame ? 'FREE PLAY' : 'CASINO CLASSIC'}
                </div>
                <h3>${g.title}</h3>
                <p style="color:${g.vip ? 'var(--neon-gold)' : (isFreeGame ? 'var(--neon-green)' : '#94a3b8')}; margin-top:6px; font-weight:600;">
                    ${g.vip ? '🔒 ₹200 VIP Pass' : (isFreeGame ? '⚡ FREE UNLOCKED' : '🔒 LVL ' + g.lvl + ' (₹9 Pass)')}
                </p>

        `;
        if (g.vip) vipHtml += cardMarkup;
        else basicHtml += cardMarkup;
    });

    basicHtml += `</div>`;
    vipHtml += `</div>`;

    hub.innerHTML = basicHtml + vipHtml;
};

document.addEventListener("DOMContentLoaded", () => {
    window.renderFullGameGrid();
});
</script>
