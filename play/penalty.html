<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penalty Shootout - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; }

.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.goal-arena { position: relative; width: 100%; height: 260px; background: radial-gradient(circle, #064e3b 0%, #02040a 100%); border: 3px solid var(--neon-green); border-radius: 20px; margin: 12px 0; overflow: hidden; box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }

.goal-post { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 85%; height: 160px; border: 6px solid #fff; border-bottom: none; border-radius: 8px 8px 0 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px), repeating-linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 10px, transparent 10px, transparent 20px); }

.keeper { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-size: 42px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5; }

.ball { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 28px; transition: all 0.4s ease-out; z-index: 10; }

.target-grid { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 85%; height: 160px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; padding: 6px; z-index: 15; }

.target-zone { border: 1.5px dashed rgba(255,255,255,0.25); border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background 0.2s, border-color 0.2s; }
.target-zone.selected { border-color: var(--neon-gold); background: rgba(245, 158, 11, 0.25); }

.controls-card { background: #04060d; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: center; }
.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.kick-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, var(--neon-green), #047857); color: #fff; text-transform: uppercase; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="goal-arena">
    <div class="goal-post"></div>
    <div class="keeper" id="keeper">🧤</div>
    <div class="ball" id="ball">⚽</div>

    <div class="target-grid">
      <div class="target-zone selected" onclick="selectZone(0, this)">🎯</div>
      <div class="target-zone" onclick="selectZone(1, this)">🎯</div>
      <div class="target-zone" onclick="selectZone(2, this)">🎯</div>
      <div class="target-zone" onclick="selectZone(3, this)">🎯</div>
      <div class="target-zone" onclick="selectZone(4, this)">🎯</div>
      <div class="target-zone" onclick="selectZone(5, this)">🎯</div>
    </div>
  </div>

  <div class="controls-card">
    <div style="font-size:11px; color:#94a3b8; margin-bottom:8px;">SELECT TARGET ZONE & BET (1.95X WIN)</div>
    <div class="chip-row">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>

    <button class="kick-btn" id="kickBtn" onclick="shootPenalty()">SHOOT PENALTY ⚽</button>
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'kick') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
      gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  } catch(e) {}
}

let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let selectedZone = 0;
let isShooting = false;

const zoneCoords = [
  { left: '15%', top: '30px' }, // Top-Left
  { left: '50%', top: '30px' }, // Top-Center
  { left: '85%', top: '30px' }, // Top-Right
  { left: '15%', top: '100px' }, // Bottom-Left
  { left: '50%', top: '100px' }, // Bottom-Center
  { left: '85%', top: '100px' }  // Bottom-Right
];

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  if (isShooting) return;
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function selectZone(idx, el) {
  if (isShooting) return;
  selectedZone = idx;
  document.querySelectorAll('.target-zone').forEach(z => z.classList.remove('selected'));
  el.classList.add('selected');
}

function shootPenalty() {
  if (isShooting) return;
  if (bal < chip) return alert("Low balance!");

  bal -= chip;
  sync();
  isShooting = true;

  const btn = document.getElementById('kickBtn');
  btn.innerText = "SHOOTING...";
  btn.disabled = true;

  playSound('kick');

  let keeperZone = Math.floor(Math.random() * 6);

  const ball = document.getElementById('ball');
  const keeper = document.getElementById('keeper');

  let targetPos = zoneCoords[selectedZone];
  let keeperPos = zoneCoords[keeperZone];

  ball.style.left = targetPos.left;
  ball.style.bottom = (260 - parseInt(targetPos.top) - 30) + 'px';
  ball.style.transform = 'translateX(-50%) scale(0.7)';

  keeper.style.left = keeperPos.left;
  keeper.style.bottom = (260 - parseInt(keeperPos.top) - 40) + 'px';

  setTimeout(() => {
    let goalScored = (selectedZone !== keeperZone);
    let winAmt = Math.floor(chip * 1.95);

    if (goalScored) {
      bal += winAmt;
      sync();
      playSound('win');
      alert(`⚽ GOOOOOAL!\nYou Won ₹${winAmt}!`);
    } else {
      alert(`🧤 SAVED BY THE KEEPER!\nBetter luck next penalty!`);
    }

    // Reset positions
    ball.style.left = '50%';
    ball.style.bottom = '15px';
    ball.style.transform = 'translateX(-50%) scale(1)';

    keeper.style.left = '50%';
    keeper.style.bottom = '0px';

    isShooting = false;
    btn.innerText = "SHOOT PENALTY ⚽";
    btn.disabled = false;
  }, 600);
}

sync();
</script>
</body>
</html>
