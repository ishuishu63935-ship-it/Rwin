<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chicken Road Cross - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; }

.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.road-arena { background: #02040a; border: 2px solid var(--border-color); border-radius: 18px; padding: 14px; margin: 12px 0; display: flex; flex-direction: column-reverse; gap: 8px; }

.step-lane { height: 42px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 12px; font-weight: 800; transition: all 0.2s; }
.step-lane.active { border-color: var(--neon-gold); background: rgba(245, 158, 11, 0.15); box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
.step-lane.passed { border-color: var(--neon-green); background: rgba(16, 185, 129, 0.15); }
.step-lane.crashed { border-color: var(--neon-red); background: rgba(239, 68, 68, 0.2); }

.controls-card { background: #04060d; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: center; }
.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.main-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; }
.btn-start { background: linear-gradient(135deg, var(--neon-gold), #d97706); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
.btn-step { background: linear-gradient(135deg, var(--neon-blue), #0284c7); color: #000; margin-bottom: 8px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
.btn-cashout { background: linear-gradient(135deg, var(--neon-green), #047857); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="road-arena" id="roadGrid"></div>

  <div class="controls-card">
    <div class="chip-row" id="chipRow">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>

    <div id="gameActions">
      <button class="main-btn btn-start" onclick="startGame()">START CROSSING 🐔</button>
    </div>
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'step') {
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'crash') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e) {}
}

let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let currentStep = 0;
let gameState = 'IDLE';

const multipliers = [1.2, 1.5, 2.0, 3.0, 5.0];

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  if (gameState !== 'IDLE') return;
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function renderRoad() {
  const container = document.getElementById('roadGrid');
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    let lane = document.createElement('div');
    lane.className = `step-lane ${i === currentStep && gameState === 'PLAYING' ? 'active' : ''} ${i < currentStep ? 'passed' : ''}`;
    lane.id = `lane-${i}`;
    lane.innerHTML = `
      <span>STEP ${i + 1} (${multipliers[i]}X)</span>
      <span>${i < currentStep ? '🐔 SAFE' : (i === currentStep && gameState === 'PLAYING' ? '❓ NEXT' : '🚘 RISK')}</span>
    `;
    container.appendChild(lane);
  }
}

function startGame() {
  if (bal < chip) return alert("Low balance!");
  bal -= chip;
  sync();

  gameState = 'PLAYING';
  currentStep = 0;
  renderRoad();

  updateButtons();
}

function updateButtons() {
  const actions = document.getElementById('gameActions');
  let currentMulti = multipliers[currentStep];
  let winEst = Math.floor(chip * currentMulti);

  actions.innerHTML = `
    <button class="main-btn btn-step" onclick="takeStep()">CROSS LANE 🐔 STEP ${currentStep + 1}</button>
    <button class="main-btn btn-cashout" onclick="cashout()">CASHOUT ₹${winEst} (${currentMulti}X)</button>
  `;
}

function takeStep() {
  if (gameState !== 'PLAYING') return;

  let safeChance = 0.8 - (currentStep * 0.1);
  let isSafe = Math.random() < safeChance;

  if (isSafe) {
    playSound('step');
    currentStep++;
    renderRoad();

    if (currentStep >= 5) {
      let winAmt = Math.floor(chip * multipliers[4]);
      bal += winAmt;
      sync();
      playSound('win');
      alert(`🏆 PERFECT ROAD CROSSING!\nYou Won ₹${winAmt}!`);
      resetGame();
    } else {
      updateButtons();
    }
  } else {
    playSound('crash');
    document.getElementById(`lane-${currentStep}`).classList.add('crashed');
    document.getElementById(`lane-${currentStep}`).lastElementChild.innerText = '💥 CRASH!';
    alert("💥 OH NO! Chicken was hit by a car.");
    resetGame();
  }
}

function cashout() {
  if (gameState !== 'PLAYING' || currentStep === 0) return alert("Take at least 1 step!");
  let winAmt = Math.floor(chip * multipliers[currentStep - 1]);
  bal += winAmt;
  sync();
  playSound('win');
  alert(`🎉 CASHOUT SUCCESSFUL!\nYou Won ₹${winAmt}!`);
  resetGame();
}

function resetGame() {
  gameState = 'IDLE';
  currentStep = 0;
  document.getElementById('gameActions').innerHTML = `<button class="main-btn btn-start" onclick="startGame()">START CROSSING 🐔</button>`;
  renderRoad();
}

renderRoad();
sync();
</script>
</body>
</html>
