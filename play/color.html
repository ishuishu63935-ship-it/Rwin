
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WinGo 30s Color Trading - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; }
.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.timer-card { background: radial-gradient(circle, #1e1b4b, #04060d); border: 2px solid var(--neon-gold); border-radius: 16px; padding: 16px; text-align: center; margin: 12px 0; }
.timer-num { font-size: 38px; font-weight: 900; color: var(--neon-gold); letter-spacing: 2px; margin: 6px 0; }

.btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.color-btn { padding: 14px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; color: #fff; font-size: 13px; text-transform: uppercase; }
.btn-green { background: linear-gradient(135deg, #10b981, #047857); }
.btn-violet { background: linear-gradient(135deg, #a855f7, #6b21a8); }
.btn-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }

.num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.num-btn { padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; font-weight: 800; color: #fff; cursor: pointer; text-align: center; }

.controls { background: #04060d; border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; }
.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
.chip { padding: 6px 12px; background: #1e293b; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
.modal-box { background: var(--card-bg); border: 2px solid var(--neon-gold); border-radius: 18px; padding: 20px; text-align: center; width: 80%; max-width: 300px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="timer-card">
    <div style="font-size:11px; color:#94a3b8;">WINGO 30s COLOR DRAW</div>
    <div class="timer-num" id="timerTxt">00:30</div>
    <div style="font-size:10px; color:var(--neon-blue);" id="periodTxt">PERIOD: 2026091001</div>
  </div>

  <div class="btn-grid">
    <button class="color-btn btn-green" onclick="betColor('GREEN')">GREEN (2X)</button>
    <button class="color-btn btn-violet" onclick="betColor('VIOLET')">VIOLET (4.5X)</button>
    <button class="color-btn btn-red" onclick="betColor('RED')">RED (2X)</button>
  </div>

  <div class="num-grid">
    <div class="num-btn" onclick="betNum(0)">0</div>
    <div class="num-btn" onclick="betNum(1)">1</div>
    <div class="num-btn" onclick="betNum(2)">2</div>
    <div class="num-btn" onclick="betNum(3)">3</div>
    <div class="num-btn" onclick="betNum(4)">4</div>
    <div class="num-btn" onclick="betNum(5)">5</div>
    <div class="num-btn" onclick="betNum(6)">6</div>
    <div class="num-btn" onclick="betNum(7)">7</div>
    <div class="num-btn" onclick="betNum(8)">8</div>
    <div class="num-btn" onclick="betNum(9)">9</div>
  </div>

  <div class="controls">
    <div class="chip-row">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>
    <div style="font-size:11px; color:#94a3b8;">ACTIVE BET: <b id="activeBetTxt" style="color:var(--neon-gold);">NONE</b></div>
  </div>
</div>

<div class="modal" id="resModal">
  <div class="modal-box">
    <h3 id="resTitle" style="margin:0; color:#fff;">DRAW RESULT</h3>
    <p id="resMsg" style="font-size:12px; color:#94a3b8; margin:10px 0;"></p>
    <button onclick="document.getElementById('resModal').style.display='none'" style="padding:8px 16px; background:var(--neon-gold); border:none; font-weight:800; border-radius:8px; cursor:pointer;">OK</button>
  </div>
</div>

<script>
let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let currentBet = null;
let timer = 30;

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function betColor(col) {
  if (timer <= 5) return alert("Betting locked for draw!");
  if (bal < chip) return alert("Low balance!");
  bal -= chip;
  currentBet = { type: 'COLOR', val: col, amt: chip };
  document.getElementById('activeBetTxt').innerText = col + " (₹" + chip + ")";
  sync();
}

function betNum(n) {
  if (timer <= 5) return alert("Betting locked for draw!");
  if (bal < chip) return alert("Low balance!");
  bal -= chip;
  currentBet = { type: 'NUM', val: n, amt: chip };
  document.getElementById('activeBetTxt').innerText = "NUM " + n + " (₹" + chip + ")";
  sync();
}

setInterval(() => {
  timer--;
  document.getElementById('timerTxt').innerText = "00:" + (timer < 10 ? "0" + timer : timer);
  if (timer === 0) {
    let num = Math.floor(Math.random() * 10);
    let col = (num === 0 || num === 5) ? 'VIOLET' : (num % 2 === 0 ? 'RED' : 'GREEN');
    
    let won = false;
    let winAmt = 0;
    if (currentBet) {
      if (currentBet.type === 'COLOR' && currentBet.val === col) { won = true; winAmt = currentBet.amt * 2; }
      if (currentBet.type === 'NUM' && currentBet.val === num) { won = true; winAmt = currentBet.amt * 9; }
    }

    if (won) { bal += winAmt; sync(); }
    
    document.getElementById('resTitle').innerText = won ? "🎉 YOU WON!" : "💔 DRAW RESULT";
    document.getElementById('resMsg').innerText = `Winning Number: ${num} (${col})\n` + (won ? `Won ₹${winAmt}!` : 'Better luck next period!');
    document.getElementById('resModal').style.display = 'flex';

    currentBet = null;
    document.getElementById('activeBetTxt').innerText = "NONE";
    timer = 30;
  }
}, 1000);

sync();
</script>
</body>
</html>
