<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WinGo 30s - RWIN Elite</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background-color: #080b11; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
  .game-container { width: 100%; max-width: 480px; padding: 16px; background: #0d111a; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .hub-btn { background: #161f30; border: 1px solid #00e5ff; color: #00e5ff; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 13px; }
  .balance-badge { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 15px rgba(255,215,0,0.3); }

  .wallet-card { background: linear-gradient(135deg, #141a26, #1e293b); border: 1.5px solid rgba(210, 153, 34, 0.4); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
  .wallet-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .wallet-amount { font-size: 32px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.3); margin-bottom: 12px; }
  .reset-btn { background: #161f30; border: 1px solid rgba(255,215,0,0.4); color: #ffd700; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

  .game-arena { background: linear-gradient(135deg, #0d111a, #161b22); border: 1.5px solid rgba(0, 229, 255, 0.3); border-radius: 18px; padding: 16px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  .tab-header { display: flex; justify-content: space-between; background: #080b11; padding: 8px 12px; border-radius: 10px; margin-bottom: 16px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.05); }
  
  .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .wg-btn { padding: 16px 8px; color: #fff; font-weight: 800; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; transition: transform 0.1s; }
  .wg-btn:active { transform: scale(0.96); }
  .btn-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
  .btn-violet { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 4px 15px rgba(139,92,246,0.3); }
  .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 15px rgba(239,68,68,0.3); }

  .size-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .btn-big { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; padding: 16px; font-weight: 800; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
  .btn-small { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; padding: 16px; font-weight: 800; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }

  .timer-box { background: #080b11; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
  .timer-val { font-size: 20px; font-weight: 800; color: #00e5ff; }

  /* Modal Popup */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal-box { background: #161b22; border: 2px solid #00e5ff; border-radius: 20px; padding: 24px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 0 30px rgba(0,229,255,0.4); }
</style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <a href="../home.html" class="hub-btn">⬅ Hub</a>
    <div style="font-weight: 700; color: #00e5ff; font-size: 15px;">WinGo 30s Color Trading</div>
  </div>

  <div class="wallet-card">
    <div class="wallet-title">VIP Practice Wallet Balance</div>
    <div class="wallet-amount" id="balanceText">₹10,000</div>
    <button class="reset-btn" id="resetCoinsBtn">🔄 Reset ₹10,000</button>
  </div>

  <div class="game-arena">
    <div class="tab-header">
      <span style="color:#ffd700; border-bottom:2px solid #ffd700; padding-bottom:2px;">👑 WinGo 30s Elite</span>
      <span style="color:#94a3b8;">WinGo 1Min</span>
    </div>

    <div class="color-grid">
      <button class="wg-btn btn-green" onclick="playWinGo('GREEN', 2)">Green (2X)</button>
      <button class="wg-btn btn-violet" onclick="playWinGo('VIOLET', 4.5)">Violet (4.5X)</button>
      <button class="wg-btn btn-red" onclick="playWinGo('RED', 2)">Red (2X)</button>
    </div>

    <div class="size-grid">
      <button class="btn-big" onclick="playWinGo('BIG', 2)">⚡ Big 5-9 (2X)</button>
      <button class="btn-small" onclick="playWinGo('SMALL', 2)">💧 Small 0-4 (2X)</button>
    </div>

    <div class="timer-box">
      <span style="font-size: 12px; color: #94a3b8;">Round Time Remaining</span>
      <span class="timer-val" id="timerDisplay">00:29</span>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box">
    <div id="modalIcon" style="font-size: 42px; margin-bottom: 10px;">🎉</div>
    <h3 id="modalTitle" style="color: #fff; margin-bottom: 8px; font-size: 18px;">WIN!</h3>
    <p id="modalMsg" style="color: #94a3b8; font-size: 13px; margin-bottom: 20px; line-height: 1.5;"></p>
    <button onclick="closeModal()" style="background: linear-gradient(135deg, #00e5ff, #0088ff); color: #000; border: none; padding: 10px 24px; font-weight: 800; border-radius: 10px; width: 100%; cursor: pointer;">OKAY 🚀</button>
  </div>
</div>

<script>
  let gameBalance = parseInt(localStorage.getItem('rwin_balance') || '10000');
  function updateUI() {
    document.getElementById('balanceText').innerText = "₹" + gameBalance.toLocaleString();
    localStorage.setItem('rwin_balance', gameBalance);
  }
  updateUI();

  document.getElementById('resetCoinsBtn').addEventListener('click', () => {
    gameBalance = 10000;
    updateUI();
    showModal("🔄 BALANCE RESET", "VIP practice coins restored to ₹10,000!", "💰");
  });

  function playWinGo(sel, multi) {
    if (gameBalance < 100) return showModal("Low Balance", "Reset coins to play!", "⚠️");
    gameBalance -= 100;
    if (Math.random() < 0.5) {
      let won = Math.floor(100 * multi);
      gameBalance += won;
      showModal("WIN!", `Selected ${sel}! Won ₹${won} 🎉`, "🎨");
    } else {
      showModal("LOST", `Selected ${sel}! Better luck next round.`, "💥");
    }
    updateUI();
  }

  function showModal(title, msg, icon) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMsg').innerText = msg;
    document.getElementById('modalIcon').innerText = icon;
    document.getElementById('customModal').style.display = 'flex';
  }
  function closeModal() {
    document.getElementById('customModal').style.display = 'none';
  }
</script>
</body>
</html>
