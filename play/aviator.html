<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aviator Elite - RWIN</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background-color: #080b11; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
  .game-container { width: 100%; max-width: 480px; padding: 16px; background: #0d111a; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .hub-btn { background: #161f30; border: 1px solid #00e5ff; color: #00e5ff; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 13px; }

  .wallet-card { background: linear-gradient(135deg, #141a26, #1e293b); border: 1.5px solid rgba(210, 153, 34, 0.4); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
  .wallet-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .wallet-amount { font-size: 32px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.3); margin-bottom: 12px; }
  .reset-btn { background: #161f30; border: 1px solid rgba(255,215,0,0.4); color: #ffd700; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

  .game-arena { background: linear-gradient(135deg, #0d111a, #161b22); border: 1.5px solid rgba(0, 229, 255, 0.4); border-radius: 18px; padding: 16px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  
  .radar-box { background: radial-gradient(circle, #111827 0%, #030712 100%); border: 1px solid rgba(0,229,255,0.3); border-radius: 14px; padding: 40px 10px; margin-bottom: 16px; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,229,255,0.1); }
  .radar-tag { position: absolute; top: 10px; left: 14px; font-size: 10px; color: #00e5ff; font-weight: 700; letter-spacing: 1.5px; }
  .jet-multi { font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 25px rgba(0,229,255,0.6); margin-top: 10px; }
  .jet-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; font-weight: 600; letter-spacing: 1px; }

  .action-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: 800; font-size: 15px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(16,185,129,0.4); transition: transform 0.1s; }
  .action-btn:active { transform: scale(0.98); }

  /* Modal Popup */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal-box { background: #161b22; border: 2px solid #10b981; border-radius: 20px; padding: 24px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 0 30px rgba(16,185,129,0.4); }
</style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <a href="../home.html" class="hub-btn">⬅ Hub</a>
    <div style="font-weight: 700; color: #00e5ff; font-size: 15px;">Aviator Elite Radar</div>
  </div>

  <div class="wallet-card">
    <div class="wallet-title">VIP Practice Wallet Balance</div>
    <div class="wallet-amount" id="balanceText">₹10,000</div>
    <button class="reset-btn" id="resetCoinsBtn">🔄 Reset ₹10,000</button>
  </div>

  <div class="game-arena">
    <div class="radar-box">
      <div class="radar-tag">✈️ RWIN RADAR v2.4</div>
      <div class="jet-multi" id="jetMulti">1.00x</div>
      <div class="jet-sub" id="radarStatus">READY FOR TAKEOFF</div>
    </div>

    <button class="action-btn" id="jetBtn" onclick="handleJetAction()">BET ₹100 & LAUNCH 🚀</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box">
    <div id="modalIcon" style="font-size: 42px; margin-bottom: 10px;">✈️</div>
    <h3 id="modalTitle" style="color: #fff; margin-bottom: 8px; font-size: 18px;">CASHED OUT!</h3>
    <p id="modalMsg" style="color: #94a3b8; font-size: 13px; margin-bottom: 20px; line-height: 1.5;"></p>
    <button onclick="closeModal()" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 10px 24px; font-weight: 800; border-radius: 10px; width: 100%; cursor: pointer;">OKAY 🚀</button>
  </div>
</div>

<script>
  let gameBalance = parseInt(localStorage.getItem('rwin_balance') || '10000');
  let flying = false, m = 1.00, timer = null, crashAt = 1.50;

  function updateUI() {
    document.getElementById('balanceText').innerText = "₹" + gameBalance.toLocaleString();
    localStorage.setItem('rwin_balance', gameBalance);
  }
  updateUI();

  document.getElementById('resetCoinsBtn').addEventListener('click', () => {
    gameBalance = 10000;
    updateUI();
    showModal("🔄 BALANCE RESET", "VIP practice coins restored to ₹10,000!", "💰");
  });

  function handleJetAction() {
    let btn = document.getElementById("jetBtn");
    let multiEl = document.getElementById("jetMulti");
    let statusEl = document.getElementById("radarStatus");

    if (!flying) {
      if (gameBalance < 100) return showModal("Low Balance", "Reset coins to play!", "⚠️");
      gameBalance -= 100;
      updateUI();

      flying = true;
      m = 1.00;
      crashAt = (Math.random() * 3 + 1.2).toFixed(2);
      
      btn.innerText = "CASHOUT 💰";
      btn.style.background = "linear-gradient(135deg, #f59e0b, #d97706)";
      statusEl.innerText = "FLIGHT IN PROGRESS...";

      timer = setInterval(() => {
        m += 0.05;
        multiEl.innerText = m.toFixed(2) + "x";

        if (m >= crashAt) {
          clearInterval(timer);
          flying = false;
          multiEl.innerText = "FLEW AWAY!";
          statusEl.innerText = "CRASHED";
          btn.innerText = "BET ₹100 & LAUNCH 🚀";
          btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
          showModal("FLEW AWAY", `Plane crashed @ ${parseFloat(crashAt).toFixed(2)}x. You lost ₹100.`, "💥");
        }
      }, 100);

    } else {
      clearInterval(timer);
      flying = false;
      let won = Math.floor(100 * m);
      gameBalance += won;
      updateUI();

      multiEl.innerText = m.toFixed(2) + "x";
      statusEl.innerText = "SUCCESSFUL CASHOUT";
      btn.innerText = "BET ₹100 & LAUNCH 🚀";
      btn.style.background = "linear-gradient(135deg, #10b981, #059669)";
      showModal("CASHED OUT!", `Successfully cashed out @ ${m.toFixed(2)}x!\nWon ₹${won} 🎉`, "✈️");
    }
  }

  function showModal(title, msg, icon) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMsg').innerText = msg;
    document.getElementById('modalIcon').innerText = icon;
    document.getElementById('customModal').style.display = 'flex';
  }
  function closeModal() {
    document.getElementById('customModal').style.display = 'none';
  }
</script>
</body>
</html>
