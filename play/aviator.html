
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aviator Pro - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-red: #ef4444;
  --neon-green: #10b981;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; }

.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.screen { position: relative; width: 100%; height: 260px; background: radial-gradient(circle at bottom left, #1e1b4b, #02040a); border: 2px solid var(--border-color); border-radius: 20px; margin: 12px 0; overflow: hidden; }
#aviatorCanvas { width: 100%; height: 100%; display: block; }

.multi-display { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
.status-tag { position: absolute; top: 62%; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 800; text-transform: uppercase; color: #94a3b8; }

.controls-card { background: #04060d; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: center; }
.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.action-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
.btn-bet { background: linear-gradient(135deg, var(--neon-green), #047857); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
.btn-cashout { background: linear-gradient(135deg, var(--neon-gold), #d97706); color: #000; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); animation: pulse 0.8s infinite alternate; }

@keyframes pulse {
  0% { transform: scale(1); }
  100% { transform: scale(1.02); }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="screen">
    <canvas id="aviatorCanvas" width="400" height="260"></canvas>
    <div class="multi-display" id="multiTxt">1.00x</div>
    <div class="status-tag" id="statusTxt">READY TO FLY</div>
  </div>

  <div class="controls-card">
    <div class="chip-row" id="chipRow">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>

    <button class="action-btn btn-bet" id="mainBtn" onclick="handleAction()">BET (START)</button>
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'fly') {
      osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(500, now + 0.1);
      gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'crash') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
      gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  } catch(e) {}
}

let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let gameState = 'IDLE'; // IDLE, FLYING
let currentMulti = 1.00;
let crashMulti = 1.00;
let animTimer = null;
let progress = 0;

const canvas = document.getElementById('aviatorCanvas');
const ctx = canvas.getContext('2d');

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  if (gameState !== 'IDLE') return;
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

  if (gameState === 'FLYING') {
    let px = (progress / 100) * (canvas.width - 60);
    let py = canvas.height - ((progress / 100) * (canvas.height - 60)) - 20;

    // Flight Curve
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    ctx.quadraticCurveTo(px / 2, canvas.height, px, py);
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Plane Emoji
    ctx.font = "28px sans-serif";
    ctx.fillText("🚀", px - 10, py + 10);
  }
}

function handleAction() {
  if (gameState === 'IDLE') {
    if (bal < chip) return alert("Low balance!");

    bal -= chip;
    sync();

    gameState = 'FLYING';
    currentMulti = 1.00;
    progress = 0;

    // Generate random crash multiplier (1.10x to 8.50x)
    crashMulti = parseFloat((1.1 + Math.random() * 7.4).toFixed(2));

    const btn = document.getElementById('mainBtn');
    btn.className = "action-btn btn-cashout";
    btn.innerText = `CASHOUT ₹${chip} (1.00x)`;

    document.getElementById('statusTxt').innerText = "FLYING HIGH...";
    document.getElementById('statusTxt').style.color = "var(--neon-blue)";

    startFlight();
  } else if (gameState === 'FLYING') {
    // CASHOUT SUCCESS
    clearInterval(animTimer);
    let winAmt = Math.floor(chip * currentMulti);
    bal += winAmt;
    sync();

    playSound('win');
    alert(`🎉 CASHOUT SUCCESSFUL!\nMultiplier: ${currentMulti.toFixed(2)}x\nYou Won ₹${winAmt}!`);

    resetGame();
  }
}

function startFlight() {
  animTimer = setInterval(() => {
    currentMulti += 0.03;
    progress = Math.min(progress + 0.8, 90);
    playSound('fly');

    document.getElementById('multiTxt').innerText = currentMulti.toFixed(2) + "x";

    if (gameState === 'FLYING') {
      let winEst = Math.floor(chip * currentMulti);
      document.getElementById('mainBtn').innerText = `CASHOUT ₹${winEst} (${currentMulti.toFixed(2)}x)`;
    }

    drawCanvas();

    if (currentMulti >= crashMulti) {
      clearInterval(animTimer);
      playSound('crash');

      document.getElementById('multiTxt').innerText = "💥 FLEW AWAY!";
      document.getElementById('multiTxt').style.color = "var(--neon-red)";
      document.getElementById('statusTxt').innerText = `CRASHED AT ${crashMulti.toFixed(2)}x`;
      document.getElementById('statusTxt').style.color = "var(--neon-red)";

      resetGame();
    }
  }, 90);
}

function resetGame() {
  gameState = 'IDLE';
  const btn = document.getElementById('mainBtn');
  btn.className = "action-btn btn-bet";
  btn.innerText = "BET (START)";

  setTimeout(() => {
    document.getElementById('multiTxt').style.color = "#fff";
    document.getElementById('multiTxt').innerText = "1.00x";
    document.getElementById('statusTxt').innerText = "READY TO FLY";
    document.getElementById('statusTxt').style.color = "#94a3b8";
    progress = 0;
    drawCanvas();
  }, 2000);
}

drawCanvas();
sync();
</script>
</body>
  </html>
