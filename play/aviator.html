<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aviator Pro - RWIN Royal Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: #06090f; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
  .game-container { width: 100%; max-width: 480px; padding: 12px; background: #0b0f19; min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 10px; }

  /* Top Header & Wallet */
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: #111726; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
  .hub-btn { background: #192236; border: 1px solid #00e5ff; color: #00e5ff; padding: 6px 12px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .wallet-pill { display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #161f33, #1e293b); border: 1px solid rgba(255, 215, 0, 0.45); padding: 5px 10px; border-radius: 10px; }
  .wallet-amount { font-size: 15px; font-weight: 800; color: #ffd700; }
  .reset-mini-btn { background: rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.4); color: #ffd700; padding: 3px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; }
  .sound-btn { background: #192236; border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 32px; height: 32px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* Multiplier History Strip */
  .history-bar { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
  .history-bar::-webkit-scrollbar { display: none; }
  .hist-pill { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
  .hist-low { background: rgba(56, 189, 248, 0.14); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); }
  .hist-mid { background: rgba(168, 85, 247, 0.18); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.45); }
  .hist-high { background: rgba(250, 204, 21, 0.18); color: #fde047; border: 1px solid rgba(250, 204, 21, 0.55); box-shadow: 0 0 10px rgba(250, 204, 21, 0.2); }

  /* Radar Flight Stage */
  .radar-stage { position: relative; width: 100%; height: 225px; background: radial-gradient(circle at 50% 80%, #131c31 0%, #060911 100%); border: 1.5px solid rgba(0, 229, 255, 0.3); border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8); }
  canvas#flightCanvas { width: 100%; height: 100%; display: block; }
  
  .radar-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2; }
  .live-badge { position: absolute; top: 10px; left: 12px; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.55); padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; color: #00e5ff; border: 1px solid rgba(0,229,255,0.25); }
  .live-dot { width: 7px; height: 7px; background: #10b981; border-radius: 50%; animation: pulseDot 1s infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

  .multi-display { font-size: 50px; font-weight: 900; color: #ffffff; text-shadow: 0 4px 25px rgba(0, 229, 255, 0.55); line-height: 1; letter-spacing: -1px; transition: color 0.2s; }
  .multi-crashed { color: #ef4444 !important; text-shadow: 0 0 25px rgba(239, 68, 68, 0.7) !important; font-size: 38px; }
  .status-label { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; color: #94a3b8; }
  .flew-banner { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; margin-bottom: 6px; display: none; }

  /* Countdown Bar */
  .wait-wrap { width: 65%; max-width: 240px; margin-top: 12px; display: none; }
  .wait-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; }
  .wait-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00e5ff, #10b981); transition: width 0.05s linear; }

  /* Floating Toast Container */
  .toast-stack { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; width: 92%; max-width: 420px; pointer-events: none; }
  .toast-msg { background: linear-gradient(135deg, #065f46, #047857); border: 1.5px solid #34d399; color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.6); animation: slideDown 0.25s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }

  /* Dual Bet Panels */
  .bet-panel { background: #121827; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 11px; display: flex; flex-direction: column; gap: 9px; }
  .panel-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 7px; }
  .panel-tag { font-size: 11px; font-weight: 800; color: #94a3b8; letter-spacing: 0.5px; }
  .auto-controls { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: #cbd5e1; }
  .toggle-label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .toggle-label input { accent-color: #10b981; width: 14px; height: 14px; }
  .auto-input { width: 52px; background: #090d16; border: 1px solid rgba(0,229,255,0.35); color: #00e5ff; border-radius: 6px; padding: 2px 5px; font-size: 11px; font-weight: 800; text-align: center; }

  .panel-body { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; align-items: stretch; }
  .amount-box { display: flex; flex-direction: column; gap: 6px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; background: #090d16; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 4px 6px; }
  .step-btn { width: 26px; height: 26px; border-radius: 7px; border: none; background: #1e293b; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
  .amt-input { width: 70px; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: 800; text-align: center; outline: none; }
  .preset-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .preset-btn { background: #1a2336; border: 1px solid rgba(255,255,255,0.07); color: #94a3b8; font-size: 10px; font-weight: 700; padding: 4px 0; border-radius: 6px; cursor: pointer; }
  .preset-btn:active { background: #26334d; color: #fff; }

  .bet-action-btn { border: none; border-radius: 12px; font-weight: 900; color: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 8px; transition: transform 0.08s; box-shadow: 0 5px 15px rgba(0,0,0,0.35); }
  .bet-action-btn:active { transform: scale(0.97); }
  .btn-bet { background: linear-gradient(135deg, #10b981, #059669); border: 1px solid #34d399; }
  .btn-cancel { background: linear-gradient(135deg, #ef4444, #b91c1c); border: 1px solid #f87171; }
  .btn-cashout { background: linear-gradient(135deg, #f59e0b, #d97706); border: 1px solid #fbbf24; box-shadow: 0 0 20px rgba(245, 158, 11, 0.45); }
  .btn-main-txt { font-size: 14px; letter-spacing: 0.5px; }
  .btn-sub-txt { font-size: 11px; opacity: 0.92; margin-top: 1px; }

  /* Live Players Lobby */
  .lobby-card { background: #111726; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 10px 12px; }
  .lobby-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; }
  .lobby-list { display: flex; flex-direction: column; gap: 5px; max-height: 175px; overflow-y: auto; }
  .player-row { display: grid; grid-template-columns: 1.4fr 0.8fr 0.7fr 1fr; align-items: center; background: #0b0f19; padding: 6px 9px; border-radius: 8px; font-size: 11px; border: 1px solid rgba(255,255,255,0.04); }
  .player-won { background: rgba(16, 185, 129, 0.14); border-color: rgba(16, 185, 129, 0.4); }
  .p-name { font-weight: 600; color: #e2e8f0; }
  .p-bet { color: #94a3b8; text-align: right; }
  .p-mult { text-align: center; font-weight: 800; color: #c084fc; }
  .p-win { text-align: right; font-weight: 800; color: #34d399; }

  /* Modal */
  .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.82); display: none; justify-content: center; align-items: center; z-index: 3000; }
  .modal-box { background: #141b2d; border: 1.5px solid #00e5ff; border-radius: 18px; padding: 22px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 0 30px rgba(0,229,255,0.3); }
</style>
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<div class="game-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <a href="../home.html" class="hub-btn">⬅ Hub</a>
    <div class="wallet-pill">
      <span class="wallet-amount" id="balanceText">₹10,000</span>
      <button class="reset-mini-btn" id="resetCoinsBtn">🔄 Reset</button>
    </div>
    <button class="sound-btn" id="soundToggleBtn" title="Toggle Sound">🔊</button>
  </div>

  <!-- Live Multiplier History -->
  <div class="history-bar" id="historyBar"></div>

  <!-- Radar Flight Canvas -->
  <div class="radar-stage">
    <canvas id="flightCanvas"></canvas>
    <div class="radar-hud">
      <div class="live-badge"><span class="live-dot"></span> LIVE CRASH RADAR</div>
      <div class="flew-banner" id="flewBanner">FLEW AWAY!</div>
      <div class="multi-display" id="multiDisplay">1.00x</div>
      <div class="status-label" id="statusLabel">PREPARING NEXT FLIGHT</div>
      <div class="wait-wrap" id="waitWrap">
        <div class="wait-bar-bg"><div class="wait-bar-fill" id="waitBarFill"></div></div>
      </div>
    </div>
  </div>

  <!-- Bet Panel 1 -->
  <div class="bet-panel" id="panel0">
    <div class="panel-top">
      <span class="panel-tag">BET 1</span>
      <div class="auto-controls">
        <label class="toggle-label"><input type="checkbox" id="autoBet0"> Auto Bet</label>
        <label class="toggle-label"><input type="checkbox" id="autoCash0"> Auto Cashout</label>
        <input type="number" step="0.1" min="1.1" value="2.00" class="auto-input" id="autoTarget0">
      </div>
    </div>
    <div class="panel-body">
      <div class="amount-box">
        <div class="stepper">
          <button class="step-btn" onclick="adjustBet(0, -100)">-</button>
          <input type="number" class="amt-input" id="betInput0" value="100" min="10">
          <button class="step-btn" onclick="adjustBet(0, 100)">+</button>
        </div>
        <div class="preset-row">
          <button class="preset-btn" onclick="setBet(0, 100)">₹100</button>
          <button class="preset-btn" onclick="setBet(0, 500)">₹500</button>
          <button class="preset-btn" onclick="setBet(0, 1000)">₹1K</button>
          <button class="preset-btn" onclick="setBet(0, 5000)">₹5K</button>
        </div>
      </div>
      <button class="bet-action-btn btn-bet" id="actionBtn0" onclick="handleSlotClick(0)">
        <span class="btn-main-txt">BET</span>
        <span class="btn-sub-txt" id="btnSub0">₹100</span>
      </button>
    </div>
  </div>

  <!-- Bet Panel 2 -->
  <div class="bet-panel" id="panel1">
    <div class="panel-top">
      <span class="panel-tag">BET 2</span>
      <div class="auto-controls">
        <label class="toggle-label"><input type="checkbox" id="autoBet1"> Auto Bet</label>
        <label class="toggle-label"><input type="checkbox" id="autoCash1"> Auto Cashout</label>
        <input type="number" step="0.1" min="1.1" value="5.00" class="auto-input" id="autoTarget1">
      </div>
    </div>
    <div class="panel-body">
      <div class="amount-box">
        <div class="stepper">
          <button class="step-btn" onclick="adjustBet(1, -100)">-</button>
          <input type="number" class="amt-input" id="betInput1" value="200" min="10">
          <button class="step-btn" onclick="adjustBet(1, 100)">+</button>
        </div>
        <div class="preset-row">
          <button class="preset-btn" onclick="setBet(1, 100)">₹100</button>
          <button class="preset-btn" onclick="setBet(1, 500)">₹500</button>
          <button class="preset-btn" onclick="setBet(1, 1000)">₹1K</button>
          <button class="preset-btn" onclick="setBet(1, 5000)">₹5K</button>
        </div>
      </div>
      <button class="bet-action-btn btn-bet" id="actionBtn1" onclick="handleSlotClick(1)">
        <span class="btn-main-txt">BET</span>
        <span class="btn-sub-txt" id="btnSub1">₹200</span>
      </button>
    </div>
  </div>

  <!-- Live Players Feed -->
  <div class="lobby-card">
    <div class="lobby-header">
      <span>👥 LIVE PLAYERS (<span id="playerCount">14</span>)</span>
      <span style="color:#10b981;">PRACTICE ARENA</span>
    </div>
    <div class="lobby-list" id="lobbyList"></div>
  </div>
</div>

<!-- Alert Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal-box">
    <div id="modalIcon" style="font-size: 38px; margin-bottom: 8px;">💰</div>
    <h3 id="modalTitle" style="color: #fff; margin-bottom: 6px; font-size: 17px;">BALANCE RESET</h3>
    <p id="modalMsg" style="color: #94a3b8; font-size: 12px; margin-bottom: 18px; line-height: 1.5;"></p>
    <button onclick="closeModal()" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; padding: 10px 20px; font-weight: 800; border-radius: 10px; width: 100%; cursor: pointer;">CONTINUE 🚀</button>
  </div>
</div>

<script>
  // --- Wallet & Storage ---
  let gameBalance = parseInt(localStorage.getItem('rwin_balance') || '10000');
  let soundEnabled = true;
  let audioCtx = null;

  function updateWalletUI() {
    document.getElementById('balanceText').innerText = "₹" + gameBalance.toLocaleString();
    localStorage.setItem('rwin_balance', gameBalance);
  }
  updateWalletUI();

  document.getElementById('resetCoinsBtn').addEventListener('click', () => {
    gameBalance = 10000;
    updateWalletUI();
    showModal("BALANCE RESTORED", "VIP practice wallet reset to ₹10,000!", "💰");
  });

  document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
    soundEnabled = !soundEnabled;
    e.target.innerText = soundEnabled ? "🔊" : "🔇";
  });

  // --- Synthesized Sound FX (Zero external files needed) ---
  function playTone(type) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'cashout') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.09);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.4);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'takeoff') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.25);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    } catch (e) {}
  }

  // --- History Strip ---
  let historyList = [2.45, 1.18, 8.90, 1.64, 3.12, 14.50, 1.05, 4.20];
  function renderHistory() {
    const bar = document.getElementById('historyBar');
    bar.innerHTML = historyList.map(val => {
      const cls = val >= 10 ? 'hist-high' : (val >= 2 ? 'hist-mid' : 'hist-low');
      return `<span class="hist-pill ${cls}">${val.toFixed(2)}x</span>`;
    }).join('');
  }
  renderHistory();

  // --- Dual Bet State ---
  const slots = [
    { status: 'IDLE', amount: 100 },
    { status: 'IDLE', amount: 200 }
  ];

  function getInputAmount(idx) {
    let val = parseInt(document.getElementById(`betInput${idx}`).value);
    if (isNaN(val) || val < 10) val = 10;
    return val;
  }

  function adjustBet(idx, delta) {
    if (slots[idx].status !== 'IDLE') return;
    let current = getInputAmount(idx) + delta;
    if (current < 10) current = 10;
    document.getElementById(`betInput${idx}`).value = current;
    slots[idx].amount = current;
    renderSlotButton(idx);
  }

  function setBet(idx, val) {
    if (slots[idx].status !== 'IDLE') return;
    document.getElementById(`betInput${idx}`).value = val;
    slots[idx].amount = val;
    renderSlotButton(idx);
  }

  [0, 1].forEach(idx => {
    document.getElementById(`betInput${idx}`).addEventListener('input', () => {
      slots[idx].amount = getInputAmount(idx);
      renderSlotButton(idx);
    });
  });

  function renderSlotButton(idx) {
    const btn = document.getElementById(`actionBtn${idx}`);
    const sub = document.getElementById(`btnSub${idx}`);
    const main = btn.querySelector('.btn-main-txt');
    const slot = slots[idx];

    btn.className = 'bet-action-btn';
    if (slot.status === 'IDLE') {
      btn.classList.add('btn-bet');
      main.innerText = gameState === 'FLYING' ? 'BET (NEXT)' : 'BET';
      sub.innerText = '₹' + getInputAmount(idx).toLocaleString();
    } else if (slot.status === 'QUEUED') {
      btn.classList.add('btn-cancel');
      main.innerText = 'CANCEL';
      sub.innerText = gameState === 'FLYING' ? 'Waiting Next Round' : '₹' + slot.amount.toLocaleString();
    } else if (slot.status === 'ACTIVE') {
      btn.classList.add('btn-cashout');
      main.innerText = 'CASHOUT';
      sub.innerText = '₹' + Math.floor(slot.amount * currentMultiplier).toLocaleString();
    }
  }

  function handleSlotClick(idx) {
    const slot = slots[idx];
    if (slot.status === 'IDLE') {
      const amt = getInputAmount(idx);
      if (gameBalance < amt) {
        showModal("LOW COINS", "Not enough practice coins. Tap Reset to get ₹10,000!", "⚠️");
        return;
      }
      gameBalance -= amt;
      updateWalletUI();
      slot.amount = amt;
      slot.status = 'QUEUED';
      renderSlotButton(idx);
    } else if (slot.status === 'QUEUED') {
      gameBalance += slot.amount;
      updateWalletUI();
      slot.status = 'IDLE';
      renderSlotButton(idx);
    } else if (slot.status === 'ACTIVE' && gameState === 'FLYING') {
      cashoutSlot(idx, currentMultiplier);
    }
  }

  function cashoutSlot(idx, mult) {
    const slot = slots[idx];
    if (slot.status !== 'ACTIVE') return;
    slot.status = 'IDLE';
    const winAmt = Math.floor(slot.amount * mult);
    gameBalance += winAmt;
    updateWalletUI();
    renderSlotButton(idx);
    playTone('cashout');
    showToast(`🎉 Bet ${idx + 1} Cashed @ ${mult.toFixed(2)}
