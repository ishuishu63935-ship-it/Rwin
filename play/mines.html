<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Minesweeper - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; }

.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.mine-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; background: #02040a; border: 2px solid var(--border-color); border-radius: 18px; padding: 12px; }

.tile { aspect-ratio: 1; background: #0f172a; border: 1.5px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: transform 0.1s, background 0.2s, border-color 0.2s; }
.tile:active { transform: scale(0.92); }
.tile.revealed-gem { background: rgba(16, 185, 129, 0.2); border-color: var(--neon-green); box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
.tile.revealed-mine { background: rgba(239, 68, 68, 0.25); border-color: var(--neon-red); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

.config-card { background: #04060d; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: center; }

.mine-select-row { display: flex; justify-content: center; gap: 8px; margin: 8px 0 12px 0; }
.mine-chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; border: 1px solid var(--border-color); }
.mine-chip.active { background: var(--neon-red); color: #fff; border-color: var(--neon-red); }

.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.main-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; color: #000; text-transform: uppercase; }
.btn-bet { background: linear-gradient(135deg, var(--neon-gold), #d97706); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
.btn-cashout { background: linear-gradient(135deg, var(--neon-green), #047857); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="mine-grid" id="mineGrid">
    <!-- 25 TILES GENERATED BY JS -->
  </div>

  <div class="config-card">
    <div style="font-size:11px; color:#94a3b8;">SELECT NUMBER OF MINES 💣</div>
    <div class="mine-select-row">
      <span class="mine-chip active" onclick="setMines(3, this)">3 MINES</span>
      <span class="mine-chip" onclick="setMines(5, this)">5 MINES</span>
      <span class="mine-chip" onclick="setMines(10, this)">10 MINES</span>
    </div>

    <div class="chip-row">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>

    <button class="main-btn btn-bet" id="mainBtn" onclick="handleAction()">START CASHOUT GAME 💣</button>
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'gem') {
      osc.frequency.setValueAtTime(587, now); osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'boom') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
      gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e) {}
}

let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let mineCount = 3;
let gameState = 'IDLE'; // IDLE, PLAYING
let minePositions = [];
let gemsRevealed = 0;

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  if (gameState !== 'IDLE') return;
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function setMines(cnt, el) {
  if (gameState !== 'IDLE') return;
  mineCount = cnt;
  document.querySelectorAll('.mine-chip').forEach(m => m.classList.remove('active'));
  el.classList.add('active');
}

function initBoard() {
  const grid = document.getElementById('mineGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    let t = document.createElement('div');
    t.className = 'tile';
    t.dataset.index = i;
    t.onclick = () => revealTile(i);
    grid.appendChild(t);
  }
}

function getMultiplier() {
  let safeTotal = 25 - mineCount;
  let multi = 1.0;
  for (let i = 0; i < gemsRevealed; i++) {
    multi *= (25 - i) / (safeTotal - i);
  }
  return parseFloat(multi.toFixed(2));
}

function handleAction() {
  if (gameState === 'IDLE') {
    if (bal < chip) return alert("Low balance!");
    bal -= chip;
    sync();

    gameState = 'PLAYING';
    gemsRevealed = 0;
    minePositions = [];

    while (minePositions.length < mineCount) {
      let r = Math.floor(Math.random() * 25);
      if (!minePositions.includes(r)) minePositions.push(r);
    }

    initBoard();
    const btn = document.getElementById('mainBtn');
    btn.className = "main-btn btn-cashout";
    btn.innerText = `CASHOUT ₹${chip} (1.00x)`;
  } else if (gameState === 'PLAYING') {
    if (gemsRevealed === 0) return alert("Pick at least 1 tile!");
    let winAmt = Math.floor(chip * getMultiplier());
    bal += winAmt;
    sync();
    playSound('win');
    alert(`🎉 CASHOUT SUCCESSFUL!\nYou Won ₹${winAmt}!`);
    endGame();
  }
}

function revealTile(idx) {
  if (gameState !== 'PLAYING') return;

  const tiles = document.querySelectorAll('.tile');
  let tile = tiles[idx];
  if (tile.classList.contains('revealed-gem') || tile.classList.contains('revealed-mine')) return;

  if (minePositions.includes(idx)) {
    playSound('boom');
    tile.classList.add('revealed-mine');
    tile.innerText = '💣';
    
    // Reveal all mines
    minePositions.forEach(p => {
      tiles[p].classList.add('revealed-mine');
      tiles[p].innerText = '💣';
    });

    alert("💥 BOOM! You hit a mine.");
    endGame();
  } else {
    playSound('gem');
    tile.classList.add('revealed-gem');
    tile.innerText = '💎';
    gemsRevealed++;

    let currentWin = Math.floor(chip * getMultiplier());
    document.getElementById('mainBtn').innerText = `CASHOUT ₹${currentWin} (${getMultiplier()}x)`;

    if (gemsRevealed === 25 - mineCount) {
      alert(`🏆 PERFECT CLEAR!\nYou Won ₹${currentWin}!`);
      bal += currentWin;
      sync();
      endGame();
    }
  }
}

function endGame() {
  gameState = 'IDLE';
  const btn = document.getElementById('mainBtn');
  btn.className = "main-btn btn-bet";
  btn.innerText = "START CASHOUT GAME 💣";
}

initBoard();
sync();
</script>
</body>
</html>
