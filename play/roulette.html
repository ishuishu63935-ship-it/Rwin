<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>European Roulette - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; }

.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.wheel-display { background: radial-gradient(circle, #022c22 0%, #02040a 100%); border: 2px solid var(--neon-green); border-radius: 18px; padding: 16px; text-align: center; margin: 12px 0; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
.res-ball { width: 64px; height: 64px; border-radius: 50%; background: #0f172a; border: 3px solid var(--neon-gold); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; margin: 0 auto 8px auto; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

.grid-36 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
.num-cell { aspect-ratio: 1.2; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
.num-red { background: linear-gradient(135deg, #ef4444, #991b1b); }
.num-black { background: linear-gradient(135deg, #1e293b, #0f172a); }
.num-zero { background: linear-gradient(135deg, #10b981, #047857); grid-column: span 6; aspect-ratio: auto; padding: 8px; }
.num-cell.selected { border: 2px solid var(--neon-gold); box-shadow: 0 0 10px var(--neon-gold); transform: scale(0.95); }

.outside-bets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.out-btn { padding: 10px 4px; border-radius: 8px; font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; background: #04060d; border: 1.5px solid var(--border-color); }
.out-btn.selected { border-color: var(--neon-gold); background: rgba(245, 158, 11, 0.15); }

.controls-card { background: #04060d; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: center; }
.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.spin-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, var(--neon-green), #047857); color: #fff; text-transform: uppercase; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="wheel-display">
    <div class="res-ball" id="resBall">--</div>
    <div style="font-size:11px; color:var(--neon-gold); font-weight:800;" id="statusTxt">PLACE YOUR BETS</div>
  </div>

  <div class="grid-36">
    <div class="num-cell num-zero" onclick="selectBet('NUM', 0, this)">0 (GREEN 36X)</div>
    <!-- Numbers 1 to 12 dynamically generated -->
  </div>

  <div class="outside-bets">
    <div class="out-btn" onclick="selectBet('COLOR', 'RED', this)" style="color:var(--neon-red);">RED 2X</div>
    <div class="out-btn" onclick="selectBet('COLOR', 'BLACK', this)" style="color:#cbd5e1;">BLACK 2X</div>
    <div class="out-btn" onclick="selectBet('EVEN_ODD', 'EVEN', this)">EVEN 2X</div>
    <div class="out-btn" onclick="selectBet('EVEN_ODD', 'ODD', this)">ODD 2X</div>
  </div>

  <div class="controls-card">
    <div class="chip-row">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinRoulette()">SPIN ROULETTE 🎡</button>
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'tick') {
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.04, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.02);
      osc.start(now); osc.stop(now + 0.02);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e) {}
}

let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let activeBet = null;
let isSpinning = false;

const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  if (isSpinning) return;
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function renderNumbers() {
  const grid = document.querySelector('.grid-36');
  for (let i = 1; i <= 18; i++) {
    let isRed = redNumbers.includes(i);
    let cell = document.createElement('div');
    cell.className = `num-cell ${isRed ? 'num-red' : 'num-black'}`;
    cell.innerText = i;
    cell.onclick = () => selectBet('NUM', i, cell);
    grid.appendChild(cell);
  }
}

function selectBet(type, val, el) {
  if (isSpinning) return;
  playSound('tick');
  activeBet = { type: type, val: val };
  document.querySelectorAll('.num-cell, .out-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('statusTxt').innerText = `BET: ${type} ${val} (₹${chip})`;
}

function spinRoulette() {
  if (isSpinning) return;
  if (!activeBet) return alert("Select a number or bet option first!");
  if (bal < chip) return alert("Low balance!");

  bal -= chip;
  sync();
  isSpinning = true;

  const btn = document.getElementById('spinBtn');
  btn.innerText = "SPINNING...";
  btn.disabled = true;

  let ballEl = document.getElementById('resBall');
  let ticks = 0;
  
  let spinInterval = setInterval(() => {
    ticks++;
    let randomNum = Math.floor(Math.random() * 37);
    ballEl.innerText = randomNum;
    playSound('tick');

    if (ticks > 25) {
      clearInterval(spinInterval);
      
      let finalNum = Math.floor(Math.random() * 37);
      let isRed = redNumbers.includes(finalNum);
      let isEven = (finalNum !== 0 && finalNum % 2 === 0);
      let colorName = (finalNum === 0) ? 'GREEN' : (isRed ? 'RED' : 'BLACK');

      ballEl.innerText = finalNum;
      ballEl.style.color = (colorName === 'RED') ? 'var(--neon-red)' : (colorName === 'GREEN' ? 'var(--neon-green)' : '#fff');

      let won = false;
      let winMulti = 0;

      if (activeBet.type === 'NUM' && activeBet.val === finalNum) { won = true; winMulti = 36; }
      else if (activeBet.type === 'COLOR' && activeBet.val === colorName) { won = true; winMulti = 2; }
      else if (activeBet.type === 'EVEN_ODD' && ((activeBet.val === 'EVEN' && isEven) || (activeBet.val === 'ODD' && !isEven && finalNum !== 0))) { won = true; winMulti = 2; }

      let winAmt = chip * winMulti;
      if (won) {
        bal += winAmt;
        sync();
        playSound('win');
        alert(`🎉 ROULETTE LANDED ON ${finalNum} (${colorName})!\nYou Won ₹${winAmt}!`);
      } else {
        alert(`💔 Landed on ${finalNum} (${colorName}).\nBetter luck next spin!`);
      }

      isSpinning = false;
      btn.innerText = "SPIN ROULETTE 🎡";
      btn.disabled = false;
      document.getElementById('statusTxt').innerText = "PLACE YOUR BETS";
    }
  }, 100);
}

renderNumbers();
sync();
</script>
</body>
</html>
