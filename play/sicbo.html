<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sic Bo Dice Roller - VIP Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon-gold: #f59e0b;
  --neon-blue: #00e5ff;
  --neon-green: #10b981;
  --neon-red: #ef4444;
  --neon-purple: #a855f7;
  --bg-dark: #04060d;
  --card-bg: #0b101d;
  --border-color: #1e293b;
}

* { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
body { margin: 0; padding: 0; background: var(--bg-dark); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; }

.container { max-width: 480px; margin: 0 auto; background: var(--card-bg); min-height: 100vh; padding: 12px; }

.header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
.back-btn { padding: 6px 12px; background: var(--border-color); color: var(--neon-blue); border: 1px solid var(--neon-blue); border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: 700; }
.bal-pill { background: #1e1b4b; border: 1px solid var(--neon-gold); border-radius: 20px; padding: 4px 12px; font-weight: 800; color: var(--neon-gold); font-size: 13px; }

.dice-arena { background: radial-gradient(circle, #3b0764 0%, #02040a 100%); border: 2px solid var(--neon-purple); border-radius: 20px; margin: 12px 0; padding: 18px; text-align: center; box-shadow: 0 0 20px rgba(168, 85, 247, 0.25); }

.dice-row { display: flex; justify-content: center; gap: 14px; margin: 14px 0; }
.dice-box { width: 62px; height: 62px; background: #fff; border-radius: 12px; color: #000; font-size: 34px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 15px rgba(0,0,0,0.6); border: 3px solid #cbd5e1; }
.dice-box.rolling { animation: diceShake 0.1s infinite linear; }

@keyframes diceShake {
  0% { transform: rotate(-8deg) scale(0.95); }
  50% { transform: rotate(8deg) scale(1.05); }
  100% { transform: rotate(-8deg) scale(0.95); }
}

.sum-pill { display: inline-block; background: rgba(0,0,0,0.6); border: 1px solid var(--neon-gold); color: var(--neon-gold); padding: 4px 16px; border-radius: 20px; font-weight: 900; font-size: 13px; }

.bet-options { display: grid; grid-template-columns: 1fr 0.8fr 1fr; gap: 8px; margin-bottom: 12px; }
.bet-box { background: #04060d; border: 1.5px solid var(--border-color); border-radius: 14px; padding: 12px 6px; text-align: center; cursor: pointer; }
.bet-box.selected { border-color: var(--neon-gold); background: rgba(245, 158, 11, 0.12); }

.controls-card { background: #04060d; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px; text-align: center; }
.chip-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 14px; background: #1e293b; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; color: #94a3b8; }
.chip.active { background: var(--neon-gold); color: #000; }

.roll-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, var(--neon-purple), #7c3aed); color: #fff; text-transform: uppercase; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="../game.html" class="back-btn">⬅️ Hub</a>
    <div class="bal-pill">💰 <span id="balTxt">₹10,000</span></div>
  </div>

  <div class="dice-arena">
    <div style="font-size:11px; color:#c084fc; font-weight:800;">SIC BO 3-DICE ROLLER</div>

    <div class="dice-row">
      <div class="dice-box" id="dice1">🎲</div>
      <div class="dice-box" id="dice2">🎲</div>
      <div class="dice-box" id="dice3">🎲</div>
    </div>

    <div class="sum-pill">SUM: <span id="sumTxt">?</span></div>
  </div>

  <div style="font-size:11px; color:#94a3b8; margin-bottom:6px; text-align:center;">CHOOSE YOUR BET TYPE</div>
  <div class="bet-options">
    <div class="bet-box selected" onclick="selectBet('SMALL', this)">
      <div style="font-size:13px; font-weight:900; color:var(--neon-blue);">SMALL</div>
      <div style="font-size:9px; color:#94a3b8;">(Sum 4-10)</div>
      <div style="font-size:11px; font-weight:800; color:var(--neon-gold);">2.0X</div>
    </div>

    <div class="bet-box" onclick="selectBet('TRIPLE', this)">
      <div style="font-size:13px; font-weight:900; color:var(--neon-green);">ANY TRIPLE</div>
      <div style="font-size:9px; color:#94a3b8;">(Same 3 Dice)</div>
      <div style="font-size:11px; font-weight:800; color:var(--neon-gold);">30.0X</div>
    </div>

    <div class="bet-box" onclick="selectBet('BIG', this)">
      <div style="font-size:13px; font-weight:900; color:var(--neon-red);">BIG</div>
      <div style="font-size:9px; color:#94a3b8;">(Sum 11-17)</div>
      <div style="font-size:11px; font-weight:800; color:var(--neon-gold);">2.0X</div>
    </div>
  </div>

  <div class="controls-card">
    <div class="chip-row">
      <span class="chip active" onclick="setChip(100, this)">₹100</span>
      <span class="chip" onclick="setChip(500, this)">₹500</span>
      <span class="chip" onclick="setChip(1000, this)">₹1,000</span>
    </div>

    <button class="roll-btn" id="rollBtn" onclick="rollSicBo()">SHAKE & ROLL 🎲</button>
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'roll') {
      osc.frequency.setValueAtTime(300, now);
      gain.gain.setValueAtTime(0.04, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
      osc.start(now); osc.stop(now + 0.03);
    } else if (type === 'win') {
      osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch(e) {}
}

let bal = parseInt(localStorage.getItem('rwin_balance') || '10000');
let chip = 100;
let activeBet = 'SMALL';
let isRolling = false;

const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

function sync() {
  localStorage.setItem('rwin_balance', bal.toString());
  document.getElementById('balTxt').innerText = "₹" + bal.toLocaleString();
}

function setChip(amt, el) {
  if (isRolling) return;
  chip = amt;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function selectBet(type, el) {
  if (isRolling) return;
  playSound('roll');
  activeBet = type;
  document.querySelectorAll('.bet-box').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function rollSicBo() {
  if (isRolling) return;
  if (bal < chip) return alert("Low balance!");

  bal -= chip;
  sync();
  isRolling = true;

  const btn = document.getElementById('rollBtn');
  btn.innerText = "SHAKING...";
  btn.disabled = true;

  const d1 = document.getElementById('dice1');
  const d2 = document.getElementById('dice2');
  const d3 = document.getElementById('dice3');

  d1.classList.add('rolling');
  d2.classList.add('rolling');
  d3.classList.add('rolling');

  let ticks = 0;
  let interval = setInterval(() => {
    ticks++;
    d1.innerText = diceFaces[Math.floor(Math.random() * 6)];
    d2.innerText = diceFaces[Math.floor(Math.random() * 6)];
    d3.innerText = diceFaces[Math.floor(Math.random() * 6)];
    playSound('roll');

    if (ticks > 18) {
      clearInterval(interval);
      d1.classList.remove('rolling');
      d2.classList.remove('rolling');
      d3.classList.remove('rolling');

      let v1 = Math.floor(Math.random() * 6) + 1;
      let v2 = Math.floor(Math.random() * 6) + 1;
      let v3 = Math.floor(Math.random() * 6) + 1;
      let total = v1 + v2 + v3;

      d1.innerText = diceFaces[v1 - 1];
      d2.innerText = diceFaces[v2 - 1];
      d3.innerText = diceFaces[v3 - 1];
      document.getElementById('sumTxt').innerText = total;

      let isTriple = (v1 === v2 && v2 === v3);
      let outcome = isTriple ? 'TRIPLE' : (total <= 10 ? 'SMALL' : 'BIG');

      let won = (activeBet === outcome);
      let winMulti = (outcome === 'TRIPLE') ? 30.0 : 2.0;
      let winAmt = Math.floor(chip * winMulti);

      if (won) {
        bal += winAmt;
        sync();
        playSound('win');
        alert(`🎉 SIC BO RESULT: ${total} (${outcome})!\nYou Won ₹${winAmt}!`);
      } else {
        alert(`💔 Result: ${total} (${outcome}).\nBetter luck next roll!`);
      }

      isRolling = false;
      btn.innerText = "SHAKE & ROLL 🎲";
      btn.disabled = false;
    }
  }, 90);
}

sync();
</script>
</body>
</html>
