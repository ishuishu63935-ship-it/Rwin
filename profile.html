<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RWIN Profile</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="home">

<div class="profileHeader">

<div class="profileAvatar">
👤
</div>


<h1 id="userDisplayName">Guest User</h1>
  <p id="userEmailDisplay">Practice Player</p>

</div>

<div class="membershipCard">

<h3>Membership</h3>

<p>Premium Active ✅</p>

</div>

<div class="membershipCard">

<h3>Virtual Balance</h3>

<h2>10,000 Coins</h2>

</div>

<div class="membershipCard">

<h3>Practice Stats</h3>

<p>Total Sessions : 0</p>
<p>Wins : 0</p>
<p>Level : Beginner</p>

</div>

<div class="membershipCard">

<button id="logoutBtn">
Logout
</button>

</div>

<div style="margin-top:20px;text-align:center;">

<a href="home.html" class="menuBox">

🏠<br>Home

</a>

</div>

</div>

<script src="script.js"></script>
<script type="module">
  import { auth } from "./firebase.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // Check Auth State
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // User is logged in - display email or name
      const nameHeading = document.getElementById("userDisplayName");
      const emailParagraph = document.getElementById("userEmailDisplay");
      
      if (nameHeading) {
        nameHeading.innerText = user.displayName || user.email.split('@')[0];
      }
      if (emailParagraph) {
        emailParagraph.innerText = user.email;
      }
    } else {
      // If not logged in, send to login page
      window.location.href = "login.html";
    }
  });

  // Logout Functionality
  const logoutBtn = document.querySelector(".logoutBtn") || document.querySelector("button:contains('Logout')") || document.querySelectorAll("button")[0];
  
  // Tag your Logout button with id="logoutBtn" in HTML for clean selection
  const btn = document.getElementById("logoutBtn");
  if (btn) {
    btn.addEventListener("click", () => {
      signOut(auth).then(() => {
        localStorage.clear();
        window.location.href = "index.html";
      }).catch((error) => {
        console.error("Logout Error:", error);
      });
    });
  }
</script>
  
</body>
</html>
