
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RWIN Profile</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="home">

<div class="profileHeader">

<div class="profileAvatar">
👤
</div>

<h1 id="userDisplayName">Loading...</h1>
<p id="userEmailDisplay">Checking user...</p>

</div>

<div class="membershipCard">

<h3>Membership</h3>
<p id="membershipText" style="font-weight: 600;">Checking Status...</p>

</div>

<div class="membershipCard">

<h3>Virtual Balance</h3>
<h2 id="userCoinsDisplay">10,000 Coins</h2>

</div>

<div class="membershipCard">

<h3>Practice Stats</h3>

<p>Total Sessions : <span id="totalSessions">0</span></p>
<p>Wins : <span id="totalWins">0</span></p>
<p>Level : <span id="userLevel">Beginner</span></p>

</div>

<div class="membershipCard">

<button id="logoutBtn" style="cursor: pointer;">
Logout
</button>

</div>

<div style="margin-top:20px;text-align:center;">

<a href="home.html" class="menuBox">

🏠<br>Home

</a>

</div>

</div>

<script src="script.js"></script>
<script type="module">
  import { auth } from "./firebase.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // Check Auth State and Dynamic Data Update
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // 1. Display Logged-in User Info
      const nameHeading = document.getElementById("userDisplayName");
      const emailParagraph = document.getElementById("userEmailDisplay");
      
      if (nameHeading) {
        nameHeading.innerText = user.displayName || user.email.split('@')[0];
      }
      if (emailParagraph) {
        emailParagraph.innerText = user.email;
      }

      // 2. Dynamic Membership Status Check
      const membershipText = document.getElementById("membershipText");
      const gameData = JSON.parse(localStorage.getItem("rwinGame")) || {};
      
      if (membershipText) {
        if (gameData.membership === true) {
          membershipText.innerText = "Premium Active ✅";
          membershipText.style.color = "#00FF66";
        } else {
          membershipText.innerText = "Free Plan 🆓";
          membershipText.style.color = "#FFD700";
        }
      }

    } else {
      // If not logged in, redirect to login page
      window.location.href = "login.html";
    }
  });

  // 3. Logout Functionality Fix
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        localStorage.clear();
        window.location.href = "index.html";
      }).catch((error) => {
        console.error("Logout Error:", error);
      });
    });
  }
</script>
  
</body>
</html>
