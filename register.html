
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWIN - Register</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<div class="auth-container">
  <div class="auth-card">
    <h1 style="color:var(--neon-blue); font-size:28px; font-weight:800; margin-bottom:6px;">RWIN VIP</h1>
    <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">Create your account to start playing</p>

    <input type="email" id="email" class="input-field" placeholder="Enter Email Address">
    <input type="password" id="password" class="input-field" placeholder="Create Password (min 6 chars)">

    <!-- Status/Error Message -->
    <p id="loginStatus" style="color:#ff4d4d; font-size:12px; margin-top:8px; min-height:18px; font-weight:600;"></p>

    <button id="signupBtn" class="btn-primary">CREATE ACCOUNT</button>

    <p style="margin-top:18px; font-size:12px; color:#94a3b8;">
      Already have an account? <a href="login.html" style="color:var(--neon-blue); text-decoration:none; font-weight:700;">Login Here</a>
    </p>
  </div>
</div>

<!-- Modern Firebase V10 Module Load -->
<script type="module" src="firebase.js"></script>
</body>
</html>
