<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Checkout - RWIN Space</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    background-color: #0d1117;
    color: #c9d1d9;
    font-family: 'Poppins', sans-serif;
    margin: 0; padding: 15px;
  }
  .container {
    max-width: 420px; margin: 0 auto;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #58a6ff; font-weight: 600;
  }
  .plans-container {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
  }
  .plan-card {
    background: #161b22; border: 2px solid #30363d; border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; transition: 0.2s;
  }
  .plan-card.active {
    border-color: #58a6ff; background: #1f242c;
  }
  .plan-card h4 { margin: 0 0 5px 0; color: #f0f6fc; font-size: 14px; }
  .plan-card p { margin: 0; font-size: 13px; color: #d29922; font-weight: bold; }
  .plan-card span { font-size: 10px; color: #8b949e; }

  .payment-box {
    border: 2px dashed #d29922; border-radius: 10px; padding: 15px; text-align: center; background-color: #161b22; margin-bottom: 15px;
  }
  #qrImg {
    background: white; padding: 8px; border-radius: 8px; display: inline-block; margin: 10px 0; width: 140px; height: 140px;
  }
  .btn-direct-pay {
    background-color: #238636; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-decoration: none; display: block; text-align: center; box-sizing: border-box;
  }
  .utr-box {
    border: 1px solid #388bfd; border-radius: 10px; padding: 15px; text-align: center; background-color: #161b22; margin-bottom: 20px;
  }
  .utr-input {
    width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; text-align: center; font-size: 16px; letter-spacing: 2px;
  }
  .btn-verify {
    background-color: #d29922; color: #0d1117; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer;
  }
  .msg { font-size: 13px; margin-top: 10px; display: none; }
  .error { color: #f85149; }
  .success { color: #3fb950; }
  .warning { color: #d29922; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <a href="home.html" style="color:#58a6ff; text-decoration:none;">⬅ BACK</a>
    <span>VIP MEMBERSHIP PLANS</span>
  </div>

  <!-- 3 Exact Membership Cards -->
  <div class="plans-container">
    <div class="plan-card active" onclick="selectPlan(9, 12, this)">
      <h4>Starter</h4>
      <p>₹9</p>
      <span>12 Days</span>
    </div>
    <div class="plan-card" onclick="selectPlan(99, 30, this)">
      <h4>Monthly</h4>
      <p>₹99</p>
      <span>1 Month</span>
    </div>
    <div class="plan-card" onclick="selectPlan(499, 365, this)">
      <h4>Elite</h4>
      <p>₹499</p>
      <span>1 Year</span>
    </div>
  </div>

  <!-- QR Code Section -->
  <div class="payment-box">
    <p style="margin:0; font-weight:600; color:#d29922; font-size:13px;">📲 SCAN & PAY VIA UPI</p>
    <p style="font-size: 13px; margin:5px 0;">Amount: <strong id="displayAmount" style="color:#fff;">₹9</strong> (<span id="displayDays">12 Days Access</span>)</p>
    
    <div>
      <img id="qrImg" src="" alt="UPI QR">
    </div>
    
    <p style="font-size: 11px; color: #8b949e; margin:5px 0 0 0;">UPI ID: 7415325460-2@ibl</p>
  </div>

  <!-- Direct UPI App Button -->
  <a href="#" id="directPayBtn" class="btn-direct-pay">PAY ₹9 VIA UPI APP</a>

  <!-- UTR Verification Box -->
  <div class="utr-box">
    <p style="margin:0; font-weight:600; color:#58a6ff; font-size:13px;">🔑 ENTER 12-DIGIT UTR NUMBER</p>
    <p style="font-size: 11px; color: #8b949e; margin-top:3px;">Payment ke baad app se 12-digit UTR yahan daalein:</p>
    
    <input type="number" id="utrInput" class="utr-input" placeholder="e.g. 624623292059">
    
    <button class="btn-verify" onclick="verifyRealUTR()">VERIFY & UNLOCK 18 GAMES 🚀</button>
    
    <div id="utrMsg" class="msg"></div>
  </div>
</div>

<!-- Firebase Module Scripts -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://rwin-e6021-default-rtdb.firebaseio.com/"
  };
  
  let db;
  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
  } catch(e) {
    db = getDatabase();
  }

  let currentAmount = 9;
  let selectedDays = 12;

  window.selectPlan = function(amount, days, element) {
    currentAmount = amount;
    selectedDays = days;
    document.getElementById('displayAmount').innerText = `₹${amount}`;
    document.getElementById('displayDays').innerText = `${days} Days Access`;
    document.getElementById('directPayBtn').innerText = `PAY ₹${amount} VIA UPI APP`;
    
    let cards = document.getElementsByClassName('plan-card');
    for(let card of cards) { card.classList.remove('active'); }
    element.classList.add('active');

    updatePaymentQR(amount);
  }

  function updatePaymentQR(amount) {
    let upiString = `upi://pay?pa=7415325460-2@ibl&pn=RWIN%20Space&cu=INR&am=${amount}`;
    document.getElementById('directPayBtn').href = upiString;
    document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiString)}`;
  }

  updatePaymentQR(9);

  window.verifyRealUTR = async function() {
    let utr = document.getElementById('utrInput').value.trim();
    let msgBox = document.getElementById('utrMsg');
    
    msgBox.style.display = 'block';

    if (utr.length !== 12 || isNaN(utr)) {
      msgBox.className = "msg error";
      msgBox.innerText = "❌ Invalid UTR. Must be exactly 12 numbers.";
      return;
    }

    msgBox.className = "msg warning";
    msgBox.innerText = "⏳ Verifying UTR with database...";

    try {
      const paymentRef = ref(db, `utr_requests/${utr}`);
      const snapshot = await get(paymentRef);

      if (snapshot.exists()) {
        const pData = snapshot.val();

        if (pData.status === "used") {
          msgBox.className = "msg error";
          msgBox.innerText = "⚠️ Yeh UTR pehle hi use ho chuka hai!";
          return;
        }

        if (!pData.amount || pData.amount >= currentAmount) {
          await update(paymentRef, { status: "used" });

          let userEmail = localStorage.getItem("rwin_user_email") || "guest";
          let cleanEmailKey = userEmail.replace(/\./g, '_');
          
          const userRef = ref(db, `users/${cleanEmailKey}`);
          await update(userRef, {
            isVIP: true,
            membershipDays: selectedDays,
            coins: 10000,
            vipExpiry: Date.now() + (selectedDays * 24 * 60 * 60 * 1000)
          });

          msgBox.className = "msg success";
          msgBox.innerText = "✅ Payment Verified! 18 Games Unlocked & Coins Reset to 10,000! 🚀";

          setTimeout(() => {
            window.location.href = "home.html";
          }, 2000);

        } else {
          msgBox.className = "msg error";
          msgBox.innerText = `❌ Amount Mismatch! Aapne ₹${pData.amount} bheje hain, plan ₹${currentAmount} ka hai.`;
        }
      } else {
        msgBox.className = "msg error";
        msgBox.innerText = "❌ UTR Not Found in Database! (Automate app ka sync check karein)";
      }
    } catch (err) {
      console.error(err);
      msgBox.className = "msg error";
      msgBox.innerText = "⚠️ Connection Error. Firebase rules check karein.";
    }
  }
</script>

</body>
</html>
